{{- if .Values.worker.enabled }}
{{- $configEntry := include "batlehub.configManifestEntry" . | fromYaml }}
# The worker role (RFC 0018 §5.4): the same config, the same database and
# storage, started with `--roles worker` from the worker image — the one that
# carries bubblewrap, postmortem and the Trivy client, or its `-guarddog`
# variant where that optional scanner is enabled. It answers no
# HTTP but /livez and /metrics, opens artifacts nothing else opens, and is
# where a scanner's egress is allowed. The proxy Deployment keeps running its
# embedded worker unless `config.server.roles` says otherwise; set it to
# `["proxy"]` when this Deployment is enabled so scanning happens here only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "batlehub.fullname" . }}-worker
  labels:
    {{- include "batlehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "batlehub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        {{- if not $configEntry.name }}
        checksum/config: {{ include "batlehub.config" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "batlehub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "batlehub.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.worker.runtimeClassName }}
      # The opt-in fourth wall (RFC 0018 §7): gVisor or Kata around the whole
      # pod, on top of the bubblewrap sandbox around each scanner.
      runtimeClassName: {{ . }}
      {{- end }}
      volumes:
        - name: config
          {{- if $configEntry.name }}
          {{- if eq $configEntry.kind "ConfigMap" }}
          configMap:
            name: {{ $configEntry.name }}
          {{- else }}
          secret:
            secretName: {{ $configEntry.name }}
          {{- end }}
          {{- else }}
          secret:
            secretName: {{ include "batlehub.fullname" . }}-config
          {{- end }}
        # The per-job work directories: the only place a scanner writes, and
        # gone with the pod. Memory-backed so a hostile archive's bytes never
        # touch the node's disk, bounded by `worker.scratch.sizeLimit`.
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.worker.scratch.sizeLimit }}
        {{- if eq .Values.config.storage.type "filesystem" }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-cache" (include "batlehub.fullname" .)) }}
        {{- end }}
      containers:
        - name: worker
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          args:
            - --config
            - /etc/batlehub/config.toml
            - --roles
            - worker
          env:
            - name: TMPDIR
              value: /tmp/batlehub
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/batlehub
              readOnly: true
            - name: scratch
              mountPath: /tmp/batlehub
            {{- if eq .Values.config.storage.type "filesystem" }}
            - name: cache
              mountPath: {{ .Values.config.storage.path }}
            {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
