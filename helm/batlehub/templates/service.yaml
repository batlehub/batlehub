apiVersion: v1
kind: Service
metadata:
  name: {{ include "batlehub.fullname" . }}
  labels:
    {{- include "batlehub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "batlehub.selectorLabels" . | nindent 4 }}
    {{- /* No component label: pods of an older chart lack it, so naming it
         would empty the Service on upgrade. Worker pods match this selector
         but expose no port named `http`, so they are never an endpoint. */}}
