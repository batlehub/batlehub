{{- $configEntry := include "batlehub.configManifestEntry" . | fromYaml }}
{{- $asConfigCount := 0 }}
{{- range .Values.externalManifest }}
{{- if and (eq (include "batlehub.manifestEnabled" .) "true") .mount }}
{{- if not (or (eq .kind "Secret") (eq .kind "ConfigMap")) }}
{{- fail (printf "externalManifest %q: mount requires kind to be 'Secret' or 'ConfigMap', got: %s" .name .kind) }}
{{- end }}
{{- if .mount.asConfig }}
{{- $asConfigCount = add $asConfigCount 1 }}
{{- else if not .mount.mountPath }}
{{- fail (printf "externalManifest %q: mount.mountPath is required unless mount.asConfig is true" .name) }}
{{- end }}
{{- end }}
{{- end }}
{{- if gt $asConfigCount 1 }}
{{- fail "externalManifest: only one entry may set mount.asConfig: true" }}
{{- end }}
{{- if not (has .Values.writableConfig.seed (list "IfNotPresent" "Always")) }}
{{- fail (printf "writableConfig.seed must be IfNotPresent or Always, got: %v" .Values.writableConfig.seed) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "batlehub.fullname" . }}
  labels:
    {{- include "batlehub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "batlehub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not $configEntry.name }}
        checksum/config: {{ include "batlehub.config" . | sha256sum }}
        {{- end }}
        {{- $mountedManifests := list }}
        {{- range .Values.externalManifest }}
        {{- if and (eq (include "batlehub.manifestEnabled" .) "true") .mount .manifest }}
        {{- $mountedManifests = append $mountedManifests . }}
        {{- end }}
        {{- end }}
        {{- if $mountedManifests }}
        checksum/extra-manifests: {{ $mountedManifests | toYaml | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "batlehub.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "batlehub.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "batlehub.automountServiceAccountToken" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: config
          {{- if $configEntry.name }}
          {{- if eq $configEntry.kind "ConfigMap" }}
          configMap:
            name: {{ $configEntry.name }}
            {{- with $configEntry.mount.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- else }}
          secret:
            secretName: {{ $configEntry.name }}
            {{- with $configEntry.mount.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
          {{- else }}
          secret:
            secretName: {{ include "batlehub.fullname" . }}-config
            items:
              - key: config.toml
                path: config.toml
          {{- end }}
        {{- if .Values.writableConfig.enabled }}
        # The writable first config file (`writableConfig`): the `config` volume
        # above is only its seed, read by the init container.
        - name: config-writable
          persistentVolumeClaim:
            claimName: {{ .Values.writableConfig.persistence.existingClaim | default (printf "%s-writable-config" (include "batlehub.fullname" .)) }}
        {{- end }}
        {{- with (include "batlehub.credentialsSecretName" .) }}
        # Mounted as its own volume rather than a second key in the config one:
        # the two have different lifecycles, which is the whole reason the layer
        # exists, and a Secret the operator manages elsewhere cannot be projected
        # into a Secret this chart renders.
        - name: credentials
          secret:
            secretName: {{ . }}
            items:
              - key: {{ $.Values.credentials.key }}
                path: {{ $.Values.credentials.key }}
        {{- end }}
        {{- if eq .Values.config.storage.type "filesystem" }}
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-cache" (include "batlehub.fullname" .)) }}
          {{- else }}
          # Filesystem storage with persistence disabled: the cache is ephemeral
          # and dies with the pod, which is the documented behaviour. It still
          # needs a *writable* path — `readOnlyRootFilesystem: true` means the
          # container filesystem cannot supply one, so every artifact write would
          # fail on a deployment that used to work. An emptyDir restores exactly
          # the previous semantics without giving up the read-only root.
          emptyDir:
            sizeLimit: {{ .Values.persistence.ephemeralSizeLimit | default "1Gi" }}
          {{- end }}
        {{- end }}
        {{- range .Values.externalManifest }}
        {{- if and (eq (include "batlehub.manifestEnabled" .) "true") .mount (not .mount.asConfig) }}
        - name: extra-{{ .name }}
          {{- if eq .kind "ConfigMap" }}
          configMap:
            name: {{ .name }}
            {{- with .mount.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- else }}
          secret:
            secretName: {{ .name }}
            {{- with .mount.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}
      {{- with .Values.writableConfig }}
      {{- if .enabled }}
      initContainers:
        # Seeds the writable config file from the chart's. Written beside the
        # target then renamed, so a pod killed mid-copy never leaves the server
        # a truncated file to start on.
        - name: seed-config
          image: "{{ .initImage.repository }}:{{ .initImage.tag }}"
          imagePullPolicy: {{ .initImage.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            - name: SEED
              value: {{ .seed | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              if [ "$SEED" = Always ] || [ ! -f /etc/batlehub/config.toml ]; then
                cp /etc/batlehub-seed/config.toml /etc/batlehub/.config.toml.seed
                mv /etc/batlehub/.config.toml.seed /etc/batlehub/config.toml
                echo "seeded /etc/batlehub/config.toml from the chart's configuration ($SEED)"
              else
                echo "kept the existing /etc/batlehub/config.toml ($SEED)"
              fi
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/batlehub-seed
              readOnly: true
            - name: config-writable
              mountPath: /etc/batlehub
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/batlehub/config.toml
            {{- if (include "batlehub.credentialsSecretName" .) }}
            - --config
            - /etc/batlehub/credentials/{{ .Values.credentials.key }}
            {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.server.port }}
              protocol: TCP
          # Probes must stay on unauthenticated endpoints: the kubelet sends no
          # credentials, so anything under /api/v1/admin answers 403 and the pod
          # never becomes Ready. /livez and /healthz are the only two routes
          # exempt from auth by design.
          #
          # Liveness checks the process only. Readiness is what reacts to a
          # dependency outage — /healthz answers 503 when Postgres or the object
          # store is unreachable, which drops the pod from the Service endpoints
          # without restarting it. Restarting would not reach the dependency.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.writableConfig.enabled }}
            - name: config-writable
              mountPath: /etc/batlehub
            {{- else }}
            - name: config
              mountPath: /etc/batlehub
              readOnly: true
            {{- end }}
            {{- if (include "batlehub.credentialsSecretName" .) }}
            - name: credentials
              mountPath: /etc/batlehub/credentials
              readOnly: true
            {{- end }}
            {{- if eq .Values.config.storage.type "filesystem" }}
            - name: cache
              mountPath: {{ .Values.config.storage.path }}
            {{- end }}
            {{- range .Values.externalManifest }}
            {{- if and (eq (include "batlehub.manifestEnabled" .) "true") .mount (not .mount.asConfig) }}
            - name: extra-{{ .name }}
              mountPath: {{ .mount.mountPath }}
              {{- with .mount.subPath }}
              subPath: {{ . }}
              {{- end }}
              readOnly: {{ if hasKey .mount "readOnly" }}{{ .mount.readOnly }}{{ else }}true{{ end }}
            {{- end }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
