{{- /*
  The second config layer, when the chart is the one that renders it.

  Skipped entirely when `credentials.existingSecret` names a Secret managed
  elsewhere (External Secrets Operator, Sealed Secrets, Vault Agent): the
  deployment mounts that one instead, and rendering a second Secret here would
  either collide with it or sit unused.

  No checksum annotation refers to this Secret anywhere in the chart. That is
  the point: a mounted Secret is updated in place by the kubelet and picked up
  by the config file watcher, so rotating a credential does not roll the pods.
*/ -}}
{{- if and .Values.credentials.enabled (not .Values.credentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "batlehub.fullname" . }}-credentials
  labels:
    {{- include "batlehub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.credentials.key }}: |
    {{- include "batlehub.credentialsConfig" . | nindent 4 }}
{{- end }}
