{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (eq .Values.config.storage.type "filesystem") -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "batlehub.fullname" . }}-cache
  labels:
    {{- include "batlehub.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- $wc := .Values.writableConfig }}
{{- if and $wc.enabled (not $wc.persistence.existingClaim) }}
---
# The writable first config file (`writableConfig`). Kept on uninstall: it may
# hold the only copy of a configuration written through the editor or by an
# operator, which the chart's values no longer describe.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "batlehub.fullname" . }}-writable-config
  labels:
    {{- include "batlehub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ $wc.persistence.accessMode }}
  {{- if $wc.persistence.storageClass }}
  storageClassName: {{ $wc.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ $wc.persistence.size }}
{{- end }}
