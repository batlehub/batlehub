# Default values for batlehub.
# Override with: helm install batlehub ./helm/batlehub -f my-values.yaml

replicaCount: 1

image:
  repository: ghcr.io/batleforc/batlehub
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to Chart.appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # No RBAC roles are bound to this ServiceAccount, so the projected token
  # would be unused — disable automounting it into the pod. Automatically
  # forced to true (regardless of this value) when config.auth contains a
  # `type = "kubernetes"` entry, since that provider reads its own projected
  # token to call the TokenReview API.
  automountServiceAccountToken: false
  rbac:
    # Auto-create a ClusterRole + ClusterRoleBinding granting this
    # ServiceAccount `create` on authentication.k8s.io/tokenreviews,
    # whenever config.auth contains an entry with type = "kubernetes".
    # Set to false if you manage this ClusterRoleBinding yourself or point
    # at an existing ServiceAccount that already has it.
    autoTokenReview: true

podAnnotations: {}

# ── Security context ──────────────────────────────────────────────────────────
# Both container images declare `USER 65532:65532`, so these values match what
# the image already does — they exist so the *cluster* enforces it too, and so a
# Pod Security Admission "restricted" namespace admits the pod unmodified.
#
# fsGroup makes the artifact-cache PVC writable by that UID; without it a
# filesystem-storage deployment fails its first write. Drop the whole block only
# if you have a specific reason, and know the workload then runs as root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem is safe here: the server writes only to the cache mount
# (its own volume) and never to a temp directory. If you add a feature that needs
# scratch space, mount an emptyDir rather than relaxing this.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: batlehub.example.com
  # Additional hostnames routed to BatleHub, for host-based registry routing
  # (`config.subdomain_routing` / a registry's `hosts`). A wildcard entry covers
  # every derived registry host at once.
  #
  #   extraHosts:
  #     - "*.batlehub.example.com"
  #     - "npm.acme.io"
  #
  # This only extends the Ingress: it adds rules so the controller accepts these
  # hostnames. It turns nothing on inside BatleHub — host routing itself comes
  # from `config.subdomain_routing` or a registry's `hosts`, and it is *those*
  # that make `config.server.trusted_proxies` mandatory (the server refuses to
  # start with host routing configured and no proxy-trust policy). Set both.
  extraHosts: []
  tls: []
  #  - secretName: batlehub-tls
  #    hosts:
  #      - batlehub.example.com
  #      # The certificate must carry a SAN for every extra host, including the
  #      # wildcard: "*.batlehub.example.com".
  #      - "*.batlehub.example.com"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    memory: 512Mi
    ephemeral-storage: 1Gi

# ── Environment variables ─────────────────────────────────────────────────────
# Injected into the container at runtime. Use together with ${VAR_NAME}
# placeholders inside config values — BatleHub expands them before parsing
# the TOML file.
#
# If a placeholder references a variable that is not present in the container,
# BatleHub exits immediately with a clear error naming the missing variable.
#
# Plain literal value (avoid for real secrets — use secretKeyRef instead):
# env:
#   - name: OIDC_CLIENT_SECRET
#     value: "my-secret"
#
# From a Kubernetes Secret (recommended):
# env:
#   - name: OIDC_CLIENT_SECRET
#     valueFrom:
#       secretKeyRef:
#         name: batlehub-secrets
#         key: oidc-client-secret
#   - name: REGISTRY_TOKEN
#     valueFrom:
#       secretKeyRef:
#         name: batlehub-secrets
#         key: registry-token
env: []

# Inject every key from a Secret or ConfigMap as env vars (bulk import):
# envFrom:
#   - secretRef:
#       name: batlehub-secrets      # all keys become env vars
#   - configMapRef:
#       name: batlehub-env
envFrom: []

nodeSelector: {}
tolerations: []
affinity: {}

# ── BatleHub application config ───────────────────────────────────────────────
# This object is serialized verbatim to config.toml via toToml.
# All keys must be snake_case to match batlehub's TOML field names.
# Optional top-level sections (otel, cache, limits, ip_blocking) must be
# entirely absent — not null or {} — to be omitted from the rendered TOML.
config:

  # ── [server] ────────────────────────────────────────────────────────────────
  server:
    host: "0.0.0.0"
    port: 8080
    # static_dir: "/app/ui/dist"
    #
    # Origins allowed to make cross-origin requests and read the responses.
    # Absent or empty (the default since 1.1.0) means same-origin only. The chart
    # serves the SPA from the same origin as the API, so leave this unset unless
    # your UI lives elsewhere. "*" reopens it to every origin and raises a
    # `cors.any-origin` config warning.
    # cors_allowed_origins:
    #   - "https://batlehub.example.com"
    #
    # CIDR ranges (or bare IPs) of the reverse proxies in front of BatleHub.
    # `Forwarded` / `X-Forwarded-Host` / `X-Forwarded-Proto` / `X-Forwarded-For`
    # are honoured only from peers inside these ranges; from anyone else the
    # `Host` header and the connection decide.
    #
    # In Kubernetes this is your ingress controller's pod CIDR — enumerating pod
    # IPs is unmaintainable, since they change on every rollout. Find it with:
    #   kubectl cluster-info dump | grep -m1 cluster-cidr
    #
    #   trusted_proxies: ["10.42.0.0/16"]
    #
    # Absent keeps today's permissive behaviour, but is a startup error once host
    # routing is configured (`config.subdomain_routing`, or a registry's
    # `hosts`). Use `[]` when BatleHub is exposed directly with no proxy in front
    # of it.
    # trusted_proxies: []

  # ── [subdomain_routing] ─────────────────────────────────────────────────────
  # Bind every registry to `<name>.<base_domain>` in addition to
  # /proxy/<name>/…. Needs a wildcard DNS record and a matching certificate;
  # see `ingress.extraHosts` above.
  # subdomain_routing:
  #   enabled: true
  #   base_domain: "batlehub.example.com"
  #   scheme: "https"          # only used to advertise public URLs

  # ── [database] ──────────────────────────────────────────────────────────────
  database:
    type: "postgresql"
    url: "postgresql://batlehub:changeme@postgres:5432/batlehub"

  # ── [storage] ───────────────────────────────────────────────────────────────
  # Filesystem (default):
  storage:
    type: "filesystem"
    path: "/var/cache/batlehub"
  # S3 — replace the entire storage block with:
  # storage:
  #   type: "s3"
  #   bucket: ""
  #   region: "us-east-1"
  #   endpoint_url: ""       # omit for AWS S3; set for MinIO/RustFS
  #   force_path_style: true # required for MinIO, RustFS, etc.
  #   prefix: ""             # optional: store under a bucket subfolder

  # ── [[auth]] ────────────────────────────────────────────────────────────────
  # Each list entry becomes a [[auth]] TOML block. The "type" key is required.
  # Supported types: token | oidc | kubernetes | actions-oidc
  auth:
    - type: "token"
      tokens:
        - value: "change-me-admin-token"
          role: "admin"
          user_id: "admin"
    # OIDC provider (uncomment and fill in to enable):
    # - type: "oidc"
    #   issuer_url: "https://sso.example.com/application/o/batlehub/"
    #   client_id: "batlehub"
    #   client_secret: "${OIDC_CLIENT_SECRET}"  # inject via env.secretKeyRef below
    #   redirect_uri: "https://batlehub.example.com/api/v1/auth/oidc/callback"
    #   scopes:
    #     - openid
    #     - profile
    #     - email
    #     - groups
    #   user_id_claim: "preferred_username"
    #   role_claim: "groups"
    #   role_mappings:
    #     "authentik Admins": "admin"
    #     "proxy-users": "user"

  # ── [[registries]] ──────────────────────────────────────────────────────────
  # Each list entry becomes a [[registries]] TOML block.
  # Supported types: npm | cargo | goproxy | pypi | conda | maven | terraform
  #                  rubygems | github | openvsx | vscode-marketplace | composer
  # mode: proxy (default) | local | hybrid
  registries:
    - type: "npm"
      name: "npm"
      rbac:
        anonymous:
          - "releases:read"
          - "source:read"
        user:
          - "releases:read"
          - "source:read"
        admin:
          - "*"

  # ── [otel] ──────────────────────────────────────────────────────────────────
  # Uncomment to enable OpenTelemetry tracing. Must be absent (not null) to disable.
  # otel:
  #   endpoint: "http://jaeger:4317"
  #   service_name: "batlehub"

  # ── [cache] ──────────────────────────────────────────────────────────────────
  # Metadata cache backend. Defaults to in-memory when absent.
  # cache:
  #   type: "redis"   # memory | postgres | redis
  #   url: "redis://localhost:6379"

  # ── [limits] ────────────────────────────────────────────────────────────────
  # limits:
  #   max_artifact_size_bytes: 524288000  # 500 MiB

  # ── [ip_blocking] ───────────────────────────────────────────────────────────
  # ip_blocking:
  #   enabled: true
  #   violation_threshold: 10
  #   violation_window_secs: 300
  #   ban_duration_secs: 3600

# ── Disruption budget ─────────────────────────────────────────────────────────
# Only rendered when replicaCount > 1 — a PDB over a single replica blocks node
# drains without buying any availability.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # A PDB carries only one of the two fields. `maxUnavailable` wins when set,
  # including an explicit `0` (a zero-disruption budget), which is why the
  # template tests whether it was configured rather than whether it is truthy.
  # maxUnavailable: 0

# ── Network policy ────────────────────────────────────────────────────────────
# Off by default: the correct egress set depends on which upstream registries you
# proxy, and a default-deny policy written without that list silently breaks every
# cache miss. Turn it on once you know your egress, and note that DNS must be
# allowed or *every* upstream lookup fails.
# ── The scan worker (RFC 0018 §5.4) ──────────────────────────────────────────
# A second Deployment of the same binary, started with `--roles worker` from
# the worker image — the one that carries bubblewrap, postmortem, GuardDog and
# the Trivy client (Containerfile.worker). It leases scan jobs from the
# database, opens artifacts inside a `bwrap` sandbox and records verdicts; it
# answers no HTTP but /livez and /metrics.
#
# Off by default: every existing deployment keeps the embedded worker in the
# proxy pod. When you enable this, set `config.server.roles = ["proxy"]` so the
# proxy stops scanning and the toolchains live only here. Only the worker needs
# egress to upstream artifacts, the Trivy server and Rekor; a NetworkPolicy
# that says so is the next thing to write once this is on.
worker:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/batleforc/batlehub-worker
    pullPolicy: IfNotPresent
    # Defaults to Chart.appVersion — the worker and the proxy are one release.
    tag: ""
  # bubblewrap needs unprivileged user namespaces on the node
  # (`kernel.unprivileged_userns_clone=1` on Debian-derived kernels, on by
  # default on most others). Where the node forbids them, either grant the
  # container `CAP_SYS_ADMIN` (not recommended) or run the pod under a sandboxed
  # runtime class below and set `[worker.sandbox] runtime = "none"` with
  # `BATLEHUB_UNSAFE_NO_SANDBOX=1` — the runtime class is then the sandbox.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # The opt-in fourth wall (RFC 0018 §7): gVisor (`gvisor`) or Kata around the
  # whole pod, on top of bubblewrap around each scanner.
  runtimeClassName: ""
  # The per-job work directories: a memory-backed emptyDir, so a hostile
  # archive never touches the node's disk. Size it for `max_concurrent` jobs
  # of `[worker.sandbox] max_extracted_mb` each.
  scratch:
    sizeLimit: 4Gi
  resources: {}
  #  limits:
  #    memory: 4Gi
  #  requests:
  #    cpu: 500m
  #    memory: 1Gi
  nodeSelector: {}
  tolerations: []

# The Trivy server sub-chart (aquasecurity/trivy), for `[scanners.trivy]
# endpoint`. Off by default; `helm dependency update` fetches it when you turn
# it on, and the endpoint is then `http://<release>-trivy:4954`.
trivy:
  enabled: false

networkPolicy:
  enabled: false
  # Peers allowed to reach the service port. Leaving this empty renders an
  # ingress rule with no `from`, which in the NetworkPolicy spec means **any
  # source** — not "anything in the cluster". The port restriction still
  # applies, but the policy places no limit on who may connect to it, so an
  # empty list gives you far less than it looks like. Name the ingress
  # controller (or whatever fronts BatleHub) to actually narrow it.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # Extra egress rules, appended to the always-present DNS rule.
  egressTo: []
  #  - to:
  #      - ipBlock:
  #          cidr: 0.0.0.0/0
  #    ports:
  #      - protocol: TCP
  #        port: 443

# ── Persistent storage for the artifact cache (filesystem mode) ───────────────
#
# NOTE: `ReadWriteOnce` cannot be shared by replicas scheduled on different
# nodes. Filesystem storage is therefore effectively single-replica. For a
# multi-replica deployment either switch `config.storage` to `s3` (recommended —
# it is the only backend all replicas can write to concurrently) or supply a
# storageClass that provides `ReadWriteMany` and set accessMode accordingly.
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # existingClaim: ""
  # With filesystem storage and `enabled: false` the cache is an emptyDir —
  # ephemeral, but still writable, which `readOnlyRootFilesystem: true` makes a
  # requirement rather than a nicety. Cap it below the container's
  # `resources.limits.ephemeral-storage` or the node evicts the pod instead of
  # the cache evicting itself.
  ephemeralSizeLimit: 1Gi

# ── Extra / external manifests ────────────────────────────────────────────────
# 0..N additional Kubernetes manifests rendered by this chart. Each entry:
#   name      - logical name; the K8s object name referenced by `mount`
#               (secretName / configMap name) and used as the
#               `extra-<name>` volume name.
#   enabled   - default true.
#   kind      - "Secret" | "ConfigMap"; required only when `mount` is set.
#   manifest  - raw YAML for one Kubernetes object, rendered with `tpl`
#               (can reference .Values/.Release/.Chart). Omit to reference
#               a resource created outside this chart (e.g. by Sealed
#               Secrets / External Secrets Operator / Vault Agent) — nothing
#               is rendered, but `mount` can still reference it by `name`.
#   mount     - optional, only valid for kind Secret/ConfigMap:
#     asConfig  - if true, this entry replaces the chart-managed config
#                 Secret as the source of /etc/batlehub/config.toml.
#                 At most one entry may set this.
#     mountPath - container mount path. Required unless asConfig.
#     subPath   - optional subPath within the volume.
#     items     - optional [{key, path}] projection; defaults to projecting
#                 every key in the resource under its own name.
#     readOnly  - default true.
externalManifest: []
# Examples:
# externalManifest:
#   # config.toml from a Secret managed by an External Secrets Operator —
#   # nothing rendered, just mounted as the main config.
#   - name: batlehub-config-eso
#     kind: Secret
#     mount:
#       asConfig: true
#       items:
#         - key: config.toml
#           path: config.toml
#   # An extra ConfigMap the chart creates and mounts a single key from.
#   - name: extra-ca-bundle
#     kind: ConfigMap
#     manifest: |
#       apiVersion: v1
#       kind: ConfigMap
#       metadata:
#         name: extra-ca-bundle
#       data:
#         ca.crt: |
#           -----BEGIN CERTIFICATE-----
#           ...
#     mount:
#       mountPath: /etc/ssl/certs/extra
#       items:
#         - key: ca.crt
#           path: ca.crt
#   # A standalone resource that is never mounted.
#   - name: batlehub-allow-egress
#     manifest: |
#       apiVersion: networking.k8s.io/v1
#       kind: NetworkPolicy
#       metadata:
#         name: batlehub-allow-egress
#       spec:
#         ...
