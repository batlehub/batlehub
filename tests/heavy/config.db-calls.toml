# Server configuration for the database-call budget suite (tests/heavy/db_calls.sh).
#
# One proxy and one local npm registry: the proxy's upstream is the stdlib mock
# `db_calls.py mock` serves, so a cache miss costs no network and the numbers
# are the server's alone. See tests/heavy/lib.sh for the `${HEAVY_RUN}` and
# port/storage override conventions.

[server]
host = "127.0.0.1"
port = 8122
# No embedded scan worker: its idle poll (heartbeat, lease, exhausted — five
# statements every two seconds) lands in whichever request window it likes,
# and the budget is about what a request costs.
roles = ["proxy"]

[database]
type = "postgresql"
url = "${DATABASE_URL}"
max_connections = 5

[[auth]]
type = "token"

[[auth.tokens]]
value = "heavy-admin-token"
role = "admin"
user_id = "ci-admin"

# RFC 0044: the `user` role holds `quarantine:read`, so a list it reads runs
# the scan-status batch; anonymous does not, and must not.
[[auth.tokens]]
value = "heavy-user-token"
role = "user"
user_id = "ci-user"

[storage]
type = "filesystem"
path = "./tmp/heavy-db-calls-storage"

[[registries]]
type = "npm"
name = "npm-proxy-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["http://127.0.0.1:${DB_CALLS_MOCK_PORT}/npm"]

[registries.rbac]
anonymous = ["releases:read", "source:read"]
user = ["releases:read", "source:read"]
admin = ["*"]

[[registries]]
type = "npm"
name = "npm-local-${HEAVY_RUN}"
mode = "local"

[registries.rbac]
anonymous = ["releases:read", "source:read"]
user = ["releases:read", "source:read"]
admin = ["*"]

# RFC 0044 §10.3: a registry behind [security], so the list routes carry a
# scan status and their budget measures its batch. Without a worker the job
# the first download queues stays open — a status to read — and the mock's
# 2024 publish date is past `mature_age_secs`, so the download is served as
# `warned` and the catalogue lists it. The scanner is never called.
[[registries]]
type = "npm"
name = "npm-sec-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["http://127.0.0.1:${DB_CALLS_MOCK_PORT}/npm"]

[registries.rbac]
anonymous = ["releases:read", "source:read"]
user = ["releases:read", "source:read"]
admin = ["*"]

[registries.security]
mode = "warn"
min_age_secs = 3600
mature_age_secs = 86400
scanners = ["osv"]
required_scanners = ["osv"]

[scanners.osv]
type = "osv"
api_url = "http://127.0.0.1:${DB_CALLS_MOCK_PORT}/osv"
