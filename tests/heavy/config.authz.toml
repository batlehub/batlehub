anonymous = []
user = []
admin = ["*"]

[registries.grants]
"user:authz-reader" = ["releases:read", "releases:list", "source:read"]

[[registries]]
type = "nodedist"
name = "authz-nodedist-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://example.invalid/nodedist"]

[registries.rbac]
anonymous = []
user = []
admin = ["*"]

[registries.grants]
"user:authz-reader" = ["releases:read", "releases:list", "source:read"]

[[registries]]
type = "sdkman"
name = "authz-sdkman-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://example.invalid/sdkman"]

[registries.rbac]
anonymous = []
user = []
admin = ["*"]

[registries.grants]
"user:authz-reader" = ["releases:read", "releases:list", "source:read"]

[[registries]]
type = "jetbrains"
name = "authz-jetbrains-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://example.invalid/jetbrains"]

[registries.rbac]
anonymous = []
user = []
admin = ["*"]

[registries.grants]
"user:authz-reader" = ["releases:read", "releases:list", "source:read"]

# `path_allow` is mandatory for this kind — the upstream path is passed through,
# so a registry with no allowlist would relay every path on the host.
[[registries]]
type = "generic"
name = "authz-generic-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://example.invalid/generic"]
path_allow = ["**"]

[registries.rbac]
anonymous = []
user = []
admin = ["*"]

[registries.grants]
"user:authz-reader" = ["releases:read", "releases:list", "source:read"]

[[registries]]
type = "rustup"
name = "authz-rustup-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://example.invalid/rustup"]

[registries.rbac]
anonymous = []
user = []
admin = ["*"]

[registries.grants]
"user:authz-reader" = ["releases:read", "releases:list", "source:read"]
