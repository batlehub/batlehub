# Server configuration for the heavy `setup apply` suite
# (tests/heavy/client_setup.sh, RFC 0038 §6.5). See tests/heavy/config.npm.toml
# for the env-var conventions.
#
# One proxy registry per type `setup apply` writes a client for. The suite runs
# a *copy* of this file with `${HEAVY_RUN}` already substituted, because §8 and
# §10 edit it while the server watches it — a second npm registry appears, the
# pypi one goes — and a placeholder in a registry's `name` is one the reload
# diff refuses (RFC 0037 §4.5).

[server]
host = "127.0.0.1"
port = 8180
roles = ["proxy"]

[database]
type = "postgresql"
url = "${DATABASE_URL}"
max_connections = 10

[[auth]]
type = "token"

[[auth.tokens]]
value = "heavy-admin-token"
role = "admin"
user_id = "ci-admin"

[storage]
type = "filesystem"
path = "./tmp/heavy-client-setup-storage"

# ── cargo: crates.io ─────────────────────────────────────────────────────────
[[registries]]
type = "cargo"
name = "crates-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── npm, pnpm, yarn: registry.npmjs.org ──────────────────────────────────────
[[registries]]
type = "npm"
name = "npm-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── pip, uv: pypi.org ────────────────────────────────────────────────────────
[[registries]]
type = "pypi"
name = "pypi-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── go: proxy.golang.org, the checksum database included ─────────────────────
[[registries]]
type = "goproxy"
name = "go-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── maven: repo1.maven.org, plugins as well as dependencies ──────────────────
[[registries]]
type = "maven"
name = "maven-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── mise: a GitHub release, through the forge registry ───────────────────────
[[registries]]
type = "github"
name = "github-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read", "upstreams:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── mise: a generic mirror, whose rules come from its `upstreams` ────────────
[[registries]]
type = "generic"
name = "helm-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://get.helm.sh"]
path_allow = ["helm-v*-linux-amd64.tar.gz", "helm-v*-linux-amd64.tar.gz.sha256sum"]

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read", "upstreams:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── rustup: static.rust-lang.org, an env-only client ─────────────────────────
[[registries]]
type = "rustup"
name = "rust-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://static.rust-lang.org"]

[registries.rbac]
anonymous = ["releases:read", "releases:list"]
user = ["releases:read", "releases:list"]
admin = ["*"]

# ── node: nodejs.org/dist, the other env-only client ─────────────────────────
[[registries]]
type = "nodedist"
name = "nodedist-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── conda, micromamba: conda-forge (RFC 0040 §6.P case 1) ────────────────────
[[registries]]
type = "conda"
name = "conda-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://conda.anaconda.org/conda-forge"]

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── composer: repo.packagist.org ─────────────────────────────────────────────
[[registries]]
type = "composer"
name = "composer-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── gem: rubygems.org ────────────────────────────────────────────────────────
[[registries]]
type = "rubygems"
name = "gems-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── dotnet: api.nuget.org ────────────────────────────────────────────────────
[[registries]]
type = "nuget"
name = "nuget-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── terraform: registry.terraform.io, as a network mirror (no `hosts`) ───────
[[registries]]
type = "terraform"
name = "tf-${HEAVY_RUN}"
mode = "proxy"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── ansible-galaxy: galaxy.ansible.com, collections only ─────────────────────
[[registries]]
type = "galaxy"
name = "galaxy-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://galaxy.ansible.com/api/"]
roles = "off"

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── helm: charts.jetstack.io, configured by the `helm repo add` setup prints ───
[[registries]]
type = "helm"
name = "charts-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["https://charts.jetstack.io"]

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── deb: deb.debian.org, whose `stable` suite is the one setup prints (case 2) ───
[[registries]]
type = "deb"
name = "deb-${HEAVY_RUN}"
mode = "proxy"
upstreams = ["http://deb.debian.org/debian"]

[registries.rbac]
anonymous = ["releases:read", "releases:list", "source:read"]
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]
