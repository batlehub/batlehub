[tools]
claude = "latest"
cocogitto = "latest"
go = "latest"
helm = "latest"
helm-docs = "1.14.2" # generates helm/batlehub/README.md; pinned so CI and local agree
k6 = "latest"
lazydocker = "latest"
mc = "latest"
node = "24"
rust = "latest"
sonar-scanner-cli = "latest"
task = "latest"
# ── Security scanners (see `task security` and .github/workflows) ──────────────
"aqua:EmbarkStudios/cargo-deny" = "latest" # advisories + banned crates + licenses + sources
trivy = "latest"                    # container image / filesystem / SBOM CVE scanner
syft = "latest"                     # SBOM generation for built images
# Pinned, not "latest": the same version is pinned as `GITLEAKS_VERSION` in
# .github/workflows/secret-scan.yaml, so
#   GITLEAKS_CONFIG=$PWD/gitleaks.toml gitleaks git .
# run here reproduces the gate exactly. A drifting `latest` here did not: the
# action defaulted to 8.24.3 whose `generic-api-key` rule matched a test fixture
# 8.30.1's does not, so the gate failed on a commit already in history and no
# local run could see it.
gitleaks = "8.30.1"                 # secret scanning
semgrep = "latest"                  # static analysis (Rust / TS / secrets rulesets)
"cargo:cargo-cyclonedx" = "latest"  # CycloneDX SBOM of the Rust workspace
"cargo:cargo-audit" = "latest"      # RUSTSEC advisories
# Housekeeping, not a scanner: `task clean:stale`. Cargo never removes anything
# from `target/`, so every dependency bump leaves a whole generation of artefacts
# behind — measured at ~10 GB a time on this workspace.
"cargo:cargo-sweep" = "latest"
# Dependency supply chain: source-repo reputation + vulns, from the lockfiles.
# Pinned, not "latest": the same version is pinned in the CI action's `version`
# input (.github/workflows/postmortem.yaml), so both run the identical gate.
"github:mlab-sh/postmortem" = "2.3.1"
uv = "latest"
python = "latest"
pnpm = "11" # package manager for ui/ and docs/ (settings in pnpm-workspace.yaml + packageManager field)

#"github:batleforc/batlehub" = { version = "latest", asset_pattern = "batlehub-cli-*" }

# ── Routing this repo's own toolchain through BatleHub (dogfooding) ───────────
#
# Left commented on purpose: this file is shared, and an active block would
# point every contributor at a host they do not run.
#
# To use it: uncomment the block below (strip one leading "# " per line) and
# replace batlehub.example.com with your server. Regenerate at any time with
#
#   batlehub-cli registry suggest --mise --mise-commented
#
# which re-derives it from mise.lock, so it stays in step with the tool list
# above. `--client-env` additionally prints NODEJS_ORG_MIRROR / RUSTUP_DIST_SERVER
# and friends, for the toolchains mise fetches through its own HTTP layer.
#
# The matching server-side [[registries]] blocks come from the same command
# without --mise; see docs/use/cli.md § registry suggest.
## # Generated by `batlehub-cli registry suggest --mise`.
# # Add to mise.toml, or ~/.config/mise/config.toml to apply everywhere.
# # Uncomment (strip one leading "# " per line) and set your BatleHub host.
# [settings.url_replacements]

# # cargo (cargo)
# "regex:^https://static\\.crates\\.io/crates/([^/]+)/([^/]+)/.+\\.crate" = "https://batlehub.example.com/proxy/cargo/$1/$2/download"

# # github (github)
# "regex:^https://api\\.github\\.com/repos/(.+)" = "https://batlehub.example.com/proxy/github/$1"
# "regex:^https://github\\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(.+)" = "https://batlehub.example.com/proxy/github/$1/$2/releases/download/$3/$4"
# "regex:^https://github\\.com/([^/]+)/([^/]+)/archive/(?:refs/tags/)?(.+?)\\.tar\\.gz" = "https://batlehub.example.com/proxy/github/$1/$2/tarball/$3"
# "regex:^https://codeload\\.github\\.com/([^/]+)/([^/]+)/tar\\.gz/(?:refs/tags/)?(.+)" = "https://batlehub.example.com/proxy/github/$1/$2/tarball/$3"
# "regex:^https://github\\.com/([^/]+)/([^/]+)/archive/(?:refs/tags/)?(.+?)\\.zip" = "https://batlehub.example.com/proxy/github/$1/$2/zipball/$3"
# "regex:^https://raw\\.githubusercontent\\.com/([^/]+)/([^/]+)/([^/]+)/(.+)" = "https://batlehub.example.com/proxy/github/$1/$2/raw/$3/$4"

# # claude-code-dist (generic)
# "regex:^https://storage\\.googleapis\\.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/(.+)" = "https://batlehub.example.com/proxy/claude-code-dist/generic/$1"

# # go-dl (generic)
# "regex:^https://dl\\.google\\.com/go/(.+)" = "https://batlehub.example.com/proxy/go-dl/generic/$1"

# # helm-bin (generic)
# "regex:^https://get\\.helm\\.sh/(.+)" = "https://batlehub.example.com/proxy/helm-bin/generic/$1"

# # minio-dl (generic)
# "regex:^https://dl\\.min\\.io/(.+)" = "https://batlehub.example.com/proxy/minio-dl/generic/$1"

# # node-dist (generic)
# "regex:^https://nodejs\\.org/dist/(.+)" = "https://batlehub.example.com/proxy/node-dist/generic/$1"

# # rust-dist (generic)
# "regex:^https://static\\.rust-lang\\.org/(.+)" = "https://batlehub.example.com/proxy/rust-dist/generic/$1"

# # sonar-binaries (generic)
# "regex:^https://binaries\\.sonarsource\\.com/(.+)" = "https://batlehub.example.com/proxy/sonar-binaries/generic/$1"

# # Not rewritable here: pypi. mise shells out to the ecosystem's own tool for
# # these, so point that tool at the proxy instead (.cargo/config.toml, pip.conf
# # / UV_INDEX_URL, GOPROXY, .npmrc, …) — see `batlehub-cli registry suggest
# # --client-env`.
