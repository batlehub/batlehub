# batlehub — example configuration
# Copy this file to config.toml and edit as needed.

# Optional: pins this file to a config schema version. Absent means "current"
# (whatever this binary's default schema is), so existing configs keep working
# unchanged after an upgrade. Only set this if you need to pin against future
# schema changes; see "Config versioning" in docs/guide/configuration.md.
# config_version = 1

[server]
host = "0.0.0.0"
port = 8080
# Serve the built SPA from this directory (optional).
# static_dir = "./ui/dist"
# Origins allowed to make cross-origin requests and read the responses.
#
# Absent or empty (the default since 1.1.0) means same-origin only: no CORS
# headers are emitted at all. The default deployment serves the SPA from this
# same server, and same-origin requests never consult CORS, so most setups need
# nothing here. Set it only when the UI is served from a different origin.
#
# "*" is the explicit opt-out — any website may then read responses from this
# server. Reasonable for a public mirror; on a private network it lets a public
# page enumerate internal package metadata through a visitor's browser. The
# server raises a `cors.any-origin` config warning when it is set.
# cors_allowed_origins = ["https://batlehub.example.com"]
#
# ── Proxy trust ───────────────────────────────────────────────────────────────
# CIDR ranges (or bare IPs) of the reverse proxies in front of BatleHub.
# `Forwarded` / `X-Forwarded-Host` / `X-Forwarded-Proto` / `X-Forwarded-For` are
# honoured only when the TCP peer falls inside one of these; from anyone else the
# `Host` header and the connection decide.
#
# These headers decide the URLs BatleHub advertises in NuGet service indexes,
# npm `dist.tarball`, PyPI simple pages and so on — and, with host-based routing
# (see [subdomain_routing] below), *which registry* serves the request. So who
# may set them is a policy worth stating explicitly.
#
#   absent  -> legacy permissive: forwarded host/scheme believed from anyone,
#              `X-Forwarded-For` ignored. A hard error once host routing is on.
#   []      -> forwarded headers ignored entirely (BatleHub exposed directly).
#   [nets]  -> honoured only from peers inside those prefixes.
#
# A bare address is treated as a /32 (or /128), so every value that was valid
# for the deprecated `[ip_blocking].trusted_proxies` stays valid here.
# trusted_proxies = ["10.42.0.0/16", "192.168.1.10"]

# ── Signed download URLs ──────────────────────────────────────────────────────
# For clients that authenticate the *documents* of an install and then fetch the
# *artifact* with no credentials, because their protocol cannot send any.
# Terraform is the measured case: the provider archive, its SHA256SUMS and the
# detached signature over that all arrive bare.
#
# Without this, such a registry needs `anonymous = ["releases:read",
# "source:read"]`, which is per registry — it opens every read on it. With it,
# BatleHub signs the URLs inside the document the client did authenticate, and
# the registry can keep `anonymous = []`. Turn it on per registry with
# `signed_downloads = true` (see the [[registries]] entries below).
#
# The secret is HMAC key material: 32 bytes minimum, and interpolated from the
# environment rather than written here. `signed_downloads = true` with no secret
# configured is a startup error, not a warning.
#
# NOTE: a minted URL is a bearer capability until it expires, and BatleHub's
# request span records the full target — query string included — at INFO. See
# docs/guide/configuration.md, "[server.signed_urls]".
#
# [server.signed_urls]
# secret      = "${BATLEHUB_URL_SIGNING_SECRET}"
# ttl_seconds = 300                                  # default; capped at 3600
# # Verified but never minted with, so a secret rotates without a flag day.
# # An entry that interpolates to empty is ignored, so this line can stay.
# previous_secrets = ["${BATLEHUB_URL_SIGNING_SECRET_OLD}"]

[database]
type = "postgresql"
url = "postgresql://batlehub:changeme@localhost:5432/batlehub"
max_connections = 10

# ── Auth providers (evaluated in order; first match wins) ─────────────────────

[[auth]]
type = "token"

# Token values can be plain text (convenient for development) or Argon2id hashes
# (recommended for production).  Generate a hash with:
#
#   batlehub hash-token my-secret-token
#
# Both formats are accepted simultaneously; hashed entries are verified with a
# constant-time Argon2 comparison so plain-text tokens in the same block remain
# fast.

[[auth.tokens]]
# Plain-text — replace before going to production.
value = "change-me-admin-token"
role = "admin"
user_id = "admin"

[[auth.tokens]]
# Example Argon2id hash (plain text equivalent: "change-me-user-token").
# Replace with your own hash generated by `batlehub hash-token <your-token>`.
# value = "$argon2id$v=19$m=65536,t=3,p=4$<salt>$<hash>"
value = "change-me-user-token"
role = "user"
user_id = "user-1"

# Unauthenticated requests automatically receive the "anonymous" role.

# OIDC provider — JWT validation + browser SSO login.
# Works with any standards-compliant provider (Authentik, Keycloak, Dex, …).
#
# In an Eclipse Che workspace there is no compose to run Authentik in; the dex
# sidecar in devfile.yaml takes its place on the same port 9000. `task
# dex:config` writes the two [[auth]] blocks that match it — issuer, redirect
# and frontend URLs all carry this workspace's FQDN — into dev/dex/auth.toml,
# to be pasted over the two below.
#
# Local Authentik (docker compose --profile authentik up):
[[auth]]
type = "oidc"
issuer_url = "http://localhost:9000/application/o/proxy-auth/"
client_id = "proxy-auth"
client_secret = "${OIDC_CLIENT_SECRET}"  # set OIDC_CLIENT_SECRET env var
redirect_uri = "http://localhost:8080/api/v1/auth/oidc/callback"
scopes = ["openid", "profile", "email", "groups"]
# Where to redirect after the OIDC callback. Defaults to "" (same origin as the
# backend). Set this when running the Vite dev server separately.
frontend_url = "http://localhost:5175"

# JWT claim used as the user's identifier (default: "sub").
# "preferred_username" gives a human-readable name (e.g. "akadmin") instead of a UUID.
user_id_claim = "preferred_username"

# JWT claim inspected for role mapping (default: "role").
# The value may be a string or an array of strings; the highest matching role wins.
role_claim = "groups"

# Map Authentik group names (JWT claim values) → proxy roles.
# Keys are group names as they appear in the "groups" JWT claim.
[auth.role_mappings]
"authentik Admins" = "admin"
"proxy-users" = "user"

[[auth]]
name = "oidc2"
type = "oidc"
issuer_url = "http://localhost:9000/application/o/proxy-auth/"
client_id = "proxy-auth"
client_secret = "${OIDC2_CLIENT_SECRET}"  # set OIDC2_CLIENT_SECRET env var
redirect_uri = "http://localhost:8080/api/v1/auth/oidc2/callback"
scopes = ["openid", "profile", "email", "groups"]
# Where to redirect after the OIDC callback. Defaults to "" (same origin as the
# backend). Set this when running the Vite dev server separately.
frontend_url = "http://localhost:5173"

# JWT claim used as the user's identifier (default: "sub").
# "preferred_username" gives a human-readable name (e.g. "akadmin") instead of a UUID.
user_id_claim = "preferred_username"

# JWT claim inspected for role mapping (default: "role").
# The value may be a string or an array of strings; the highest matching role wins.
role_claim = "groups"

# Map Authentik group names (JWT claim values) → proxy roles.
# Keys are group names as they appear in the "groups" JWT claim.
[auth.role_mappings]
"authentik Admins" = "admin"
"proxy-users" = "user"

# Kubernetes service account token provider (in-cluster use).
# Validates Bearer tokens via the Kubernetes TokenReview API.
#
# [[auth]]
# type = "kubernetes"
#
# # Defaults come from the standard in-cluster mounted secrets and env vars.
# # api_server   = "https://kubernetes.default.svc"
# # ca_cert_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
# # token_path   = "/var/run/secrets/kubernetes.io/serviceaccount/token"
#
# # Audiences passed to the TokenReview API (defaults to ["batlehub"]), and
# # required back in its response. A token whose own `aud` shares nothing with
# # this list is refused locally, without a round trip.
# audiences = ["batlehub"]
#
# # Token issuers worth a TokenReview. Empty (the default) means any issuer.
# # Set it when this server sees tokens from more than one issuer with the same
# # audience name — read yours with:
# #   kubectl get --raw /.well-known/openid-configuration | jq -r .issuer
# issuers = ["https://kubernetes.default.svc.cluster.local"]
#
# # Map Kubernetes usernames or group names to proxy roles.
# # Kubernetes sets:
# #   username: "system:serviceaccount:<namespace>:<name>"
# #   groups:   ["system:serviceaccounts", "system:serviceaccounts:<namespace>", ...]
# # The highest matching role wins when multiple keys match.
# [auth.role_mappings]
# "system:serviceaccount:prod:ci-deployer"  = "admin"
# "system:serviceaccounts:dev"              = "user"
# "system:serviceaccounts"                  = "anonymous"

# ── Cache backend ─────────────────────────────────────────────────────────────
#
# Selects the storage engine for metadata cache entries and rate-limit counters.
#
# memory   (default) — in-process HashMap; resets on restart; not shared across replicas.
# postgres            — stores entries in the database; persistent and shared.
# redis               — stores entries in Redis; persistent, shared, and lower-latency.
#
# Switch to "postgres" or "redis" when running multiple server replicas so that
# metadata cache hits and rate-limit counters are consistent across the cluster.
#
# [cache]
# type = "memory"   # default — no extra config needed
#
# [cache]
# type = "postgres"  # reuses the [database] connection pool; no extra url needed
#
# [cache]
# type  = "redis"
# url   = "redis://localhost:6379"   # required when type = "redis"

# ── Upload / download size limits ─────────────────────────────────────────────
#
# max_artifact_size_bytes caps the size of proxy downloads and local publishes.
# Default is 500 MiB. Raise it when caching large archives (e.g. JetBrains IDEs
# are 1–1.7 GB).
# [limits]
# max_artifact_size_bytes = 2147483648   # 2 GiB — required for JetBrains IDE archives
# versions_per_page       = 100          # rows in one package-detail answer: the default
#                                        # for a caller that asks for none, and the most
#                                        # one may ask for (1–1000)
# packages_per_page       = 20           # the same, for one page of the catalog. Two keys
#                                        # because a screenful of names and a query's worth
#                                        # of enriched version rows are not one question.

# ── Storage backend ────────────────────────────────────────────────────────────

# Single backend (legacy format — still supported):
[storage]
type = "filesystem"
path = "./tmp/storage-cache"

# Multi-backend example with RustFS (S3-compatible):
# [storage]
# default = "primary"
#
# [[storage.backends]]
# name = "primary"
# type = "filesystem"
# path = "./tmp/storage-cache"
#
# [[storage.backends]]
# name = "rustfs"
# type = "s3"
# bucket = "artifacts"
# region = "us-east-1"
# prefix = "batlehub/"      # optional: store in a subfolder inside the bucket
# endpoint_url = "http://localhost:9900"
# force_path_style = true   # required for RustFS
#
# Then assign registries to a specific backend:
# [[registries]]
# type = "github"
# name = "github"
# storage = "rustfs"   # GitHub artifacts go to RustFS; others use the default

# ── Registries ────────────────────────────────────────────────────────────────

# Permissions available — the set is CLOSED. A verb that is not one of these is
# a startup error, not a permission granted to nobody. The full list of 31 is in
# /guide/access-control#verbs; the ones a registry block usually wants:
#   releases:read      — download an artifact
#   releases:list      — read a version listing or index document
#   source:read        — download source tarballs
#   releases:publish   — publish a new version
#   catalogue:browse   — use the console's package explorer
#
# (An earlier version of this comment offered `actions:read` "(future)". No such
# verb has ever existed, and uncommenting it stopped the server from starting.)
#
# Dynamic groups (from OIDC providers like Authentik):
#   [registries.rbac.groups]
#   "team-a" = ["releases:read", "source:read"]
#   "team-b" = ["releases:read"]
# A user belonging to a group sees the union of their role's registries and all their groups'.

# ── Grants: the hierarchy (RFC 0015) ─────────────────────────────────────────
#
# `[registries.rbac]` above still works exactly as it always did — it is
# translated into grants at load, so nothing here needs changing. What the
# hierarchy adds is the ability to say things `rbac` cannot: a verb for one
# group, a policy on part of a registry, and the control surfaces.
#
# Five tiers: instance → registry → namespace → package → version. The first
# three are written here; the last two go through the admin API, because a
# registry with 200 000 packages will not enumerate them in TOML.

# Instance tier — above every registry, and the only place that can reach an
# endpoint naming no registry (health, metrics, config, the block lists).
# `role:admin` already holds all of these; this block is for giving one to
# somebody else.
[grants]
"group:*:sre" = ["system:read", "cache:evict"]

[[registries]]
type = "github"
name = "github"
# upstreams defaults to ["https://api.github.com"] when omitted.

[registries.rbac]
anonymous = []
user = ["releases:read", "source:read"]
admin = ["*"]

# Registry tier — the default for everything beneath it. Unioned with whatever
# the `rbac` block above translates to; a grant only ever adds.
[registries.grants]
"group:*:release-eng" = ["releases:publish", "owners:write"]

# Namespace tier — matched on segment boundaries with the ecosystem's own
# separator, so `acme/internal` never matches `acme/internal-tools`.
[[registries.namespaces]]
match      = "acme/internal"
visibility = "team"

# `grants = {}` SEALS: nothing is inherited from above, and only what is written
# on this node or below applies. An absent block inherits; an empty one seals.
# They are different states, which is why the key is optional rather than
# defaulted. The administrative floor survives a seal, so a sealed subtree is
# never one an administrator cannot reopen.
[registries.namespaces.grants]
"group:oidc1:platform" = ["releases:read", "releases:list", "releases:publish"]

# Optional: grant access to this registry for specific OIDC groups.
# [registries.rbac.groups]
# "team-a" = ["releases:read", "source:read"]

[[registries]]
type = "github"
name = "github2"
# upstreams defaults to ["https://api.github.com"] when omitted.

[registries.rbac]
anonymous = []
user = []
admin = ["*"]

# Optional: only team-b members can access this registry.
# [registries.rbac.groups]
# "team-b" = ["releases:read", "source:read"]

[[registries]]
type = "npm"
name = "npm"
# Single upstream (explicit):
# upstreams = ["https://registry.npmjs.org"]
#
# Fanout — private first, public fallback on 404:
# upstreams = [
#   "https://my-private-npm.example.com",
#   "https://registry.npmjs.org",
# ]

[registries.rbac]
anonymous = ["releases:read", "source:read"]
user = ["releases:read", "source:read"]
admin = ["*"]

[[registries]]
type = "cargo"
name = "cargo"
# upstreams defaults to ["https://crates.io"] when omitted.

[registries.cache]
# How long to cache release metadata (seconds). Default: 300 (5 min).
metadata_ttl_secs = 300
# Omitting artifact_ttl_secs means artifacts are kept forever (until eviction).
# Uncomment to re-fetch artifacts older than 30 days:
# artifact_ttl_secs = 2592000

[registries.rbac]
anonymous = ["releases:read", "source:read"]
user = ["releases:read", "source:read"]
admin = ["*"]

# Release age gate: block downloads for releases published less than 1 hour ago,
# unless the caller holds an admin token.
[[registries.rules]]
kind = "release_age_gate"
min_age_secs = 3600
bypass_roles = ["admin"]

# Signed-release gate (disabled by default). Checks the upstream's best-effort
# signature signal (e.g. a .asc/.sig release asset on GitHub/Forgejo); it is
# not cryptographic verification, and registries with no such signal for their
# ecosystem (npm, PyPI, crates.io, Maven, ...) are allowed through unless
# deny_missing_signature is set.
# [[registries.rules]]
# kind = "require_signed_release"
# enabled = true
# bypass_roles = ["admin"]
# deny_missing_signature = false

# Deny "latest" version tag: force consumers to pin explicit versions.
# Admins (or any listed role) may still use "latest".
# [[registries.rules]]
# kind = "deny_latest"
# bypass_roles = ["admin"]

# CVE gate: block (or warn about) downloads of versions with known
# vulnerabilities recorded by the [vulnerability_scan] background task.
# With block = false (the default) findings are surfaced in the UI but
# never block; set block = true to deny affected versions.
# [[registries.rules]]
# kind = "cve_gate"
# min_severity = "high"        # unknown | low | medium | high | critical
# block = true
# bypass_roles = ["admin"]

# Version gate: an optional approved-version allowlist plus a blocklist of
# specific versions with known issues. Each entry is an exact version string
# or a semver range (a bare "1.2.3" stays exact; ranges use semver operators).
# block takes precedence over allow; when allow is non-empty, versions matching
# none of its entries are also rejected.
# [[registries.rules]]
# kind = "version_gate"
# allow = [">=1.2.0, <2.0.0"]  # optional: only matching versions are served
# block = ["1.4.7", "1.5.0"]   # specific versions with known issues
# bypass_roles = ["admin"]

# Licence gate: block (or warn about) downloads by the licence the package's own
# manifest declares — Cargo.toml's license, package.json's license, pom.xml's
# <licenses>, METADATA's License-Expression, .nuspec's <license>. No external
# feed and no extra upstream call: the licence is read out of the archive by the
# SBOM extractor when the artifact is cached or published.
#
# Three things to know before enabling it:
#
#  0. It requires [registries.sbom] with enabled = true on THIS registry. The
#     licence is read out of the archive as part of SBOM generation, so with
#     SBOM off nothing is extracted and the gate sees an unknown licence for
#     every version. Misconfiguring this raises license-gate.sbom-disabled on
#     the Config Reload admin page.
#
#  1. The licence is inside the archive, so it is not known until the artifact
#     has been fetched once. The FIRST request for an uncached package cannot be
#     gated. allow_unknown decides what that means: true (default) lets the
#     first download through and gates every later one; false refuses anything
#     not already known, at the cost of one refused request per new package.
#  2. Extraction covers cargo, npm, maven, pypi and nuget. On any other registry
#     type the licence is permanently unknown, so this rule either never fires
#     (allow_unknown = true) or refuses everything (block + allow_unknown =
#     false). Configuring it there raises a config warning on the Config Reload
#     admin page rather than failing silently.
#
# Matching is case-insensitive and ignores surrounding space, but is otherwise
# literal: allow = ["MIT"] does NOT match a package declaring "MIT OR AGPL-3.0",
# because accepting that would let any package opt out by adding an alternative.
# The gate reads the package's own licence, not its dependencies' — BatleHub
# does not resolve a dependency graph.
# [[registries.rules]]
# kind = "license_gate"
# allow = ["MIT", "Apache-2.0", "BSD-3-Clause"]  # optional allowlist
# deny = ["AGPL-3.0", "SSPL-1.0"]                # always refused (beats allow)
# allow_unknown = true                            # default
# block = true                                    # default false = warn-only
# bypass_roles = ["admin"]

# Trusted publisher: restrict downloads to packages published by an allowed
# org/user/scope, derived from already-resolved metadata (no extra upstream
# calls). Supported for github/gitlab/forgejo (owner/group), npm (scope, or
# publishing user when unscoped), and openvsx/vscode-marketplace (publisher
# segment). Not yet supported for cargo — configuring this on an unsupported
# registry denies every request (fail-closed).
# [[registries.rules]]
# kind = "trusted_publisher"
# allow = ["my-org", "trusted-user"]
# bypass_roles = ["admin"]

# Feature flags: optional per-registry UI/integration toggles.
# socket_badge is on by default; set false to hide the socket.dev badge.
# [registries.feature_flags]
# socket_badge = false

# Artifact integrity: verify proxied downloads against the checksum advertised
# in the upstream metadata (Cargo SHA-256, npm SRI/shasum, PyPI SHA-256). The
# defaults below are applied even without this block: verify when a checksum is
# advertised and fail the download on a mismatch (a mismatch is never
# bypassable and the bytes are never cached). Registries that advertise no
# checksum (NuGet, Maven, GitHub, Go, …) only warn unless require_metadata is
# set. Does not apply to firewall_only registries (they stream un-buffered).
# [registries.integrity]
# enabled = true            # master switch
# block_on_mismatch = true  # fail the download on a hash mismatch
# require_metadata = false  # also block when no checksum is advertised
# bypass_roles = ["admin"]  # roles exempt from the require_metadata gate
# verify_on_serve = false   # re-hash stored bytes against a self-computed
#                           # SHA-256 on every serve (cache hits + local reads),
#                           # not just on first fetch; a mismatch fails with 502
#                           # and evicts the corrupt entry. Off by default (it
#                           # reads + hashes the bytes on each serve).

[[registries]]
type = "goproxy"
name = "go"
# upstreams defaults to ["https://proxy.golang.org"] when omitted.
# For air-gapped environments, point at an internal GOPROXY mirror:
# upstreams = ["https://goproxy.internal.example.com"]

[registries.rbac]
anonymous = ["releases:read", "source:read"]
user = ["releases:read", "source:read"]
admin = ["*"]

[[registries]]
type = "openvsx"
name = "openvsx"
# upstreams defaults to ["https://open-vsx.org"] when omitted.
# For air-gapped environments, point at an internal OpenVSX mirror:
# upstreams = ["https://openvsx.internal.example.com"]

[registries.rbac]
anonymous = ["releases:read", "source:read"]
user = ["releases:read", "source:read"]
admin = ["*"]

# Configure the Go toolchain to use this proxy:
#   export GONOSUMCHECK="*"
#   export GONOSUMDB="*"
#   export GOPROXY="http://localhost:8080/proxy/go,direct"

[[registries]]
type = "terraform"
name = "terraform"
# upstreams defaults to ["https://registry.terraform.io"] when omitted.
# For air-gapped environments, point at an internal Terraform registry mirror:
# upstreams = ["https://terraform.internal.example.com"]

[registries.rbac]
anonymous = ["releases:read", "source:read"]
user = ["releases:read", "source:read"]
admin = ["*"]

# Configure Terraform to use this proxy for providers:
#   # ~/.terraformrc  (or %APPDATA%/terraform.rc on Windows)
#   provider_installation {
#     network_mirror {
#       url = "http://localhost:8080/proxy/terraform/"
#     }
#   }
#
# Configure Terraform modules:
#   source = "localhost:8080/proxy/terraform/hashicorp/consul/aws"

# ── Rate limiting ─────────────────────────────────────────────────────────────
#
# Rate limiting can be added to any registry. Uses a fixed-window counter
# algorithm backed by the [cache] backend (memory / postgres / redis).
#
# With [cache] type = "memory" (default): counters are per-process and reset on
# restart. With type = "postgres" or type = "redis": counters are shared across
# all server replicas and survive restarts.
#
# Per-user limit: each authenticated user gets their own counter; anonymous
# requests are grouped by client IP address.
#
# Per-group limit: all members of a named group share a single counter. Group
# names are matched against Identity.groups (namespaced by provider:
# "oidc:ci-bots", "kubernetes:ops", etc.).
#
# Both limits apply independently — a request must pass every applicable
# counter (user counter AND all relevant group counters) to be allowed.
#
# Example: 100/min per user, with a shared 5000/min pool for CI bots:
#
# [registries.rate_limit]
# requests_per_window = 100
# window_secs         = 60
# enforcement         = "block"   # or "warn" to allow but add X-RateLimit-Warning header
#
# [[registries.rate_limit.groups]]
# name                = "oidc:ci-bots"   # exact match against Identity.groups
# requests_per_window = 5000             # shared pool for ALL ci-bots members combined
# window_secs         = 60
# # enforcement = "block"               # optional; inherits parent enforcement when omitted
#
# [[registries.rate_limit.groups]]
# name                = "oidc:free-tier"
# requests_per_window = 200              # more restrictive shared pool for free-tier
# window_secs         = 60
#
# Response headers added by the rate limiter:
#   X-RateLimit-Limit: {binding_limit}   — always on proxy responses when configured
#   Retry-After: {seconds}               — on 429 / warn responses
#   X-RateLimit-Reset: {unix_timestamp}  — on 429 responses
#   X-RateLimit-Warning: rate-limit-exceeded  — on warn-mode overruns

# ── RubyGems registry ────────────────────────────────────────────────────────
#
# Proxy mode: mirrors rubygems.org gem downloads, info, and version listing.
# Local/hybrid mode: accepts `gem push` for private gems.
#
# [[registries]]
# type = "rubygems"
# name = "gems"
# # mode = "proxy"           # default
# # upstreams = ["https://rubygems.org"]  # default upstream
#
# # Hybrid example (fall through to rubygems.org when gem not found locally):
[[registries]]
type = "rubygems"
name = "my-gems"
mode = "hybrid"
upstreams = ["https://rubygems.org"]

# ── PHP Composer registry ────────────────────────────────────────────────────
#
# Proxy mode: mirrors Packagist metadata and dist artifacts.
# Local/hybrid mode: accepts ZIP uploads for private packages.
#
# Point Composer clients at: http(s)://your-host/proxy/{name}
# In your project's composer.json:
#   "repositories": [{"type": "composer", "url": "https://your-host/proxy/packagist"}]
#
# [[registries]]
# type = "composer"
# name = "packagist"
# # mode = "proxy"                              # default
# # upstreams = ["https://repo.packagist.org"]  # default upstream
#
# # Hybrid example — serve private packages, fall through to Packagist for the rest:
[[registries]]
type = "composer"
name = "my-composer"
mode = "hybrid"
upstreams = ["https://repo.packagist.org"]

# --- Maven Central registry --------------------------------------------------
#
# Proxy mode: mirrors Maven Central artifact downloads, POM info, and version listing.
# Local/hybrid mode: accepts `mvn deploy` for private artifacts.
[[registries]]
type = "maven"
name = "my-maven"
mode = "hybrid"
upstreams = ["https://repo1.maven.org/maven2/"]

# ── JetBrains IDE-archive proxy cache ────────────────────────────────────────
#
# Proxy-only: caches JetBrains IDE installer archives by path. A request to
#   http(s)://your-host/proxy/jetbrains-ide/jetbrains/idea/idea-2026.1.3.tar.gz
# is served from cache after the first download from download.jetbrains.com.
#
# Use the canonical download.jetbrains.com path. Since 2025.3 IDEA ships as a
# single unified installer (idea-<version>.tar.gz); the older per-edition names
# (ideaIU-… Ultimate / ideaIC-… Community) only exist for releases ≤ 2025.2.
# That host 302-redirects to a CDN (download-cdn.jetbrains.com);
# the redirect is followed automatically — don't put the CDN host in the path.
#
# IMPORTANT: IDE archives are ~1–1.7 GB. The proxy rejects downloads over
# `max_artifact_size_bytes` (default 500 MiB), so raise that limit for IDE
# archives — see the [limits] section above.
[[registries]]
type = "jetbrains"
name = "jetbrains-ide"
mode = "proxy"  # upstream defaults to https://download.jetbrains.com

# For the plugin ecosystem (plugins.jetbrains.com), use the dedicated
# `jetbrains-marketplace` type below — not an upstream override here.
[registries.rbac]
anonymous = ["releases:read"]

# Pre-warm specific upstream paths on startup (and via the /warm admin endpoint).
# Path-addressed registries (deb/rpm/pacman/jetbrains/generic) use `warm_paths`
# instead of `warm_packages`. Entries are upstream-relative paths.
[registries.cache]
warm_paths = ["idea/idea-2026.1.3.tar.gz"]

# ── JetBrains Marketplace (IDE plugins) ──────────────────────────────────────
#
# Full marketplace emulation for the plugin ecosystem: IDE search, compatible
# updates, meta.json blobs, plugin downloads, and (local/hybrid) marketplace-
# compatible publishing via POST /proxy/{name}/api/updates/upload.
#
# Point an IDE at the proxy either fully:
#   Help → Edit Custom Properties… → idea.plugins.host=https://your-host/proxy/jbm
# or additively:
#   Settings → Plugins → ⚙ → Manage Plugin Repositories… →
#   https://your-host/proxy/jbm/updatePlugins.xml
#
# Metadata, artifacts, and forwarded query blobs are cached with stale
# fallback, so previously-seen plugins keep working if the upstream is down.
[[registries]]
type = "jetbrains-marketplace"
name = "jbm"
mode = "hybrid"  # "proxy", "local", or "hybrid"
upstreams = ["https://plugins.jetbrains.com"]  # default

[registries.rbac]
anonymous = ["releases:read"]
user = ["releases:read"]
admin = ["*"]

# ── Generic file mirror (toolchains, vendor CDNs) ────────────────────────────
#
# Proxy-only mirror of any plain HTTP file tree — for upstreams with no package
# protocol at all. A request to
#   http(s)://your-host/proxy/node-dist/generic/v24.18.0/node-v24.18.0-linux-x64.tar.gz
# streams (and caches) https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.gz
#
# Two fields are MANDATORY for this type:
#   * `upstreams`  — there is no default file tree to fall back to.
#   * `path_allow` — the request path is passed straight through upstream, so
#     without an allowlist a registry pointed at a host serving many unrelated
#     tenants (a shared bucket, a multi-vendor CDN) would relay every path on it.
#     Globs use `glob` semantics where `*` also crosses `/`. Denied paths get a
#     403 before any upstream request — warm_paths cannot bypass it either.
#     Use path_allow = ["**"] to mirror the whole upstream deliberately.
#
# Point the client at it with its own mirror variable, e.g.
#   export NODEJS_ORG_MIRROR=https://your-host/proxy/node-dist/generic
#   export RUSTUP_DIST_SERVER=https://your-host/proxy/rust-dist/generic
# `batlehub-cli registry suggest` generates these blocks from a project's
# mise.toml/mise.lock and manifests.
#
# NOTE: toolchain archives can be large — see `max_artifact_size_bytes` above.
[[registries]]
type = "generic"
name = "node-dist"
mode = "proxy"
upstreams = ["https://nodejs.org/dist"]
path_allow = ["v*/**"]  # mise fetches the platform tarball AND the source tarball

[registries.rbac]
anonymous = ["releases:read"]

# Other useful generic mirrors (uncomment and adapt):
#
# [[registries]]
# type       = "generic"
# name       = "rust-dist"
# upstreams  = ["https://static.rust-lang.org"]   # RUSTUP_DIST_SERVER
# path_allow = ["dist/**", "rustup/**"]
#
# [[registries]]
# type       = "generic"
# name       = "go-dl"
# upstreams  = ["https://dl.google.com/go"]       # the Go toolchain tarballs;
# path_allow = ["go*.linux-amd64.tar.gz"]         # Go *modules* use type="goproxy"
#
# [[registries]]
# type       = "generic"
# name       = "helm-bin"
# upstreams  = ["https://get.helm.sh"]
# path_allow = ["helm-v*-linux-amd64.tar.gz"]

# ── Versioning policies (local/hybrid mode) ──────────────────────────────────
#
# Enforce versioning rules at publish time. Violations return HTTP 422.
# All fields are optional; omit the entire [versioning] block to disable.
#
# [[registries]]
# type = "cargo"
# name = "internal-crates"
# mode = "local"
#
# [registries.versioning]
# enforce_semver   = true          # reject non-semver versions (e.g. "1.0.0-foo" is OK, "1.0" is not)
# allow_prerelease = false         # reject pre-release versions (e.g. "1.0.0-beta.1")
# version_pattern  = "^\\d+\\.\\d+\\.\\d+$"   # optional regex; must match full version string

# ── Artifact signing (local/hybrid mode) ─────────────────────────────────────
#
# Accept and store artifact signatures supplied via publish-time HTTP headers:
#   X-Artifact-Signature: <base64-encoded signature bytes>
#   X-Signature-Type: pgp                    # or "ed25519", etc.
#
# Stored signatures are returned on download as the same headers.
# All fields are optional; omit the entire [signing] block to disable enforcement.
#
# verify_on_download additionally re-verifies a stored "ed25519" detached
# signature against trusted_keys on every download (a failure / untrusted key
# fails with 502). Ed25519 only: the rsa crate (PGP/x509) is banned by deny.toml.
#
# [[registries]]
# type = "npm"
# name = "signed-npm"
# mode = "local"
#
# [registries.signing]
# required           = true            # reject publishes that omit X-Artifact-Signature
# allowed_types      = ["pgp", "ed25519"]   # if non-empty, reject any other type
# verify_on_download = false           # re-verify stored ed25519 signatures on download
# trusted_keys       = ["<hex-encoded 32-byte ed25519 public key>"]

# ── Beta/Pre-Release Channel (local/hybrid mode) ─────────────────────────────
#
# When enabled, pre-release versions (semver pre-release component, e.g. 1.0.0-beta.1)
# are hidden from version listings and artifact downloads for users who are NOT members
# of the registry's beta channel.
#
# Members are managed via the admin API:
#   POST   /api/v1/admin/registries/{registry}/beta-channel
#   GET    /api/v1/admin/registries/{registry}/beta-channel
#   DELETE /api/v1/admin/registries/{registry}/beta-channel/{principal_type}/{principal_id}
#
# [[registries]]
# type = "npm"
# name = "my-npm"
# mode = "local"
#
# [registries.beta_channel]
# enabled = true

# ── Local retention (RFC 0016) ────────────────────────────────────────────────
#
# Reclaims locally published versions nobody is using, and ages out the detail of
# the tombstones deletions leave. Absent — the default — keeps everything forever.
#
# NOT the same as the eviction keys on [registries.cache], which govern the proxy
# cache. An evicted cache entry is re-fetchable from upstream; a locally published
# artifact is frequently the only copy in existence. A [registries.retention]
# block on a `proxy` mode registry is a startup error, because it would govern an
# empty set.
#
# KEEP CONDITIONS ARE A UNION OF VETOES: a version survives if ANY configured
# condition matches. There is no expression to write and no ordering to get
# wrong, and wrong configuration therefore fails toward keeping. A block with no
# keep condition at all is rejected — that is the one that reclaims everything on
# its first live run.
#
# keep_if_pulled_days is the setting that makes this safe to switch on.
# keep_versions = 10 alone throws away the version half the estate is pinned to,
# because it happens to be eleventh by date. Configuring reclamation without the
# pull veto raises `retention.no-pull-veto` on every reload.
#
# Deleting a version ALWAYS spends its number permanently, with or without this
# block, and a reclamation is a deletion — freeing disk must not free the
# namespace. There is no setting that lets a coordinate be reused.
#
#   POST /api/v1/admin/registries/{registry}/retention?dry_run=true
#   POST /api/v1/admin/registries/{registry}/retention-pin   body: {name, version, keep}
#   GET  /api/v1/admin/registries/{registry}/tombstones
#   POST /api/v1/admin/registries/{registry}/tombstones/compact
#
# [[registries]]
# type = "npm"
# name = "my-npm"
# mode = "local"
#
# [registries.retention]
# keep_versions              = 10    # newest N per package, by publish date
# keep_for_days              = 365   # anything published within this window
# keep_if_pulled_days        = 90    # anything DOWNLOADED within this window
# keep_yanked                = true  # default: a yank is not a reason to destroy
# download_signal_floor_days = 400   # before this, "no download record" proves
#                                    # nothing (default: 2026-08-27, when the
#                                    # Maven/NuGet local paths began recording)
# reclaim_delay_ms           = 250   # pace a first live run; 0 paces nothing
# tombstone_detail_for_days  = 730   # strip a deleted version's checksum,
#                                    # publisher and metadata after two years.
#                                    # The coordinate claim is kept forever and
#                                    # there is no setting that removes it.
# dry_run                    = true  # DEFAULT. Report and change nothing.

# ── IP-Based Blocking (fail2ban) ──────────────────────────────────────────────
#
# Automatically blocks IPs that trigger too many violation events (rate limit hits,
# auth failures) within a configurable time window. Blocked IPs receive HTTP 403
# with an X-Block-Expires header until the ban duration expires.
#
# Blocked IPs are stored in the same backend as the cache (redis/postgres/memory).
#
# Manual block management via the admin API:
#   GET    /api/v1/admin/ip-blocks
#   POST   /api/v1/admin/ip-blocks          body: { "ip": "1.2.3.4", "reason": "...", "duration_secs": 3600 }
#   DELETE /api/v1/admin/ip-blocks/{ip}
#
# [ip_blocking]
# enabled               = true
# violation_threshold   = 10       # violations before auto-block (default: 10)
# violation_window_secs = 300      # counting window in seconds (default: 300)
# ban_duration_secs     = 3600     # how long to block the IP (default: 3600)
# trigger_on_status     = [429, 401]   # HTTP status codes that count as violations
#
# `[ip_blocking].trusted_proxies` still works but is **deprecated**: proxy trust
# is now a server-level setting covering the forwarded host and scheme as well as
# the client IP. Move the list to [server].trusted_proxies (see above); until you
# do, it is honoured for all three and reported as a config warning.

# ── Host-based (subdomain) registry routing ───────────────────────────────────
#
# Every registry is always reachable at /proxy/{name}/…. This section adds a
# second ingress: a hostname whose *root* is the registry, so
#
#     https://npm1.hub.example.com/lodash
#
# means exactly what https://hub.example.com/proxy/npm1/lodash means. Useful for
# ecosystems that assume they own the origin root (cargo publishes to
# /api/v1/crates/new, GitLab serves /api/v4/…), and for handing a team a stable
# vanity hostname.
#
# On a registry host *every* path belongs to that registry — the admin API, the
# SPA, /healthz and /metrics live on the main host only.
#
# Operator prerequisites: a DNS record (or wildcard) per host, a certificate
# covering it, a reverse proxy that forwards the original Host, and
# [server].trusted_proxies listing that proxy — see above. Configuring host
# routing without a trusted-proxy policy is a startup error, because routing
# would depend on a header the server has no stated policy about.
#
# [subdomain_routing]
# enabled     = true                # derive <name>.<base_domain> for every registry
# base_domain = "hub.example.com"   # npm1.hub.example.com -> registry "npm1"
# scheme      = "https"             # only used to advertise public URLs; never routes
#
# Per registry (independent of [subdomain_routing] — a registry can have vanity
# hosts with no wildcard configured at all):
#
#   [[registries]]
#   name         = "npm1"
#   type         = "npm"
#   hosts        = ["npm.acme.io"]  # extra hostnames rooted at this registry
#   path_routing = true             # default; false => the host is the only ingress
#
# `path_routing = false` makes /proxy/npm1/… return 404, so content handed to a
# team under npm.acme.io does not also answer on the shared main host. A registry
# with path_routing = false and no reachable host is a config error.
#
# A host claimed by two registries, a `hosts` entry equal to `base_domain`, and a
# `hosts` entry that is a URL rather than a bare hostname are all rejected at
# startup. A registry name that is not a valid DNS label simply gets no wildcard
# host, with a warning at GET /api/v1/admin/config/warnings.

# ── Notifications ─────────────────────────────────────────────────────────────
#
# Outbound channels for package lifecycle events (package_published,
# package_yanked, package_unyanked, package_deleted), plus inbound endpoints
# external systems can post their own events to.
#
# Declaring a channel here does not send anything on its own: a channel is a
# *destination*, and which events reach it is a subscription, managed at runtime
# via /api/v1/admin/notifications/subscriptions (or the Notifications page in
# the UI). Channels declared here are what those subscriptions can point at —
# GET /api/v1/admin/notifications/channels lists them.
#
# Secrets accept ${VAR_NAME} like every other sensitive value in this file.
#
# [notifications]
# enabled = true                    # default: true when the section is present
#
# --- Slack / Teams incoming webhook (the URL is the credential) ---
# [[notifications.channels]]
# name         = "ops-slack"
# type         = "slack"            # slack | teams
# url          = "${SLACK_WEBHOOK_URL}"
# timeout_secs = 10                 # default: 10
#
# --- Generic HTTP webhook (the only channel type that signs its payloads) ---
# [[notifications.channels]]
# name         = "ci-webhook"
# type         = "webhook"
# url          = "https://ci.example.com/hooks/batlehub"
# secret       = "${CI_WEBHOOK_SECRET}"  # adds X-BatleHub-Signature-256: sha256=<hex>
# timeout_secs = 10
#
# --- Email over SMTP ---
# [[notifications.channels]]
# name          = "release-mail"
# type          = "email"
# smtp_host     = "smtp.example.com"
# smtp_port     = 587               # default: 587
# smtp_user     = "batlehub"        # optional
# smtp_password = "${SMTP_PASSWORD}"  # optional
# from          = "batlehub@example.com"
# to            = ["ops@example.com", "sec@example.com"]
# tls           = true              # STARTTLS; default: true
# timeout_secs  = 10
#
# --- Inbound webhooks: POST /api/v1/webhooks/inbound/{name} ---
# The endpoint is public (no admin auth). Without a secret any payload is
# accepted, which is only safe on an internal network; with one, the request
# must carry X-Hub-Signature-256: sha256=<hmac-hex> over the raw body.
# Received events are listed at GET /api/v1/admin/notifications/inbound.
#
# [[notifications.inbound]]
# name   = "ci-scanner"
# secret = "${INBOUND_WEBHOOK_SECRET}"

# ── Egress proxy (optional) ───────────────────────────────────────────────────
#
# Route every upstream fetch through an HTTP proxy. Set once here for the whole
# server; any registry may override it with its own [registries.proxy] table
# using the same four keys (useful when one upstream is reachable directly and
# the rest are not).
#
# [proxy]
# url      = "http://proxy.corp.example.com:3128"
# username = "batlehub"                    # optional
# password = "${PROXY_PASSWORD}"           # optional
# no_proxy = "localhost,127.0.0.1,.internal"  # comma-separated hosts/suffixes

# ── Vulnerability scanning ────────────────────────────────────────────────────
#
# Periodically re-check every cached SBOM against the OSV vulnerability database
# (https://osv.dev) and record findings. Findings are surfaced per-version in the
# Package Explorer and admin views, and can gate downloads via a per-registry
# `cve_gate` rule (see [[registries.rules]] above).
#
# [vulnerability_scan]
# enabled       = true
# interval_secs = 86400                  # re-scan cadence in seconds (default: daily)
# osv_api_url   = "https://api.osv.dev"  # optional; defaults to the public OSV API
# batch_size    = 100                    # SBOMs processed per page

# ── Cache coherence (orphaned-blob collection) ────────────────────────────────
#
# An artifact is cached in two steps: the bytes are stored, then the row that
# points at them is recorded. A process killed between the two leaves a blob no
# request can reach and no eviction strategy will ever consider — every strategy
# reads the table the row is missing from. This sweep collects those.
#
# Off unless you ask for it: it deletes on a timer with nobody watching. A blob
# only goes if the *previous* sweep saw it orphaned too, so the interval is also
# the margin a cache write in flight gets — keep it comfortably above the time a
# large upload takes to finish recording itself. Below 300s the server warns.
#
# On demand, without the schedule:
#   POST /api/v1/admin/registries/{registry}/coherence?dry_run=true
#   batlehub admin cache coherence <registry> --dry-run
#
# [cache_coherence]
# enabled       = true
# interval_secs = 86400                  # sweep cadence in seconds (default: daily)

# ── Self-hosted / private registry auth + TLS ────────────────────────────────
#
# Any registry block may include an [upstream_auth] table and/or a [tls] table.
# These are evaluated independently; you can use auth without custom TLS and
# vice-versa.
#
# Sensitive values (tokens, passwords, header values) can be pulled from env
# variables using ${VAR_NAME} syntax.  BatleHub replaces these placeholders
# before parsing the TOML.  If a referenced variable is not set, startup fails
# with a clear error message.  Use $${VAR_NAME} to write a literal "${VAR_NAME}".
#
# --- Bearer token (Gitea, Forgejo, npm token, GitHub PAT, …) ---
# [[registries]]
# type = "npm"
# name = "internal-npm"
# upstreams = ["https://gitea.corp.example.com/api/packages/myorg/npm"]
#
# [registries.upstream_auth]
# type = "bearer"
# token = "${INTERNAL_NPM_TOKEN}"   # export INTERNAL_NPM_TOKEN=npat-xxxx
#
# --- Basic auth (Nexus, Artifactory, …) ---
# [[registries]]
# type = "cargo"
# name = "internal-cargo"
# upstreams = ["https://nexus.corp.example.com/repository/cargo-proxy/"]
#
# [registries.upstream_auth]
# type = "basic"
# username = "deploy"
# password = "${INTERNAL_CARGO_PASSWORD}"   # export INTERNAL_CARGO_PASSWORD=s3cr3t
#
# --- Custom header (X-API-Key or any header-based auth scheme) ---
# [[registries]]
# type = "npm"
# name = "internal-npm-key"
# upstreams = ["https://nexus.corp.example.com/repository/npm-proxy/"]
#
# [registries.upstream_auth]
# type = "header"
# name = "X-API-Key"
# value = "${INTERNAL_NPM_API_KEY}"   # export INTERNAL_NPM_API_KEY=my-api-key
#
# --- Custom CA certificate for self-signed TLS ---
# (combine with any of the auth variants above, or use standalone)
# [registries.tls]
# ca_cert_path = "/etc/ssl/corp-ca.pem"   # PEM-encoded CA certificate

# ── OpenTelemetry (optional) ──────────────────────────────────────────────────

# [otel]
# endpoint = "http://localhost:4317"
# service_name = "batlehub"

# ── Statistics (optional) ─────────────────────────────────────────────────────
# Both of this instance's statistical outputs. Defaults reproduce the behaviour
# from before RFC 0004, so the block can be omitted entirely.

# [stats]
# history_enabled        = true   # hourly cache rollup behind the dashboard trend
# history_retention_days = 30     # 0 keeps every row (disables pruning, not history)
#
# /metrics is unauthenticated: it publishes cache hit rates, per-registry pull
# volumes and upstream latencies to anyone who can reach the port. Leave this on
# if Prometheus scrapes you; turn it off if nothing does.
# metrics_enabled        = true
