version: "3"

# The Helm chart's own documentation. `helm/batlehub/README.md` is generated by
# helm-docs from Chart.yaml, the chart's dependencies and the `# --` comments in
# values.yaml — never hand-edited. Prose that is not a value description lives in
# `helm/batlehub/README.md.gotmpl` and survives regeneration.
#
# Generated rather than written for the same reason the listing-filter and
# README-support tables in the documentation are: a values table that drifts from
# values.yaml is a statement about the chart that is not true, and the drift is
# invisible in review because both files look fine on their own.

vars:
  # `--sort-values-order=file` rather than the default alphanumeric: values.yaml
  # is grouped by concern with a banner comment per section, and alphabetical
  # order throws that grouping away for no reader's benefit.
  HELM_DOCS: helm-docs --chart-search-root=helm/batlehub --sort-values-order=file

tasks:
  helm:docs:
    desc: Regenerate helm/batlehub/README.md from Chart.yaml and values.yaml
    cmds:
      - "{{.HELM_DOCS}}"

  helm:docs:check:
    desc: Fail if the chart README has drifted from Chart.yaml or values.yaml
    # Compares the file with what the generator produces right now, then puts
    # the original back: the gate must not leave a rewritten file behind on a
    # working tree it found clean.
    cmds:
      - |
        set -euo pipefail
        readme=helm/batlehub/README.md
        if [ ! -f "$readme" ]; then
          echo "$readme does not exist — run 'task helm:docs' and commit the result" >&2
          exit 1
        fi
        before=$(mktemp)
        cp "$readme" "$before"
        {{.HELM_DOCS}} >/dev/null
        if ! diff -u "$before" "$readme" >/dev/null; then
          echo "the chart README has drifted — run 'task helm:docs' and commit the result" >&2
          diff -u "$before" "$readme" >&2 || true
          cp "$before" "$readme"
          rm -f "$before"
          exit 1
        fi
        rm -f "$before"
        echo "the chart README matches Chart.yaml and values.yaml"

  helm:lint:
    desc: helm lint the chart, with its dependencies built
    cmds:
      - helm dependency build helm/batlehub
      - helm lint helm/batlehub
