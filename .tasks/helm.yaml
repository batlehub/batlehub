version: "3"

# The Helm chart's own documentation. `helm/batlehub/README.md` is generated by
# helm-docs from Chart.yaml, the chart's dependencies and the `# --` comments in
# values.yaml — never hand-edited. Prose that is not a value description lives in
# `helm/batlehub/README.md.gotmpl` and survives regeneration.
#
# Generated rather than written for the same reason the listing-filter and
# README-support tables in the documentation are: a values table that drifts from
# values.yaml is a statement about the chart that is not true, and the drift is
# invisible in review because both files look fine on their own.

vars:
  # `--sort-values-order=file` rather than the default alphanumeric: values.yaml
  # is grouped by concern with a banner comment per section, and alphabetical
  # order throws that grouping away for no reader's benefit.
  HELM_DOCS: helm-docs --chart-search-root=helm/batlehub --sort-values-order=file

tasks:
  helm:docs:
    desc: Regenerate helm/batlehub/README.md from Chart.yaml and values.yaml
    cmds:
      - "{{.HELM_DOCS}}"

  helm:docs:check:
    desc: Fail if the chart README has drifted from Chart.yaml or values.yaml
    # Compares the file with what the generator produces right now, then puts
    # the original back: the gate must not leave a rewritten file behind on a
    # working tree it found clean.
    cmds:
      - |
        set -euo pipefail
        readme=helm/batlehub/README.md
        if [ ! -f "$readme" ]; then
          echo "$readme does not exist — run 'task helm:docs' and commit the result" >&2
          exit 1
        fi
        before=$(mktemp)
        cp "$readme" "$before"
        {{.HELM_DOCS}} >/dev/null
        if ! diff -u "$before" "$readme" >/dev/null; then
          echo "the chart README has drifted — run 'task helm:docs' and commit the result" >&2
          diff -u "$before" "$readme" >&2 || true
          cp "$before" "$readme"
          rm -f "$before"
          exit 1
        fi
        rm -f "$before"
        echo "the chart README matches Chart.yaml and values.yaml"

  helm:lint:
    desc: helm lint the chart, with its dependencies built
    cmds:
      - helm dependency build helm/batlehub
      - helm lint helm/batlehub

  # ── The example values files (deploy/helm/) ──────────────────────────────────
  # Seven complete `-f` files, referenced one by one from
  # docs/guide/install/helm.md. A values file that no longer renders — a key the
  # chart dropped, a config block the server stopped accepting — is a worse
  # defect than a stale paragraph: it is copied verbatim and fails in someone
  # else's cluster, not here.
  #
  # Two failures are possible and only the second is interesting: the chart
  # refusing to template it, and the *rendered* config.toml being something the
  # server will not load. `explain-config` is what catches the second, and it is
  # the reason this runs the binary rather than stopping at `helm template`.

  helm:examples:
    desc: Every deploy/helm/values-*.yaml renders and its config.toml loads
    silent: true
    cmds:
      - task: helm:examples:check
      - |
        set -euo pipefail
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        # Built once: `cargo run` per file would re-check the workspace seven times.
        cargo build --quiet -p batlehub-server
        bin=$(cargo metadata --format-version 1 --no-deps \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/debug/batlehub
        for f in deploy/helm/values-*.yaml; do
          helm template batlehub ./helm/batlehub -f "$f" > "$tmp/rendered.yaml"
          python3 - "$tmp/rendered.yaml" "$tmp/config.toml" <<'PY'
        import sys, yaml
        for d in yaml.safe_load_all(open(sys.argv[1])):
            if d and d.get("kind") == "Secret" and "config.toml" in (d.get("stringData") or {}):
                open(sys.argv[2], "w").write(d["stringData"]["config.toml"])
                break
        else:
            sys.exit("no config.toml Secret rendered")
        PY
          # The placeholders the examples deliberately leave to the environment.
          out=$(OIDC_CLIENT_SECRET=placeholder "$bin" --config "$tmp/config.toml" explain-config 2>&1) || {
            echo "$f: the rendered config does not load" >&2
            echo "$out" >&2
            exit 1
          }
          # explain-config exits 0 on a config that loads with warnings, so the
          # `!!` lines are read rather than the status code.
          if echo "$out" | grep -q '!!'; then
            echo "$f: the rendered config loads with warnings" >&2
            echo "$out" | grep '!!' >&2
            exit 1
          fi
          echo "  ok  $f"
        done
        echo "every example values file renders and loads"

  helm:examples:sync:
    desc: Write each deploy/helm values file back into the recipe that names it
    cmds:
      - python3 .tasks/scripts/helm_examples_sync.py

  helm:examples:check:
    desc: Fail if an inline recipe has drifted from the values file it names
    cmds:
      - python3 .tasks/scripts/helm_examples_sync.py --check
