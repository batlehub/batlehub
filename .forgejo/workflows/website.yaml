name: Publish
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .forgejo/workflows/website.yaml
  # A manual run publishes the checked-out ref (any branch) to the page of your
  # choice, so a docs branch can be previewed on its own page without touching
  # the canonical `batlehub` one.
  workflow_dispatch:
    inputs:
      page:
        description: "Git Pages page to publish to — the path after <owner>.git.batleforc.fr/"
        required: false
        default: batlehub
      base_url:
        description: "Vite base path (leave empty to derive /<page>/)"
        required: false
        default: ""
jobs:
  publish:
    runs-on: git-pages
    name: Publish batlehub website
    enable-openid-connect: true # Required for vault authentication
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner has no pnpm of its own. Same action/pin as updatecli.yml.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      # `page` and `base_url` are attacker-controllable strings on a dispatch, so
      # they go through the environment rather than `${{ }}` interpolation into
      # the script body. The page name also ends up in a URL: keep it to the
      # characters a Git Pages slug can actually hold.
      - name: Resolve target page
        id: target
        env:
          # `github.event.inputs`, not the newer `inputs` context: the former is
          # what Forgejo's runner has always understood, and on a push both are
          # simply empty — which the `:-` defaults below already handle.
          PAGE_INPUT: ${{ github.event.inputs.page }}
          BASE_INPUT: ${{ github.event.inputs.base_url }}
        run: |
          set -euo pipefail
          page="${PAGE_INPUT:-batlehub}"
          page="${page#/}"
          page="${page%/}"
          case "$page" in
            *[!A-Za-z0-9._-]* | "")
              echo "::error::invalid page name '$page' (allowed: A-Z a-z 0-9 . _ -)"
              exit 1
              ;;
          esac
          base="${BASE_INPUT:-/$page/}"
          case "$base" in
            /*) ;;
            *) base="/$base" ;;
          esac
          case "$base" in
            */) ;;
            *) base="$base/" ;;
          esac
          echo "page=$page" >>"$GITHUB_OUTPUT"
          echo "base=$base" >>"$GITHUB_OUTPUT"
          echo "Publishing '${{ github.ref_name }}' to page '$page' with base '$base'"
      - name: Build the documentation site
        env:
          BASE_URL: ${{ steps.target.outputs.base }}
        run: |
          cd docs
          pnpm install --frozen-lockfile
          pnpm run docs:build
          cp -R .vitepress/dist ../dist
          cd ..
          ls -la dist
      # A push only ever reaches here from `main` (see the trigger); a dispatch
      # is trusted to publish whatever ref it was started from.
      - name: Publish to Git Pages
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          git-pages-cli https://${{ github.repository_owner }}.git.batleforc.fr/${{ steps.target.outputs.page }} --token ${{ secrets.GITHUB_TOKEN }} --upload-dir dist
