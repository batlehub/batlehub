services:

  # ── RustFS (S3-compatible object storage) ────────────────────────────────────
  #
  # RustFS rather than MinIO, the same move `mise.toml` records for the client
  # and `test.yaml` already made for the S3 suite: MinIO withdrew its community
  # download host — `dl.min.io` answers 410 Gone for every path — so nothing
  # here can install either half of it any more.
  #
  # No `command:`, no console port: RustFS serves S3 on 9000 out of the box,
  # which is also why CI can run it as a plain service container.
  perf-rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    ports:
      - "9200:9000"   # S3 API
    volumes:
      - perf_rustfs_data:/data
    # A liveness probe on the S3 port rather than a vendor health endpoint:
    # an unauthenticated request to the root is answered (403 is an answer),
    # and `curl -s` without `--fail` is happy with any status.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (shared metadata cache) ────────────────────────────────────────────
  perf-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save ""
      - --appendonly no
      - --stop-writes-on-bgsave-error no
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  perf_rustfs_data:
