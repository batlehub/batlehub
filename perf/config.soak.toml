# BatleHub soak / leak-detection configuration — `perf/scripts/soak.sh`.
#
# `config.perf.toml` with three differences, each one because this config is
# started by a script rather than by a person:
#
#   - the database URL comes from `${DATABASE_URL}`, so the same file serves a
#     developer's compose Postgres and CI's service container;
#   - the pool is **small on purpose**. A 50-connection pool hides a connection
#     leak for the length of any run anyone would sit through; at 10, a handler
#     that forgets to return one exhausts the pool while the run is still going
#     and the verdict names it;
#   - the upstream is the mock (`${SOAK_UPSTREAM_URL}`), so a run offers
#     thousands of requests a minute for an hour without pointing any of them
#     at somebody else's registry.
#
# The port and the storage path are overridden by the script through
# `PROXY_CACHE__SERVER__PORT` / `PROXY_CACHE__STORAGE__PATH`, the same
# mechanism the heavy suites use, so two runs can share a machine.

[server]
host = "127.0.0.1"
port = 8180

[database]
type = "postgresql"
url = "${DATABASE_URL}"
max_connections = 10

[storage]
type = "filesystem"
path = "./tmp/soak-storage"

# **Postgres, not the default in-memory cache**, and this is a measurement
# decision rather than a deployment one.
#
# The in-memory metadata cache lives in the process's own RSS, so every cached
# document is memory the idle-RSS comparison sees. That is not wrong — it *is*
# resident — but it is not a leak either, and it grows with the length of the
# run: measured at +11.2 % idle RSS on a 40-second run whose only fault was
# having cached more than the 25-second warm-up did. A gate that fails on a
# correct cache teaches people to raise the threshold.
#
# Here the cache is a table, so what is left in RSS is what the *process* is
# holding. It is also what a real deployment runs (the server warns at startup
# that the in-memory cache is not shared between replicas), so the soak measures
# the shape that ships.
[cache]
type = "postgres"

# ── Token auth ────────────────────────────────────────────────────────────────
# The same two tokens as config.perf.toml, because `perf/k6/config.js` defaults
# to them and the scenarios are shared.

[[auth]]
type = "token"

[[auth.tokens]]
value = "perf-admin-token"
role = "admin"
user_id = "perf-admin"

[[auth.tokens]]
value = "perf-user-token"
role = "user"
user_id = "perf-user"

# ── The proxied registry: reads, misses and the listing document ─────────────

[[registries]]
type = "npm"
name = "perf-npm"
upstreams = ["${SOAK_UPSTREAM_URL}/npm"]

[registries.rbac]
anonymous = []
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# Eviction is configured so the sweep has work to do: a soak accumulates a
# version per miss, and a cache that only ever grows is not the steady state
# this is trying to measure.
[registries.cache]
artifact_ttl_secs = 3600
keep_latest_n = 3

# On, because it is the per-request document-building path in the mix and it is
# where a leak would be least visible from the outside.
[registries.sbom]
enabled = true
formats = ["spdx", "cyclonedx"]
fetch_upstream = false

# ── A registry with a different cost shape: whole-registry documents ────────
#
# Three registries, not one, because "which registry is the worst consumer" is
# not a question a single-registry run can answer — and because the shapes
# genuinely differ. An npm read is a small document and a small artifact; a
# RubyGems compact index is the *whole registry* in one document, which is the
# expensive shape this project has measured before (RFC 0015 §11.7). A soak
# whose registries all cost the same thing measures one thing twice.
[[registries]]
type = "rubygems"
name = "perf-gems"
upstreams = ["${SOAK_UPSTREAM_URL}/gems"]

[registries.cache]
metadata_ttl_secs = 300

[registries.rbac]
anonymous = []
user = ["releases:read", "releases:list", "source:read"]
admin = ["*"]

# ── The local registry: the write path ───────────────────────────────────────

[[registries]]
type = "npm"
name = "perf-local-npm"
mode = "local"

[registries.rbac]
anonymous = []
user = ["releases:read", "releases:list", "source:read", "releases:publish"]
admin = ["*"]

[registries.quota]
max_storage_bytes_per_user = 10_737_418_240
max_packages_per_user = 100_000
enforcement = "warn"

[registries.sbom]
enabled = true
formats = ["spdx", "cyclonedx"]
fetch_upstream = false
