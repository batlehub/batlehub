version: "3"

# One Taskfile per domain, all flattened into a single namespace: `flatten: true`
# means a task keeps the exact name it had when this file was 1 866 lines long,
# so `task ui:dev` and `task test:pg-cache` are still what CI, the docs and the
# devfile call. Included files inherit the vars and the dotenv below, resolve a
# relative `dir:` against this directory, and can call each other's tasks by
# plain name.
includes:
  cde: .tasks/cde.yaml
  mise: .tasks/mise.yaml
  rust: { taskfile: .tasks/rust.yaml, flatten: true }
  test: { taskfile: .tasks/test.yaml, flatten: true }
  coverage: { taskfile: .tasks/coverage.yaml, flatten: true }
  security: { taskfile: .tasks/security.yaml, flatten: true }
  ui: { taskfile: .tasks/ui.yaml, flatten: true }
  docs: { taskfile: .tasks/docs.yaml, flatten: true }
  helm: { taskfile: .tasks/helm.yaml, flatten: true }
  rfc: { taskfile: .tasks/rfc.yaml, flatten: true }
  compose: { taskfile: .tasks/compose.yaml, flatten: true }
  browser: { taskfile: .tasks/browser.yaml, flatten: true }
  dex: { taskfile: .tasks/dex.yaml, flatten: true }
  perf: { taskfile: .tasks/perf.yaml, flatten: true }
  release: { taskfile: .tasks/release.yaml, flatten: true }

dotenv: [ .env ]

vars:
  # kubectl hops into the che-browser sidecar of this workspace pod — see
  # .tasks/browser.yaml. Global rather than file-local because .tasks/ui.yaml's
  # rendered design gates run inside that sidecar too.
  BROWSER_EXEC: kubectl exec ${DEVWORKSPACE_NAMESPACE:+-n ${DEVWORKSPACE_NAMESPACE}} ${HOSTNAME} -c browser --
  BROWSER_LOGS: kubectl logs ${DEVWORKSPACE_NAMESPACE:+-n ${DEVWORKSPACE_NAMESPACE}} ${HOSTNAME} -c browser

tasks:
  init:
    desc: Init project
    cmds:
      - mise upgrade
      - git remote set-url origin --add --push https://git.batleforc.fr/batleforc/batlehub
      - git remote set-url origin --add --push https://github.com/batlehub/batlehub
