# gitleaks configuration — secret scanning gate (see .github/workflows/secret-scan.yaml).
#
# Extends the full built-in ruleset; the allowlist below only exempts known
# non-secrets (test key fixtures and documentation examples). Keep it tight — do
# not allowlist whole directories where a real credential could later land.

title = "batlehub gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and documentation examples — no live secrets"
paths = [
    # RSA keys embedded for OIDC / GitHub Actions OIDC token-signing tests.
    '''crates/adapters/src/auth/oidc\.rs''',
    '''crates/adapters/src/auth/actions_oidc\.rs''',
    '''crates/adapters/src/auth/actions_oidc/tests\.rs''',
    '''crates/adapters/tests/actions_oidc\.rs''',
    # `curl -H "Authorization: Bearer <token>"` usage examples in the docs.
    '''docs/guide/installation\.md''',
    '''docs/guide/configuration\.md''',
    # The French translations of those same two pages (added 2026-09-09), which
    # carry the same `my-admin-token` placeholder in the same `curl -H` shape.
    '''docs/fr/guide/installation\.md''',
    '''docs/fr/guide/configuration\.md''',
    # The same two documents at the paths they had before RFC 0005 merged
    # `website/` into `docs/`. The scan walks full history (`fetch-depth: 0`),
    # and history keeps the old path, so allowlisting only the current one
    # leaves the placeholder `my-admin-token` flagged forever — which is what
    # has been failing the nightly full scan on main since 2026-08-17.
    '''website/guide/installation\.md''',
    '''website/guide/configuration\.md''',
    '''docs/configuration\.md''',
    '''docs/installation\.md''',
    # Throwaway RSA keys for the apk index-signing tests, generated once with
    # `openssl genrsa` and used nowhere but `cargo test`. They have to be real
    # keys in real files: `include_str!` needs a file, and aws-lc-rs generates
    # nothing below 2048 bits, so the "key below the floor" test could not mint
    # its 1024-bit key at run time even if the rest could.
    '''crates/adapters/src/repo/testdata/apk_signing_.*\.pem''',
]
# Matched on the value rather than the file, because the scan walks full
# history: an inline `gitleaks:allow` fixes the working tree and leaves the
# commit that introduced the line flagged forever. Same reason the two
# pre-RFC-0005 `website/` paths are still listed above.
regexes = [
    # base64 of "extension.vsixmanifest" — the entry key vsce-sign writes into
    # a `.signature.manifest`, asserted literally in `vsx_signature.rs` so the
    # shape stays measured off the real signer. `generic-api-key` reads the
    # trailing `==` as a token.
    '''ZXh0ZW5zaW9uLnZzaXhtYW5pZmVzdA==''',
    # An empty PEM block — header, footer, no body — as the Rust string literal
    # `apk_signer.rs` feeds `ApkSigner::from_pem` to assert it is refused. There
    # is no key material in it; `private-key` matches the header alone. Listed
    # as a value rather than as the file so a real key pasted into that file is
    # still a finding.
    '''-----BEGIN PRIVATE KEY-----\\n-----END PRIVATE KEY-----''',
    # The perf harness's token. Not a credential: `perf/scripts/seed.sh` mints
    # it against a throwaway local server, and `perf/k6/config.js`, the
    # scenarios, `perf/scripts/lifecycle.sh` and `perf/README-authz-11-7.md`
    # all carry the same literal. Only the ones that write it as a
    # `curl -H 'Authorization: Bearer …'` are flagged, by `curl-auth-header` —
    # which is two files now and was one when this was a path entry, so it is
    # matched on the value instead.
    '''perf-user-token''',
]
