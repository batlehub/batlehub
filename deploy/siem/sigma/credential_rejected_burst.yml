title: BatleHub credential rejected in a burst
id: 02462a2d-02b8-485f-980b-d670cbdf8256
status: experimental
description: >-
  One source IP presented credentials that no provider accepted, many times in a minute. The server writes one credential_rejected row per IP per minute and carries the attempts it held back on the next row, so a high throttled_count is the burst. With n proxy replicas each writes its own row.
references:
  - https://batleforc.git.batleforc.fr/batlehub/operations/siem
author: BatleHub
date: 2026-10-05
tags:
  - attack.credential-access
  - attack.t1110
logsource:
  product: batlehub
  service: audit
detection:
  selection:
    event.dataset: batlehub.audit
    event.action: credential_rejected
    batlehub.audit.throttled_count|gte: 10
  condition: selection
falsepositives:
  - A CI job retrying with an expired or revoked token
level: medium
