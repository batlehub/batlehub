title: BatleHub audit seal record
name: batlehub_audit_seal
id: f4e7ac3d-3b16-48bb-b533-b2f7f030f0da
status: experimental
description: >-
  One record of the audit trail's seal chain, as it left the host.
references:
  - https://batleforc.git.batleforc.fr/batlehub/operations/siem
author: BatleHub
date: 2026-10-05
logsource:
  product: batlehub
