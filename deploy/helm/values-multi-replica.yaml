# Several replicas behind one Service. Two things make that possible, and both
# are here: artifacts in a bucket every replica can write to, and a metadata
# cache they share. The cache backend is PostgreSQL — the database is already
# there, so this adds no service.
#
#   helm install batlehub ./helm/batlehub -n batlehub --create-namespace \
#     -f deploy/helm/values-multi-replica.yaml
#
# Documented at docs/guide/install/helm.md § Setup 2.
replicaCount: 3

config:
  database:
    type: "postgresql"
    url: "postgresql://batlehub:changeme@postgres-svc:5432/batlehub"
    # Each replica opens its own pool. Lower it behind a connection pooler.
    max_connections: 5

  storage:
    type: "s3"
    bucket: "batlehub-artifacts"
    region: "us-east-1"
    # prefix: "prod"
    # endpoint_url: "http://rustfs:9000"   # for RustFS and other S3-compatible stores
    # force_path_style: true               # required by most of them

  # Shared, and not only for metadata: rate limiting and IP blocking read the
  # same backend. Left in-process, each replica would count on its own.
  cache:
    type: "postgres"
    # url defaults to database.url

  auth:
    - type: "token"
      tokens:
        - value: "my-admin-token"
          role: "admin"
          user_id: "admin"

  registries:
    - type: "npm"
      name: "npm"
      rbac:
        anonymous: ["releases:read", "source:read"]
        user: ["releases:read", "source:read"]
        admin: ["*"]

# No PVC: ReadWriteOnce cannot be shared across nodes, and every artifact is in
# the bucket.
persistence:
  enabled: false

# Rendered only above one replica — a budget over a single pod blocks drains
# and buys nothing.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Keep the replicas off one node: a PDB protects a drain, not a node failure.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: batlehub

# The [storage] block carries no access key, because there is no such field —
# an access_key_id written there is ignored, not refused. Credentials come from
# the AWS SDK chain: the pod's IAM role (IRSA, Workload Identity), or these.
envFrom:
  - secretRef:
      name: batlehub-s3-credentials   # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

ingress:
  enabled: true
  className: nginx
  host: batlehub.example.com
  tls:
    - secretName: batlehub-tls
      hosts:
        - batlehub.example.com
