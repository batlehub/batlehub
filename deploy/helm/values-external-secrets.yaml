# Every credential outside the chart, in a Secret with its own lifecycle.
#
# Two mechanisms, and they solve different problems:
#
#   credentials.existingSecret  a second config *file*, merged over `config`.
#                               Whole sections belong to it — the database URL,
#                               an [[auth]] block, a registry's upstream token.
#                               It carries no checksum annotation, so rotating
#                               it reloads in place instead of rolling the pods.
#   env + ${VAR} placeholders   one secret in one field, expanded at startup.
#                               A placeholder with no variable behind it is a
#                               startup error naming the variable.
#
# The chart renders neither Secret here: both come from External Secrets
# Operator, Sealed Secrets or Vault Agent. The ExternalSecret manifests at the
# bottom are rendered by the chart only as a convenience — delete them and
# apply your own if your platform owns that shape.
#
#   helm install batlehub ./helm/batlehub -n batlehub --create-namespace \
#     -f deploy/helm/values-external-secrets.yaml
#
# Documented at docs/guide/install/helm.md § A separate config file for the
# credentials.
replicaCount: 2

config:
  # Everything that is not a secret. This is what the chart-managed Secret
  # holds, and what the console's config editor reads and rewrites.
  storage:
    type: "s3"
    bucket: "batlehub-artifacts"
    region: "us-east-1"

  cache:
    type: "postgres"

  auth:
    - type: "oidc"
      issuer_url: "https://sso.example.com/application/o/batlehub/"
      client_id: "batlehub"
      client_secret: "${OIDC_CLIENT_SECRET}"   # expanded at startup, from env below
      redirect_uri: "https://batlehub.example.com/api/v1/auth/oidc/callback"
      scopes: ["openid", "profile", "email", "groups"]
      user_id_claim: "preferred_username"
      role_claim: "groups"
      role_mappings:
        "platform-admins": "admin"
        "developers": "user"

  registries:
    - type: "npm"
      name: "internal-npm"
      upstreams:
        - "https://registry.corp.example.com/npm"
      rbac:
        anonymous: []
        user: ["releases:read", "source:read"]
        admin: ["*"]

persistence:
  enabled: false

# The second config file: database URL and upstream tokens, merged over the
# above. Arrays of tables merge on `name`, which is what lets it add a token to
# one registry without restating the other twenty.
credentials:
  enabled: true
  existingSecret: batlehub-credentials
  key: credentials.toml

env:
  - name: OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: batlehub-secrets
        key: oidc-client-secret

envFrom:
  - secretRef:
      name: batlehub-s3-credentials   # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

# Rendered by the chart, but they are ESO resources, not BatleHub ones: they
# tell the operator to materialise the two Secrets referenced above.
externalManifest:
  - name: batlehub-credentials-eso
    manifest: |
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: batlehub-credentials
        namespace: {{ .Release.Namespace }}
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: batlehub-credentials
          template:
            engineVersion: v2
            data:
              # The whole second config file, assembled from the store.
              credentials.toml: |
                [database]
                type = "postgresql"
                url  = "{{ `{{ .databaseUrl }}` }}"

                [[registries]]
                name = "internal-npm"

                [registries.upstream_auth]
                type  = "bearer"
                token = "{{ `{{ .npmToken }}` }}"
        data:
          - secretKey: databaseUrl
            remoteRef:
              key: batlehub/prod
              property: database_url
          - secretKey: npmToken
            remoteRef:
              key: batlehub/prod
              property: internal_npm_token

  - name: batlehub-secrets-eso
    manifest: |
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: batlehub-secrets
        namespace: {{ .Release.Namespace }}
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: batlehub-secrets
        data:
          - secretKey: oidc-client-secret
            remoteRef:
              key: batlehub/prod
              property: oidc_client_secret

ingress:
  enabled: true
  className: nginx
  host: batlehub.example.com
  tls:
    - secretName: batlehub-tls
      hosts:
        - batlehub.example.com
