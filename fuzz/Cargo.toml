[workspace]

[package]
name = "batlehub-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
batlehub-core = { path = "../crates/core" }
# The archive readers: what the scan worker extracts before a scanner runs
# (`scanners::extract`, behind `vuln-scan`) and what the SBOM extractors read
# a manifest out of (`sbom`). No registry client, no database driver: the
# fuzz build carries the parsers and nothing that would need a network.
batlehub-adapters = { path = "../crates/adapters", default-features = false, features = ["sbom", "vuln-scan"] }
bytes = "1"
tar = "0.4"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
arbitrary = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
chrono = "0.4"
serde_json = "1"
# Only the re-encoding side of `fuzz_integrity_parse`; the versions are the
# workspace's, so the lockfile resolves them to the crates core already uses.
hex = "0.4"
base64 = "0.23"
# Only the oracle side of `fuzz_version_order`: an independent strict-semver
# read of a version list, to hold `best_latest` to what its doc claims.
semver = "1"

[[bin]]
name = "fuzz_rbac_evaluate"
path = "fuzz_targets/fuzz_rbac_evaluate.rs"
test = false
doc = false

