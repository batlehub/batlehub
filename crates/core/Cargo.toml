[package]
name = "batlehub-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
anyhow.workspace = true
tracing.workspace = true
metrics.workspace = true
utoipa.workspace = true
regex.workspace = true
semver.workspace = true
# `maven-metadata.xml` is the one listing document this proxy has to *rewrite*
# rather than read, so the blocking filters need a real parser rather than the
# tag-slicing the Maven adapter uses for reads. quick-xml never resolves
# external entities — it hands unknown ones back to the caller untouched — so a
# hostile upstream document gets no XXE primitive against the proxy.
quick-xml.workspace = true
# README rendering (RFC 0007 phase 4). Both live in `core` rather than `web`
# because the security boundary has to be somewhere the fuzz target,
# `cargo audit` and `cargo deny` already look — and because the CLI and any
# other API consumer must not each need their own renderer and their own bugs.
pulldown-cmark.workspace = true
ammonia.workspace = true
sha1 = "0.11"
sha2.workspace = true
hmac.workspace = true
# The RubyGems compact index identifies each `/info/{gem}` document by the MD5
# of its bytes, and Bundler compares that against what it fetched. Not a
# security use — a wire format that names the algorithm.
md-5 = "0.11"
hex.workspace = true
zip.workspace = true
base64.workspace = true
# Ed25519-only signature verification (download path). RSA-based crypto (the
# `rsa` crate) is hard-banned by deny.toml; Ed25519 keeps the tree rsa-free.
ed25519-dalek = "3"
# RFC 0008 §4.3 — the bundle is a tar. A format codec, like `serde_json`
# beside it: no I/O of its own, it works over `Read`/`Write`, and putting it
# here is what lets the CLI (export) and the server (import) share one
# definition of the layout rather than two that must agree.
tar = "0.4"

[lints]
workspace = true
