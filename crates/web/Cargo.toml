[package]
name = "batlehub-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
batlehub-core = { path = "../core" }
batlehub-config = { path = "../config" }
batlehub-adapters = { path = "../adapters" }
async-trait.workspace = true
actix-web.workspace = true
actix-files.workspace = true
actix-multipart = "0.8"
reqwest.workspace = true
utoipa.workspace = true
utoipa-actix-web.workspace = true
utoipa-scalar.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
bytes.workspace = true
futures.workspace = true
ipnet.workspace = true
tokio.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
sha2.workspace = true
hmac = "0.13"
hex.workspace = true
# The RubyGems compact index identifies a document by the MD5 of its bytes, and
# Bundler sends that back as `If-None-Match`. A wire format, not a security use.
md-5 = "0.11"
lettre = { version = "0.11", features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"], default-features = false }
quick-xml = { workspace = true }
base64.workspace = true
zip.workspace = true
form_urlencoded.workspace = true
# conda and mamba request `repodata.json.zst` before any other encoding, and
# fall back to `.bz2` (RFC 0009 §7.5). Without them every client pays the full
# uncompressed transfer of a document fetched on every solve.
zstd = "0.13"
bzip2 = "0.6"

[dev-dependencies]
batlehub-adapters = { path = "../adapters" }
# Test-only: sign a bundle manifest, to walk RFC 0008's import through its
# own door rather than around it.
ed25519-dalek = "3"
actix-http = "3"
ar = "0.9"
# Test-only: build `.tar.bz2` conda package fixtures.
bzip2 = "0.6"
flate2 = "1"
# Test-only: build `.rpm` fixtures via `rpm::PackageBuilder` (the `payload` feature).
# No `rsa` — that only arrives via `signature-pgp`, which we never enable.
rpm = { version = "0.27", default-features = false, features = ["payload", "gzip-compression"] }
tar = "0.4"
tempfile.workspace = true
toml.workspace = true
mockito = "1"

[lints]
workspace = true
