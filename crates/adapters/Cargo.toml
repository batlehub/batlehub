[package]
name = "batlehub-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
aws-config = {
  workspace = true,
  features = ["default-https-client", "credentials-process", "rt-tokio"],
  optional = true
}
aws-sdk-s3 = {
  workspace = true,
  features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"],
  optional = true
}
base64.workspace = true
batlehub-core = { path = "../core" }
bytes.workspace = true
chrono.workspace = true
bzip2 = { version = "0.6", optional = true }
flate2 = { version = "1", optional = true }
toml = { workspace = true, optional = true }
zstd = { version = "0.13", optional = true }
# Deb/RPM repository hosting (all pure-Rust; none pull the banned `rsa` crate).
ar = { version = "0.9", optional = true }
lzma-rs = { version = "0.3", optional = true }
sha1 = { version = "0.11", optional = true }
ed25519-dalek = { version = "3", optional = true }
rpm = { version = "0.27", default-features = false, features = [
  "gzip-compression",
  "xz-compression",
  "zstd-compression",
], optional = true }
futures.workspace = true
# Non-optional: used both by the actions-OIDC group rules and by the
# path-proxy `path_allow` allowlist, which is shared across registry features.
# `glob` has no transitive dependencies, so unconditional inclusion is free.
glob.workspace = true
hex.workspace = true
jsonwebtoken = { version = "11", features = ["aws_lc_rs"], optional = true }
metrics.workspace = true
rand = "0.10"
redis = {
  version = "1",
  features = ["connection-manager", "tokio-comp"],
  optional = true
}
regex = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tar = { version = "0.4", optional = true }
tokio.workspace = true
# The scanner runner (RFC 0018 §6.3): per-job work directories and the
# rlimits set on a sandboxed scanner before exec.
tempfile.workspace = true
libc = "0.2"
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
quick-xml = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
# Building .deb/.rpm fixtures for unit tests and the apt/dnf interop generator
# (`tests/repo_interop.rs`). These are dev-only so they never reach production.
ar = "0.9"
flate2 = "1"
mockito = "1"
rcgen = "0.14"
# Test-only: the `payload` feature unlocks `rpm::PackageBuilder` / `FileOptions` for
# building `.rpm` fixtures. Pulls no extra crates (`payload = []`) — notably not the
# banned `rsa`, which only arrives via `signature-pgp`.
rpm = { version = "0.27", default-features = false, features = ["payload", "gzip-compression"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tar = "0.4"
tokio-rustls = "0.26"
toml = { workspace = true }
# Building `.pkg.tar.zst` fixtures for the pacman interop generator.
zstd = "0.13"

[features]
default = [
  "auth-actions-oidc",
  "auth-kubernetes",
  "auth-oidc",
  "auth-token",
  "db-postgres",
  "local-registry",
  "registry-cargo",
  "registry-composer",
  "registry-conda",
  "registry-deb",
  "registry-forgejo",
  "registry-github",
  "registry-gitlab",
  "registry-goproxy",
  "registry-rpm",
  "registry-pacman",
  "registry-maven",
  "registry-npm",
  "registry-openvsx",
  "registry-pypi",
  "registry-nuget",
  "registry-rubygems",
  "registry-terraform",
  "registry-vscode-marketplace",
  "registry-jetbrains",
  "registry-jetbrains-marketplace",
  "registry-generic",
  "registry-nodedist",
  "registry-sdkman",
  "sbom",
  "storage-fs",
  "vuln-scan"
]
# `auth-oidc`, not just `jsonwebtoken`: `actions_oidc` calls
# `crate::auth::oidc::required_spec_claims`, and `auth::oidc` is gated on
# `auth-oidc`. Without this, `--no-default-features --features auth-actions-oidc`
# — a combination this feature list advertises as valid, and which nothing in CI
# builds — fails with an unresolved-module error.
auth-actions-oidc = ["auth-oidc", "dep:jsonwebtoken", "dep:regex"]
auth-kubernetes = []
auth-oidc = ["dep:jsonwebtoken"]
auth-token = []
cache-redis = ["dep:redis"]
db-postgres = []
local-registry = ["db-postgres"]
registry-cargo = ["dep:flate2", "dep:tar", "dep:toml"]
registry-composer = ["dep:zip"]
registry-forgejo = []
registry-github = []
registry-gitlab = []
registry-goproxy = []
registry-maven = []
registry-npm = []
registry-nuget = ["dep:zip"]
registry-openvsx = []
registry-conda = ["dep:bzip2", "dep:zip", "dep:zstd", "dep:tar"]
registry-deb = [
  "dep:ar",
  "dep:flate2",
  "dep:tar",
  "dep:lzma-rs",
  "dep:zstd",
  "dep:sha1",
  "dep:ed25519-dalek",
]
registry-rpm = [
  "dep:rpm",
  "dep:flate2",
  "dep:quick-xml",
  "dep:ed25519-dalek",
  "dep:sha1",
]
registry-pacman = [
  "dep:zstd",
  "dep:tar",
  "dep:flate2",
  "dep:lzma-rs",
  "dep:sha1",
  "dep:ed25519-dalek",
]
registry-pypi = []
# JetBrains IDE-archive proxy cache. Reuses the generic `PathProxyRegistryClient`
# (shared with deb/rpm), so it needs no extra dependencies.
registry-jetbrains = []
# JetBrains Marketplace (plugins.jetbrains.com) metadata-API adapter — distinct
# from the path-addressed `registry-jetbrains` IDE-archive kind. Needs quick-xml
# for the plugin-repository XML format.
registry-jetbrains-marketplace = ["dep:quick-xml"]
# Path-addressed mirror of an arbitrary upstream file tree (toolchain tarballs,
# vendor CDNs). Also reuses `PathProxyRegistryClient`.
registry-generic = []
registry-nodedist = []
# SDKMAN: the candidates API and the download broker as one registry, the
# broker's 302 followed server-side through the SSRF guard (RFC 0010).
registry-sdkman = []
registry-rubygems = ["dep:flate2", "dep:tar"]
registry-terraform = []
registry-vscode-marketplace = []
storage-fs = []
storage-s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
# `bzip2`/`zstd` are for conda's two container formats, which the README
# extractor reads `info/about.json` out of (RFC 0007 §4.3). Both are already in
# the default build through `registry-conda`, so this widens no dependency tree.
sbom = [
  "db-postgres",
  "dep:flate2",
  "dep:tar",
  "dep:zip",
  "dep:quick-xml",
  "dep:bzip2",
  "dep:zstd",
]
vuln-scan = ["db-postgres"]

[lints]
workspace = true
