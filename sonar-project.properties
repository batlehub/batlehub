# rust:S5659 ("Verify the signature of this JWT") false-positive on
# `OidcSsoFlow::verify_nonce`. The signature *is* verified — just not there.
# The token that function reads was returned by the provider's token endpoint
# over TLS, in response to a request only this server could make, and it is
# never trusted for authentication on the strength of that read: every later
# request re-presents it to `OidcAuthProvider::authenticate`, which validates
# the signature against the provider's JWKS. `verify_nonce` is the OpenID
# Connect Core §3.1.3.7 step 11 replay check, and reading the `nonce` claim is
# the only thing it does. Verifying a signature there would be a second,
# redundant JWKS round-trip on the login path.
sonar.issue.ignore.multicriteria.oidcNonceDecode.ruleKey=rust:S5659
sonar.issue.ignore.multicriteria.oidcNonceDecode.resourceKey=crates/adapters/src/auth/oidc.rs

# jssecurity:S6549 ("Change this code to not check file existence based on
# user-controlled data") false-positive on `stub-server.mjs`'s static handler.
# The containment check is already there and runs *before* the sink: the path is
# resolved against DIST and then required to be DIST itself or to start with
# `DIST + sep`, and `&&` short-circuits, so `existsSync` is never reached for a
# path outside the tree. The rule does not model `resolve()` + `startsWith()` as
# a sanitiser, so it flags the guarded call anyway.
#
# Two independent reasons it cannot escape, checked against `/../../etc/passwd`,
# `/%2e%2e/%2e%2e/etc/passwd`, `/..%2f..%2fetc/passwd` and `/....//....//`:
# `new URL` collapses dot segments (including percent-encoded ones) before the
# path is read, and a `%2f` that survives decoding stays an ordinary filename
# character. Every one of those resolves inside `dist/`.
#
# Scope note: this is the design-gate harness that serves `ui/dist` to a local
# headless browser (RFC 0003 §13). It is not shipped and never binds anything
# but localhost. Do not extend this ignore to a resourceKey that ships.
sonar.issue.ignore.multicriteria.stubServerPath.ruleKey=jssecurity:S6549
sonar.issue.ignore.multicriteria.stubServerPath.resourceKey=ui/build/stub-server.mjs

# plsql:S125 ("Remove this commented out code") on the rollback runbooks inside
# migration header comments. Two reasons, and the second is why this is a
# configured ignore rather than a per-issue resolution in the UI:
#
#   1. It is documentation of a manual procedure, not disabled code. 039's is
#      the `DELETE FROM local_packages WHERE deleted_at IS NOT NULL` a rollback
#      must run *before* dropping the columns, or every tombstone becomes a live
#      version with no bytes (RFC 0016 §9).
#   2. **Migrations are append-only and editing one breaks running deployments.**
#      `crates/adapters/src/migrations.rs` embeds them with `Migration::new()`,
#      which computes a SHA-384 over the SQL *text*; sqlx validates it against
#      `_sqlx_migrations` on every startup. Changing one character of a comment
#      in an already-applied migration makes the migrator refuse to run with
#      `VersionMismatch`, on every instance that has applied it.
#
# The general rule, and the reason this is scoped to the directory: a SonarCloud
# finding inside crates/adapters/migrations/ is resolved, never fixed, unless the
# migration has not yet shipped. See docs/internal/sonar-triage-2026-08-30.md.
sonar.issue.ignore.multicriteria.migrationComment.ruleKey=plsql:S125
sonar.issue.ignore.multicriteria.migrationComment.resourceKey=crates/adapters/migrations/**

# Web:S6845 ("tabindex should only be declared on interactive elements") on the
# table's scroll container. Two scanners disagree here and axe is the one that is
# right: a region that scrolls but cannot be reached by keyboard is unreachable
# content for anyone not using a pointer — axe reports it as
# `scrollable-region-focusable`, WCAG 2.1.1 requires the region be operable, and
# RFC 0003 §4.7 makes tables keyboard-operable explicitly. `tabindex="0"` on the
# container is the standard remedy; Sonar's rule has no exception for scroll
# containers. Removing the attribute would trade a real, testable accessibility
# failure for a heuristic one.
#
# The element is a <section> with an accessible name, so it is not an anonymous
# focus stop — it carries role="region" natively and announces as something worth
# stopping on. Scoped to the one component: do not widen it to ui/src/**.
sonar.issue.ignore.multicriteria.tableTabindex.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.tableTabindex.resourceKey=ui/src/components/ui/table/Table.vue

# shell:S5332 ("Make sure that using clear-text protocols is safe here") on the
# heavy suites. Every one of them boots a server on 127.0.0.1 and drives a real
# package manager at it over plain HTTP — that is what the harness *is*, and the
# credentials in those URLs are per-run literals generated by the suite itself
# (`authz-denied-token`) that authorise nothing outside the throwaway registry
# the run creates and the run's own process tree.
#
# It is also not incidental: several clients refuse a plain-http registry and the
# suites document working around it (`allowInsecureConnections` for NuGet,
# `secure-http: false` for Composer, and the terraform target's TLS-terminating
# tap, which exists precisely because Terraform will not talk to one). Making
# these HTTPS would delete the thing being measured.
#
# Scope note: tests/heavy/** only, and only because nothing there ships or binds
# anything but localhost. Product code reaching an upstream over http:// is a
# real finding — do not widen this.
sonar.issue.ignore.multicriteria.heavyClearText.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.heavyClearText.resourceKey=tests/heavy/**

# Web:S6845 again, on the CSV-format sample in AdminBulk.vue. Same element and
# same argument as `tableTabindex` above: a `<section>` with an accessible name
# wrapping content wider than its column, focusable so a keyboard user can reach
# what is off-screen. axe reports the absence as `scrollable-region-focusable`,
# and it is only visible at 390px, which is where the rendered gate found it.
#
# A second criterion rather than widening the first, so neither scope note
# becomes a lie. The two are the same construct on purpose — if a third appears,
# that is the moment to make it a component instead of a third entry here.
sonar.issue.ignore.multicriteria.bulkPreTabindex.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.bulkPreTabindex.resourceKey=ui/src/pages/AdminBulk.vue

# Web:S6819 ("use <select>/<datalist> instead of the listbox role", "use <option>
# instead of the option role") on the async combobox. The rule's premise is that
# a native element does this job, and here it does not: the options are fetched
# and filtered as the caller types, the active option is tracked with
# `aria-activedescendant` against an `<input role="combobox">`, and the list is
# `v-show`n so `aria-controls` always points at a real element.
#
# `<select>` cannot take an async filtered option set and cannot be the target of
# `aria-controls` from a text input. `<datalist>` cannot be styled, cannot show a
# loading or empty-result message — the message that catches the typo — and its
# assistive-technology support is the least consistent of the three. What is
# implemented is the ARIA 1.2 combobox pattern, which is what the spec prescribes
# when the native control will not do.
sonar.issue.ignore.multicriteria.comboboxRoles.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.comboboxRoles.resourceKey=ui/src/components/ui/combobox/Combobox.vue

# Web:S6819 ("use <meter> instead of the meter role"). This one is a genuine
# native element and the reason not to use it is specific rather than a
# preference: a UA-rendered `<meter>` carries its own green/amber/red fill for
# the `low`/`high`/`optimum` bands, it cannot be reliably overridden (WebKit
# ignores `appearance: none` for the bar), and hue is then the only channel
# reporting the state.
#
# DESIGN.md's Undependable Fill Rule forbids exactly that, and the component
# obeys it — the state is carried by the value text and the caption, with the
# token palette confirming. Meter.vue's own header documents the three-part
# contract it implements instead: an accessible name via `aria-labelledby`,
# `aria-valuenow`/`min`/`max`, and an `aria-valuetext` that reads the sentence a
# sighted user sees. Swapping in `<meter>` would trade a written design rule for
# a rendering nobody controls.
sonar.issue.ignore.multicriteria.meterRole.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.meterRole.resourceKey=ui/src/components/ui/meter/Meter.vue
# rust:S4790 ("Use a stronger hashing algorithm than MD5/SHA-1") on the nine weak
# digests left in this codebase. None is a security decision: each is a field a
# wire format *names* as MD5/SHA-1, a cache validator a client compares
# byte-for-byte, or the verification side of a checksum an upstream advertised in
# SHA-1 — where the alternative to hashing with SHA-1 is not verifying at all.
#
# There were thirteen. A recheck against the specifications on 2026-08-31 found
# four that no protocol actually required, and those were deleted rather than
# ignored: pacman's %MD5SUM% (removed from the format outright in pacman 6.1.0)
# and Debian's MD5sum/SHA1 in `Packages` and `Release` (optional, and the format
# forbids a client from trusting them). Real apt and pacman still accept the
# indexes without them — `.github/workflows/repo-interop.yaml` is the gate.
#
# One of the five below is a compatibility retention rather than a requirement,
# and says so: the compact-index ETag, needed only by Bundler < 2.7.
# docs/operations/weak-hashes.md is the register, with the specifications.
#
# The distinction that matters: nothing here authenticates anything. Package
# integrity that *is* a trust decision is carried by SHA-256 (computed alongside
# the weak digests in deb.rs and pacman.rs) and by the OpenPGP signatures over
# the indexes. A collision against any of these buys an attacker nothing they
# could not already do by serving different bytes, because none of these values
# is what the server trusts.
#
# Scope note, and it applies to all nine entries: each is pinned to the one file
# that speaks the protocol. A weak hash anywhere else — a token, a password, a
# cache key that gates access, a signature — is a real finding. Do not widen any
# of these to a directory, and do not add a tenth entry without the same
# "the format defines it" argument.

# Composer's `dist.shasum` is defined as SHA-1 and Composer hashes the downloaded
# zip with SHA-1 to compare, so a SHA-256 there fails every download; a `sha256`
# dist field is an open request upstream (composer#5940), not a thing that
# exists. `sha1_hex` is called from the Composer publish handler and nowhere
# else — npm goes through `dist.integrity` (SSRI) and never reaches it.
#
# The other three hits in this file are not emission at all: `verify` and
# `StreamingVerifier` pick their algorithm from the checksum the *upstream*
# advertised, so the SHA-1 arm is what makes an upstream SHA-1 checkable.
sonar.issue.ignore.multicriteria.hashNpmShasum.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hashNpmShasum.resourceKey=crates/core/src/services/integrity.rs

# The RubyGems compact index names an MD5 of each `info` document in
# `/versions`, and Bundler recomputes it to decide whether its cached copy is
# current. It is a cache-validity checksum, in the algorithm the format names.
sonar.issue.ignore.multicriteria.hashRubygemsIndex.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hashRubygemsIndex.resourceKey=crates/core/src/services/local_registry/eco_rubygems.rs

# Same index, the HTTP half — and this is the ETag, not `Repr-Digest`: the
# `Repr-Digest` these responses carry is already SHA-256, which is what the
# format requires. Bundler < 2.7 computes `MD5.hexdigest` over its cached copy
# and sends it as `If-None-Match` with `bytes=<size - 1>-`, so an ETag in any
# other algorithm never matches and `holds_our_prefix` can never answer a
# resumable range request.
#
# Bundler 2.7.0 (2025-07-16) removed MD5 digesting of compact-index responses, so
# this now serves only older clients, and changing it would cost them a full
# refetch rather than break them. A retained compatibility, not a requirement.
sonar.issue.ignore.multicriteria.hashRubygemsRange.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hashRubygemsRange.resourceKey=crates/web/src/handlers/proxy/rubygems/range.rs

# The test that asserts the two above emit what Bundler expects: it recomputes
# the same MD5 to check the server's, so it is the same requirement.
sonar.issue.ignore.multicriteria.hashRubygemsIndexTest.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hashRubygemsIndexTest.resourceKey=crates/web/tests/local_rubygems_compact_index.rs



# An OpenPGP v4 key fingerprint *is* SHA-1 over `0x99 || len16 || pubkey_body`
# (RFC 4880 §12.2). It is an identifier with a specified construction, not a
# choice: computing it any other way yields a fingerprint no client recognises.
sonar.issue.ignore.multicriteria.hashOpenpgpFingerprint.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hashOpenpgpFingerprint.resourceKey=crates/adapters/src/repo/openpgp.rs

# A composed listing carries the digest fields the format it is imitating
# names, and `listing_synthesis` is the only place BatleHub writes one it did
# not receive: an air-gapped instance answering `/versions` from bytes it
# already holds must fill the same field a real upstream would. Emitting
# SHA-256 there does not harden anything — it produces a document the client
# reads as a failed checksum.
sonar.issue.ignore.multicriteria.hashListingSynthesis.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hashListingSynthesis.resourceKey=crates/core/src/services/listing_synthesis.rs

# The Maven repository layout puts `<artifact>.md5` and `<artifact>.sha1`
# beside every artifact, and every Maven client fetches and compares them.
# The algorithm is the file extension: there is no stronger one to pick,
# because picking one renames the file to something nobody requests. The
# artifact's real integrity is the SHA-256 in `artifact_storage_key` and the
# checksum the proxy verifies on the way in.
sonar.issue.ignore.multicriteria.hashMavenSidecars.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hashMavenSidecars.resourceKey=crates/web/src/handlers/proxy/maven/proxy.rs

# The test that asserts the two sidecars above are emitted, and emitted with
# the values a Maven client will compute for itself. Same requirement, read
# from the other end.
sonar.issue.ignore.multicriteria.hashAirGapEmission.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.hashAirGapEmission.resourceKey=crates/web/tests/air_gap.rs

# `dist.shasum` in an npm packument is SHA-1, and npm verifies the tarball
# against it; the heavy suite recomputes it to check what the server served.
# Same field as `hashNpmShasum` above, from the client side of the wire.
sonar.issue.ignore.multicriteria.hashUpstreamAuditShasum.ruleKey=shell:S4790
sonar.issue.ignore.multicriteria.hashUpstreamAuditShasum.resourceKey=tests/heavy/upstream_audit.sh

# rust:S2612 ("Make sure this permission is safe") on the tar header modes, ×6.
# The rule fires on any mode granting *others* a bit. None of these grants
# write to anyone but the owner, and five of the six are `tar::Header::set_mode`
# in a fixture builder or in the bundle writer — a number written into an
# archive header, which never reaches a filesystem here. A bundle's own entries
# are `0o644` because that is what an importer should get, and the importer
# clamps again on the way out.
#
# The sixth, in `scanners/extract.rs`, is the opposite of the weakness the rule
# describes: it runs *after* an entry from an untrusted archive has been
# written and clamps the result to `0o644`, precisely so an entry claiming
# `0o777`, setuid, or an execute bit does not get one. Tightening it to `0o600`
# would not improve anything the scanner sandbox cares about, and would obscure
# that the line is a clamp rather than a grant.
#
# Scope note: three files, each pinned. A mode set on a real path outside a
# clamp — a key, a credential file, a socket — is a real finding. Do not widen
# these, and see docs/internal/sonar-triage-2026-09-06.md for the register.
sonar.issue.ignore.multicriteria.modeBundleTar.ruleKey=rust:S2612
sonar.issue.ignore.multicriteria.modeBundleTar.resourceKey=crates/core/src/services/bundle.rs

sonar.issue.ignore.multicriteria.modeListingFactsTar.ruleKey=rust:S2612
sonar.issue.ignore.multicriteria.modeListingFactsTar.resourceKey=crates/adapters/src/listing_facts.rs

sonar.issue.ignore.multicriteria.modeExtractClamp.ruleKey=rust:S2612
sonar.issue.ignore.multicriteria.modeExtractClamp.resourceKey=crates/adapters/src/scanners/extract.rs

# docker:S8431 ("Specify either version tag or digest for image") on every
# `FROM name:tag@sha256:…` in the three Containerfiles.
#
# The pair is deliberate and is this repository's convention everywhere an
# image or an action is pinned, workflows included (`registry:3.1.1@sha256:…`,
# and every `uses:` pinned to a commit with its version beside it). The digest
# is the pin — it is what is pulled, and docker:S7023 asks for it — and the tag
# is what a person reads: a bump from `bookworm-slim` to `trixie-slim`, or from
# rust 1.98 to 1.99, is legible in the diff instead of being forty hex
# characters changing. Dropping the tag would satisfy this rule by deleting the
# half of the line a reviewer can check.
#
# Scope note: `Containerfile*` and nothing else. A tag with no digest is a real
# finding and is a different rule (docker:S7023), which stays on.
sonar.issue.ignore.multicriteria.imageTagAndDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.imageTagAndDigest.resourceKey=Containerfile*

# docker:S6596 ("Specific version tag for image should be used") on
# `FROM ${WORKER_IMAGE}` in Containerfile.worker-guarddog.
#
# The base of that image is the worker image the same commit just built, and CI
# passes its **digest** as the build argument, which is stricter than any tag.
# The `:latest` default exists so a developer can build the GuardDog variant
# locally against the published worker image without first building one; it is
# never what CI resolves. A pinned default would go stale on every release and
# would silently build the optional image on an old `batlehub` binary — the one
# failure mode this argument exists to prevent.
sonar.issue.ignore.multicriteria.workerImageArg.ruleKey=docker:S6596
sonar.issue.ignore.multicriteria.workerImageArg.resourceKey=Containerfile.worker-guarddog
