[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/adapters",
    "crates/web",
    "crates/examples",
    "server",
    "cli",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.clippy]
wildcard_imports = "deny"

# Not setting panic = "abort": actix-web isolates a panicking request handler
# per-task via unwinding, so aborting would turn one bad request into a full
# process crash.
[profile.release]
lto = true
codegen-units = 1
strip = true

# ── Debuginfo, sized to what it is actually used for ──────────────────────────
#
# Measured on this workspace: `cargo build --workspace --all-targets` produced a
# 46 GB `target/`, of which 35.6 GB was 102 test executables averaging 350 MB
# each — **81 % of every one of them `.debug_*` sections**. Each test binary
# statically links the whole graph, so the same DWARF is written out a hundred
# times over. The two settings below took that to 46 → 30 → ~14 GB.
#
# What is kept is what this project actually reads: `line-tables-only` is exactly
# the file:line a panic backtrace prints, and 3 425 tests are how a regression is
# found here. What is given up is a debugger's view of variables and types. If
# you are reaching for lldb, delete these two blocks for the session — a rebuild
# is the whole cost, and nothing else in the repo depends on them.
[profile.dev]
debug = "line-tables-only"

#
# Dependencies get none at all. `"*"` is dependencies only — it does not touch
# workspace crates, which take the line tables above. Dependency DWARF is the
# larger half of the two: tokio, actix, sqlx and ~600 others, and nothing here
# steps into their source. Symbol *names* come from the symbol table and survive
# either way, so a backtrace through a dependency frame still names the function.
#
# Coverage is untouched: `cargo llvm-cov` instruments workspace crates, and its
# line mapping comes from that instrumentation rather than from dependency DWARF.
[profile.dev.package."*"]
debug = false

[workspace.metadata.llvm-cov]
# Exclude server startup wiring from coverage — it's integration-tested separately.
exclude = ["server/src/main.rs"]

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# HTTP server
#
# `default-features = false` for one reason: to drop `http2`, which is the only
# thing pulling `h2 0.3` into the tree (RUSTSEC-2026-0258 — unbounded empty DATA
# frames). The advisory is fixed in h2 0.4.16, which is already here for
# hyper/reqwest, but `actix-http 3.13.3` — the latest published — still requires
# the 0.3 line, and there is no 0.3 backport (0.3.27 is the newest). So the
# choice is the feature or the advisory, and the feature costs nothing: this
# server never terminates TLS (`server_factory.rs` calls plain `.bind()`, and the
# only TLS in the config is `[registries.tls]` for *outbound* upstream clients).
# Without TLS, actix's HTTP/2 is reachable only as h2c, which no package manager
# speaks to a registry — real deployments terminate HTTP/2 at the ingress and
# talk HTTP/1.1 to this process, which is unaffected.
#
# The features below are actix-web 4.14's own `default` set with `http2` removed;
# re-add it here if this process ever gains `bind_rustls`/`bind_openssl`, and take
# the advisory up with actix at that point.
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
actix-files = "0.7"
actix-cors = "0.7"

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream", "form"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# OpenAPI
utoipa = { version = "5", features = ["actix_extras", "chrono", "uuid"] }
utoipa-actix-web = "0.1"
utoipa-scalar = { version = "0.3", features = ["actix-web"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Tracing / OTEL
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-actix-web = { version = "0.7", default-features = false }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }

# Database — default-features = false to avoid sqlx-macros → sqlx-macros-core →
# sqlx-mysql → rsa (RUSTSEC-2023-0071, no upstream fix available).
# Migrations are embedded via Migration::new() + include_str! in db/postgres.rs.
# sqlx-macros is further patched to a no-dep stub (see [patch.crates-io] below).
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "json",
    "chrono",
    "uuid",
    "migrate",
] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
# `v5` is name-based and deterministic: the VS Code gallery needs a stable
# extension identity for locally published extensions, and a random one would
# make the editor think an extension changed identity on every restart.
uuid = { version = "1", features = ["v4", "v5", "serde"] }
regex = "1"
glob = "0.3"
semver = "1"
base64 = "0.23"
sha2 = "0.11"
# HMAC-SHA256 for RFC 0012 signed download URLs. The 0.13 line is the one that
# matches `sha2 = "0.11"` (both on `digest 0.11`), and it keeps the signed-URL
# primitive inside the `rsa`-free constraint `deny.toml` enforces.
hmac = "0.13"
hex = "0.4"
form_urlencoded = "1"
# CIDR prefix matching for `[server].trusted_proxies` (already in the tree via
# the HTTP stack; declared here so config/web can depend on it directly).
ipnet = "2"
zip = "8"
quick-xml = "0.42"
# README rendering and sanitisation (RFC 0007 §7.1). `pulldown-cmark` is a
# CommonMark pull parser with no HTML sanitisation of its own — it passes raw
# HTML straight through, which is why nothing reaches a reader without going
# through `ammonia` first. `ammonia` is an allow-list sanitiser over an
# `html5ever` parse: deny by default, not a regex and not an escape pass.
# `default-features = false` on pulldown-cmark drops its CLI/`getopts` path.
# `html` is the renderer; `default-features = false` drops the crate's own
# CLI/`getopts` path, which is not something a server needs in its tree.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
# 0.6 dropped the `std` feature and made `password-hash` (the PHC string types
# and the `PasswordHasher`/`PasswordVerifier` traits) an opt-in feature of its
# own; `getrandom` is what lets `hash_password` draw its own salt from the
# system RNG, which is how the 0.6 API replaces the caller-supplied
# `SaltString::generate(&mut OsRng)` of 0.5. Taking 0.6 also retires the last
# holders of `rand_core 0.6` and `cpufeatures 0.2` in the tree — see `deny.toml`.
argon2 = { version = "0.6", features = ["password-hash", "getrandom"] }

# CLI
clap = { version = "4", features = ["derive"] }

# File watching (hot reload)
notify = "8"

# Testing utilities
tempfile = "3"

# AWS S3 (optional, for storage-s3 feature)
# default-features = false to avoid legacy-rustls-ring (hyper 0.14 / rustls 0.21 / rustls-webpki 0.101)
# which is vulnerable to RUSTSEC-2026-0098/0099/0104.  The new default-https-client path
# uses rustls-aws-lc / hyper 1.x / rustls 0.23 / rustls-webpki 0.103 (patched).
aws-sdk-s3 = { version = "1", default-features = false }
aws-config = { version = "1", default-features = false }

# Patch sqlx-macros with a no-dep stub.
# sqlx-macros is an optional dep of sqlx that is never compiled (the `macros` feature
# is disabled), but Cargo still resolves it with its full transitive chain:
#   sqlx-macros → sqlx-macros-core → sqlx-mysql → rsa (RUSTSEC-2023-0071)
# Replacing it with a local stub removes those packages from the lock file entirely.
[patch.crates-io]
sqlx-macros = { path = "patches/sqlx-macros" }
sqlx-mysql  = { path = "patches/sqlx-mysql" }
