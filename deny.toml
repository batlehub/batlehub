# cargo-deny configuration — supply-chain gate for the Rust workspace.
#
# Complements `cargo audit` (RUSTSEC advisories only) with:
#   • advisories — vulnerabilities + unmaintained + yanked crates
#   • bans       — assert deliberately-removed crates never re-enter the tree
#   • licenses   — flag a future copyleft transitive dependency
#   • sources    — only crates.io + the in-repo `patches/` are trusted
#
# Run locally with `task deny` (or `cargo deny check`). CI gates on it; see
# `.github/workflows/back-dep-audit.yaml`.

[graph]
# Check every target we actually ship for. all-features keeps optional
# adapters (storage-s3, cache-redis, registry-*) in the graph.
all-features = true

# ── Advisories ────────────────────────────────────────────────────────────────
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Yanked crates are treated as a failure — a yank usually means "do not use".
yanked = "deny"
# Mirror the "no suppressions" stance of .cargo/audit.toml: nothing ignored.
ignore = []

# ── Bans ──────────────────────────────────────────────────────────────────────
# These crates were deliberately removed from the dependency tree for security
# reasons (see the [patch.crates-io] block and the AWS/sqlx notes in Cargo.toml).
# Denying them here turns "removed by patch" into an enforced, CI-failing
# invariant: if a dependency bump silently drags one back in, the build breaks.
[bans]
# Duplicate versions: checked, and every one of them accounted for below.
#
# The note here used to read "noisy in a large tree; revisit later". Revisited.
# **Twenty-one crates resolve to more than one version out of 466 on this host,
# and not one is reachable from this repository**: every older line is held by a
# third-party crate already at its latest release, and `cargo update` moves five
# unrelated packages while resolving none of them.
#
#   rpm 0.27.1 (latest)   enum-display-derive → syn 1, and sha1/sha2/sha3/digest
#                         0.10, and cpufeatures 0.2 under sha1 0.10
#   sqlx-core 0.9         sha2 0.10, hashbrown 0.16
#   actix-http / -router  http 0.2, base64 0.22; actix-multipart-derive → darling 0.23
#   jsonwebtoken 11       base64 0.22, signature 2, simple_asn1 → num-bigint 0.4,
#                         and pem 3 against rcgen 0.14's pem 4 (dev only)
#   aws-sigv4 (sigv4a)    crypto-bigint 0.5 / elliptic-curve → rand_core 0.6
#   ring / aws-lc-rs      untrusted 0.7, getrandom 0.2
#   opentelemetry_sdk,    rand 0.9
#     metrics-util
#   prost-derive,         itertools 0.14
#     ratatui-core
#
# argon2 used to be on this list, holding blake2 0.10, cpufeatures 0.2 and
# password-hash → rand_core 0.6, because 0.6 was a release candidate and this is
# password hashing. 0.6.0 is released and taken: it moved to blake2 0.11 and
# password-hash 0.6, which **retired rand_core 0.6 from the tree entirely**.
# cpufeatures 0.2 stayed, but the holder is now rpm's sha1 0.10, not argon2.
#
# cargo-deny reads the whole graph rather than the host's, so it sees sixteen more
# that `cargo tree` cannot — the Windows, macOS and UEFI paths grouped at the end
# of the list. That difference is deliberate and explained there.
#
# They are enumerated rather than waved through: the check is **on**, and a
# duplicate this list does not already account for fails it. The cost is accepted
# knowingly — a transitive bump that moves one of these to another line turns the
# build red until someone edits this file.
#
# ── Security outranks tidiness, and the config enforces it ────────────────────
#
# A red `bans` check is pressure, and pressure is where the wrong fix gets made.
# So the order is stated rather than assumed:
#
#   1. An advisory is never resolved by keeping an old line for tidiness, and a
#      duplicate is never resolved by downgrading. If upgrading a crate to close
#      a RUSTSEC advisory creates a duplicate, **the upgrade stands and the skip
#      is added in the same commit.** One extra copy of a crate costs disk; the
#      alternative costs the advisory.
#   2. `skip` is for de-duplication only. It has no power over `deny` below —
#      cargo-deny refuses to load this file at all if a crate appears in both
#      ("a crate was specified in both `skip` and `deny`"), so the vulnerable
#      lines named there cannot be silenced by adding them here, by accident or
#      under deadline. That is a property of the tool, verified by trying it, not
#      a convention someone has to remember.
#   3. Only then: before adding a `skip`, name who holds the old version and
#      check whether it can simply be upgraded away.
#
multiple-versions = "deny"

# The twenty duplicates, each with the crate that holds the older line. Versions
# are semver requirements (`0.22` is `^0.22`), so a patch release of a holder does
# not need an edit here — only a genuinely new line does, which is the point.
skip = [
    # rpm 0.27.1 is the latest release and still wants `enum-display-derive ^0.1`
    # (syn 1) and the `digest ^0.10` family.
    { name = "syn", version = "1" },
    { name = "sha1", version = "0.10" },
    { name = "digest", version = "0.10" },
    { name = "block-buffer", version = "0.10" },
    { name = "crypto-common", version = "0.1" },
    # …and sqlx-core 0.9 holds sha2 0.10 with it.
    { name = "sha2", version = "0.10" },
    { name = "hashbrown", version = "0.16" },
    # …and cpufeatures 0.2 with it, under that sha1 0.10. (This entry used to be
    # attributed to argon2 0.5.3; argon2 0.6 is on cpufeatures 0.3, so rpm is the
    # only holder now.)
    { name = "cpufeatures", version = "0.2" },
    # rand_core 0.6 is `aws-sigv4`'s: crypto-bigint 0.5 and the elliptic-curve /
    # ecdsa / p256 stack behind aws-sdk-s3's sigv4a. `cargo tree` on this host
    # does not reach it; cargo-deny's `all-features = true` graph does, which is
    # why the skip stays even though the host tree looks clean. (It used to be
    # argon2 0.5.3's password-hash 0.5 as well — argon2 0.6 retired that one.)
    { name = "rand_core", version = "0.6" },
    # actix-http / actix-router, internal to actix.
    { name = "http", version = "0.2" },
    { name = "base64", version = "0.22" },
    # actix-multipart-derive.
    { name = "darling", version = "0.23" },
    { name = "darling_core", version = "0.23" },
    { name = "darling_macro", version = "0.23" },
    # jsonwebtoken 11, via simple_asn1.
    { name = "signature", version = "2" },
    { name = "num-bigint", version = "0.4" },
    # No `pem` skip, deliberately: `cargo tree -d` on this host shows pem 3
    # (jsonwebtoken 11) beside pem 4 (rcgen 0.14.10, a dev-dependency for the
    # test TLS certificates), but cargo-deny's graph resolves a single version
    # and rejects the skip as unnecessary. The gate is cargo-deny, so there is
    # nothing to declare here.
    # ring / aws-lc-rs.
    { name = "untrusted", version = "0.7" },
    { name = "getrandom", version = "0.2" },
    { name = "getrandom", version = "0.3" },
    # opentelemetry_sdk and metrics-util.
    { name = "rand", version = "0.9" },
    { name = "rand_core", version = "0.9" },
    # prost-derive and ratatui-core.
    { name = "itertools", version = "0.14" },
    # proc-macro crates that have not moved to syn 3 yet — the long tail.
    { name = "syn", version = "2" },

    # ── Reachable only on targets this host is not ────────────────────────────
    #
    # `cargo tree` resolves for the host and sees none of these; cargo-deny reads
    # the whole graph, which is the right behaviour here: the CLI is released for
    # `x86_64-pc-windows-msvc` (.github/workflows/build.yaml), so restricting
    # `[graph] targets` to Linux would also stop advisories being reported for the
    # artefact Windows users download. The noise is the price of that coverage.
    #
    # ring pulls windows-sys 0.52, and with it a second generation of the
    # windows-targets tree; everything else on the machine is on 0.53/0.61.
    { name = "windows-sys", version = "0.52" },
    { name = "windows-sys", version = "0.60" },
    { name = "windows-targets", version = "0.52" },
    { name = "windows_aarch64_gnullvm", version = "0.52" },
    { name = "windows_aarch64_msvc", version = "0.52" },
    { name = "windows_i686_gnu", version = "0.52" },
    { name = "windows_i686_gnullvm", version = "0.52" },
    { name = "windows_i686_msvc", version = "0.52" },
    { name = "windows_x86_64_gnu", version = "0.52" },
    { name = "windows_x86_64_gnullvm", version = "0.52" },
    { name = "windows_x86_64_msvc", version = "0.52" },
    # system-configuration, a macOS path under reqwest/hyper-util.
    { name = "core-foundation", version = "0.9" },
    # getrandom's UEFI backend.
    { name = "r-efi", version = "5" },

    # ── The AWS SDK's own crypto and HTTP lineage ─────────────────────────────
    #
    # aws-sigv4 → p256 → ecdsa 0.16, which is a generation behind on the RustCrypto
    # traits; aws-runtime and aws-sdk-s3 hold the rest. All of it arrives through
    # `aws-config` / `aws-sdk-s3`, which Cargo.toml already pins with
    # `default-features = false` for the rustls advisories.
    { name = "hmac", version = "0.12" },
    { name = "const-oid", version = "0.9" },
    { name = "http-body", version = "0.4" },
]
# Wildcards left as "allow": the workspace crates depend on each other via
# versionless `{ path = … }`, which cargo-deny counts as wildcards for public
# crates. The security value here is the `deny` list below, not wildcard hygiene.
wildcards = "allow"
deny = [
    # RUSTSEC-2023-0071 (Marvin attack) — pulled in via sqlx-mysql. Removed by
    # the sqlx-macros / sqlx-mysql stub patches.
    { name = "rsa" },
    { name = "sqlx-mysql" },
    { name = "sqlx-macros-core" },
    # Legacy rustls stack — RUSTSEC-2026-0098/0099/0104. We use the
    # rustls-aws-lc / hyper 1.x path instead (see aws-sdk notes in Cargo.toml).
    { name = "rustls", version = "=0.21" },
    { name = "rustls-webpki", version = "=0.101" },
    # RUSTSEC-2026-0258 (unbounded empty DATA frames) — fixed in h2 0.4.16, which
    # the hyper/reqwest path already uses, with no backport to the 0.3 line.
    # `actix-http` is the only thing that wanted 0.3, through actix-web's default
    # `http2` feature, and that feature is off (see the actix-web notes in
    # Cargo.toml). This entry is what stops a future `default-features = true`
    # from quietly reintroducing the advisory.
    #
    # Expect to keep it for a long time: the 0.3 backport was closed unmerged
    # (hyperium/h2#948, 2026-09-08) and actix's own bump needs `http` 1.x, so it
    # sits on the actix-web v5.0 milestone (actix/actix-web#4199). Checked
    # 2026-09-18.
    { name = "h2", version = "<0.4" },
    # RUSTSEC-2026-0253 (`LruCache::pop()` is not panic-safe: a panicking key
    # `Drop` skips `detach()` and leaves dangling pointers for the next
    # eviction to write through) — patched in lru 0.18.2. The only thing that
    # ever wanted the 0.16 line was `aws-sdk-s3`, which moved to `^0.18.2` in
    # 1.144.0; `ratatui` was already on 0.18. This entry is what stops a
    # downgrade of either from quietly reintroducing the advisory.
    { name = "lru", version = "<0.18.2" },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
# Permissive allowlist. Anything NOT listed (notably GPL/AGPL/LGPL copyleft)
# fails the check, so a future copyleft transitive dependency is surfaced.
# Start broad to avoid a noisy first run; tighten in a follow-up.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots trust store
    "0BSD",                # quoted_printable (via lettre)
    "bzip2-1.0.6",         # bzip2 (via zip)
    "BSL-1.0",
    "Unlicense",
    "MIT-0",
]
confidence-threshold = 0.8

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
