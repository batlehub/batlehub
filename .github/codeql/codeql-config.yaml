name: BatleHub CodeQL config

# `perf/` is the performance harness, not shipped code: `perf/mock-upstream` is
# its own workspace (note the bare `[workspace]` in its Cargo.toml, so
# `cargo build --workspace` at the repo root never builds it), `perf/k6` is the
# load-test scripts, and `perf/corpus-seed` fabricates fixture data. None of it
# is deployed or reachable from the server binary, so a taint path that ends in
# a mock handler describes an attack on the benchmark, not on BatleHub.
#
# Concretely this drops the two `rust/uncontrolled-allocation-size` alerts on
# `perf/mock-upstream/src/main.rs` (82, 128). Both are `req.connection_info()`,
# where the "allocation" is actix copying a request header into a `String` —
# bounded to the HTTP/1 head at `MAX_BUFFER_SIZE = 131_072`
# (actix-http `src/h1/decoder.rs`), so not attacker-controlled in size either.
#
# Scope this narrowly. Everything that ships — crates/, server/, cli/, ui/ —
# stays in the analysis; excluding a path because its alerts are inconvenient
# is how a real finding gets filed under "benchmark noise".
#
# There is deliberately **no `query-filters` block here**, and the standing
# `High` alerts on shipped code are not silenced by one. They are dismissed
# per-alert in Code scanning, on `main`, with the reasoning written down in the
# dated `docs/internal/codeql-triage-<date>.md` notes:
#
#   - `rust/uncontrolled-allocation-size` on
#     `crates/web/src/middleware/proxy_trust.rs` — the same `connection_info()`
#     header copy as the `perf/` pair above, bounded by the same 128 KiB.
#     (2026-08-30, relocated 2026-09-06.)
#   - `rust/path-injection` ×3 on `crates/web/src/services/reload/applier.rs` —
#     the `--config` path, read once at boot; no request-borne route reaches it.
#     (2026-08-30.)
#   - `rust/path-injection` ×2 on `cli/src/contract.rs` — `--contract`, the
#     same CLI-argument-as-path shape, in a binary that is not a service.
#     (2026-09-06.)
#   - `rust/uncontrolled-allocation-size` ×3 on
#     `crates/web/src/services/reload/applier.rs` — the overlay `Vec`'s capacity
#     hint, sized by the *number* of `--config` flags; the request supplies the
#     config text, never the overlay list. (2026-09-09.)
#
# A query-filter would have been the easy fix and the wrong one:
# `rust/path-injection` is a query this codebase needs live, because several
# handlers build storage keys out of request-supplied package coordinates and
# `ensure_safe_key` is the backstop for precisely that. Turning it off repo-wide
# to quiet three boot-time reads of a CLI flag trades a real control for a green
# check. If a future alert is genuinely unfixable in code, dismiss it and add it
# to the triage note — do not add it here.
paths-ignore:
  - perf/**
