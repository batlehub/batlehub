name: Headless Chrome on a CDP port
description: >
  Start the runner's Chrome with remote debugging and export the WebSocket
  endpoint as CDP_WS_URL. Both rendered-gate jobs drive an existing browser over
  CDP instead of launching their own, so both need this; it lived twice,
  byte-identical, in front-design.yaml.

inputs:
  port:
    description: The CDP port to listen on.
    required: false
    default: "9222"
  timeout:
    description: Seconds to wait for Chrome to publish its debugging port.
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PORT: ${{ inputs.port }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail

        # Printed before anything is attempted: when this step fails, the first
        # question is always "is there a Chrome, and which one" — and the answer
        # used to be absent from the log entirely.
        if ! command -v google-chrome >/dev/null; then
          echo "::error::google-chrome is not on PATH on this runner"
          exit 1
        fi
        echo "chrome: $(command -v google-chrome) — $(google-chrome --version)"

        # On its own line, not inline in the argument list. A failing
        # `--user-data-dir="$(mktemp -d)"` is a *substitution* failure, which
        # does not trip `set -e` in argument position: Chrome would then get an
        # empty value, treat the flag as unset, fall back to the default profile
        # — the exact Chrome 136+ condition the flag exists to avoid.
        profile="$(mktemp -d)"
        echo "profile: $profile"

        # The second group is not decoration either. Left on, Chrome spends its
        # first half-minute on GCM registration, component updates, sync and an
        # on-device model download — all of which fail on a runner and none of
        # which a rendering gate wants. This is the subset of puppeteer's own
        # default arguments that turns those off.
        google-chrome --headless=new --no-sandbox --disable-gpu \
          --disable-dev-shm-usage \
          --user-data-dir="$profile" \
          --no-first-run --no-default-browser-check --no-default-apps \
          --disable-background-networking --disable-component-update \
          --disable-sync --disable-extensions --disable-default-apps \
          --disable-client-side-phishing-detection --metrics-recording-only \
          --remote-debugging-address=127.0.0.1 \
          --remote-debugging-port="$PORT" >/tmp/chrome.log 2>&1 &
        chrome_pid=$!

        report_and_die() {
          echo "::error::$1"
          echo "--- chrome.log ---"
          cat /tmp/chrome.log || true
          echo "--- DevToolsActivePort ---"
          cat "$profile/DevToolsActivePort" 2>/dev/null || echo "(absent — Chrome never published a port)"
          echo "--- what the HTTP endpoint says ---"
          curl -sS -m 5 -i "http://127.0.0.1:${PORT}/json/version" || true
          # Leave nothing listening. A self-hosted runner reuses the machine, and
          # a stale browser makes the *next* run's wait succeed against a dead
          # page — a green gate measuring nothing.
          kill "$chrome_pid" 2>/dev/null || true
          exit 1
        }

        # Readiness is a GET of `/json/version`, polled with curl.
        #
        # Not `wait-on`: for an `http://` resource it sends HEAD, and headless
        # Chrome's DevTools server does not answer HEAD usefully, so the probe
        # retried for the full minute and reported "Chrome never opened the CDP
        # port" while the log said, three seconds in, `DevTools listening on
        # ws://127.0.0.1:9222/...`. The same endpoint returns 200 to a GET
        # immediately — the port was never the problem, the method was.
        #
        # Not `DevToolsActivePort` either: `--headless=new` does not write it,
        # so keying on the file swapped one wrong answer for another.
        version=""
        for _ in $(seq 1 "$TIMEOUT"); do
          version="$(curl -sS -m 2 "http://127.0.0.1:${PORT}/json/version" 2>/dev/null || true)"
          case "$version" in *webSocketDebuggerUrl*) break ;; esac
          version=""
          kill -0 "$chrome_pid" 2>/dev/null || report_and_die "Chrome exited during startup"
          sleep 1
        done
        [ -n "$version" ] || report_and_die "Chrome never answered GET /json/version"

        # Handed to the harness so it does not have to rediscover the endpoint,
        # and so nothing has to resolve `localhost` — which is ::1 first on the
        # runners, while Chrome binds IPv4.
        ws="$(printf '%s' "$version" | sed -n 's/.*"webSocketDebuggerUrl": *"\([^"]*\)".*/\1/p')"
        [ -n "$ws" ] || report_and_die "no webSocketDebuggerUrl in /json/version"
        echo "CDP_WS_URL=$ws" >> "$GITHUB_ENV"
        echo "CDP is up: $ws"

