name: Gate scripts
# The Python scripts under .github/scripts decide whether a gate passes
# (RFC 0041 §4.3, tier 4): every exit path of each has a case under
# .github/scripts/tests, stdlib `unittest`, fixtures recorded from the real
# tools. Same command as `task test:scripts`.
on:
  pull_request:
    branches: ["main"]
    paths: [".github/scripts/**", ".github/workflows/scripts-test.yaml"]
  push:
    branches: ["main"]
    paths: [".github/scripts/**", ".github/workflows/scripts-test.yaml"]
permissions:
  contents: read
jobs:
  unittest:
    name: Gate scripts (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: unittest
        run: python3 -I -m unittest discover -s .github/scripts/tests -v
