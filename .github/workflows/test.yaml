name: Test
# Decorrelated test jobs — unit, integration (Postgres/S3/Redis), and the heavy
# client integrations: the marketplaces (headless VS Code + IntelliJ installing
# an extension that exists only on this instance), Bundler, and one job per
# remaining ecosystem in the `heavy-client` matrix (npm, pypi, openvsx, conda,
# nuget, composer, terraform, nvm, sdkman, mise, cargo, go, maven, pathproxy,
# quarantine, upstream_audit), each driving that ecosystem's real client
# against a real server. Each job produces an LCOV file; the final job merges them and
# publishes a coverage table in the run summary.
#
# The heavy jobs exist because the layers above them cannot fail on the bugs
# that matter here: a route can be present, tested and answering `200` with a
# document no client can use (RFC 0009 §5.1). Only the client is the oracle.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/**"
      - "server/**"
      - "cli/**"
      - "fuzz/**"
      - "tests/heavy/**"
      - "docs/guide/admin-policies.md"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/test.yaml"
      - ".github/scripts/merge_coverage.py"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/**"
      - "server/**"
      - "cli/**"
      - "fuzz/**"
      - "tests/heavy/**"
      - "docs/guide/admin-policies.md"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/test.yaml"
      - ".github/scripts/merge_coverage.py"
  # Nightly as well as per-PR, for the heavy client jobs: what they drive is not
  # all in this repository. They install Bundler and npm from their own
  # registries, pinned IDE, Terraform, .NET and micromamba builds, and several
  # resolve against live upstreams — so a new client version, or an upstream
  # that stops serving one, breaks a green tree with no commit to blame. Same
  # reasoning as the daily dependency audits, and the same slot.
  #
  # This runs the whole workflow, not just those jobs: the cheap ones cost
  # little beside them, and a nightly full-suite signal is worth more than a
  # nightly run reporting one job.
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  # Same exclusion list as Taskfile.yml (coverage/coverage-check) and sonar.yaml.
  COVERAGE_EXCLUDE: >-
    server/src/(main|server_factory|setup|stores|watcher)\.rs|crates/web/src/handlers/auth/oidc(\.rs|/)|crates/web/src/handlers/back_office/health/system\.rs|crates/adapters/src/db/|crates/adapters/src/registry/(cargo|npm)\.rs|crates/adapters/src/registry/github/|crates/adapters/src/notification/postgres\.rs|crates/adapters/src/sbom/fetcher\.rs|crates/adapters/src/cache/(postgres|banner_redis)\.rs|crates/adapters/src/local_registry/postgres\.rs|crates/adapters/src/rate_limit/(postgres|ip_block_postgres)\.rs|crates/adapters/src/storage/router/|cli/src/tui/|cli/src/(api|cli)/owner\.rs
jobs:
  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          components: clippy, rustfmt
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      # CI fails on any warning — clippy is denied, formatting must be clean.
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: rustfmt
        run: cargo fmt --all --check
      # Which registries hide blocked versions from their listings is generated
      # from `RegistryKind::listing_filter()` — an exhaustive match a new
      # registry kind cannot be added without answering. Before RFC 0006 the
      # same fact was a hand-written warning box in the admin guide naming npm
      # as the only filtered ecosystem, which nothing kept true.
      #
      # It lives in this job rather than with the other docs drift checks in
      # front-design.yaml because the source of truth is Rust: that workflow has
      # no cargo and does not run on `crates/**`.
      - name: Listing-filter coverage table in sync
        run: |
          table=$(cargo run -q -p batlehub-server --bin listing_coverage)
          page=docs/guide/admin-policies.md
          awk -v table="$table" '
            /^<!-- BEGIN listing-coverage/ { print; print table; skip = 1; next }
            /^<!-- END listing-coverage/   { skip = 0 }
            !skip                          { print }
          ' "$page" > "$page.tmp"
          mv "$page.tmp" "$page"
          if ! git diff --quiet -- "$page"; then
            echo "::error::the listing-coverage table is stale — run 'task docs:listing-coverage' and commit"
            git --no-pager diff -- "$page"
            exit 1
          fi

  fuzz:
    # `fuzz/**` has been in this workflow's path filters since the targets
    # landed, but only as a *trigger*: nothing built them. They live in their own
    # workspace, so `cargo check --workspace` never sees them and neither does
    # clippy — four of the six had been failing to compile against types that
    # moved underneath them, and the first thing to notice was somebody running
    # `task fuzz` by hand. A target that does not build is not a weaker guard
    # than one that does; it is no guard, while still reading like one in the
    # module docs that name it.
    #
    # Two tiers, matching what this workflow already does with the heavy client
    # jobs: every PR pays for the compile, which is what catches drift; the
    # nightly run pays for the actual fuzzing, which is what finds bugs.
    name: Fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "nightly"
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target\nfuzz -> target"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      # The cheap half, and the one that would have caught this: a type error in
      # a target is a type error whether or not libFuzzer ever links. `cargo
      # check` rather than `cargo fuzz build` because the sanitiser-instrumented
      # release build costs minutes and catches nothing extra for this class.
      - name: Every fuzz target still compiles
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --all-targets

      # The expensive half. Nightly and manual only — a per-PR fuzz run is a
      # flaky gate that fails on whichever job got the slow runner, and the
      # targets assert invariants that a 60-second budget explores shallowly
      # anyway. `-max_total_time` bounds each; `-runs` is deliberately not set,
      # so a fast target gets the executions rather than the clock.
      #
      # `detect_leaks=0`: LeakSanitizer cannot start under this runner's
      # `ptrace_scope` and reports the refusal as a 0-byte crash artefact, which
      # is a false positive that looks exactly like a finding.
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          tool: cargo-fuzz
      - name: Fuzz each target
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          # Enumerated from the manifest rather than hard-coded, so a new target
          # is fuzzed by existing here rather than by somebody remembering to
          # add it to a list in a second place.
          targets=$(cargo fuzz list)
          echo "targets: $targets"
          for t in $targets; do
            echo "::group::$t"
            cargo +nightly fuzz run "$t" -- -max_total_time=60
            echo "::endgroup::"
          done
      # The input that broke it is the whole value of a fuzz failure, and it is
      # written to a file the job would otherwise throw away.
      - name: Upload crash artefacts
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  unit:
    name: Unit tests (+ coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Unit tests with coverage (libs + bins)
        run: >-
          cargo llvm-cov --workspace --lib --bins
          --lcov --output-path coverage-unit.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      # llvm-cov cannot instrument doctests on stable — run them uninstrumented.
      - name: Doc tests
        run: cargo test --workspace --doc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage-unit.lcov
          if-no-files-found: error

  integration:
    name: Integration tests (+ coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ROOT_USER: minioadmin
          RUSTFS_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      S3_TEST_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      # Integration tests only (tests/ directories); unit tests are covered by
      # the `unit` job.
      - name: web integration tests
        run: cargo llvm-cov --no-report -p batlehub-web --test '*'
      - name: CLI integration tests (subprocess binary)
        run: cargo llvm-cov --no-report -p batlehub-cli --test integration
      - name: examples integration tests
        run: cargo llvm-cov --no-report -p batlehub-examples --test '*'
      - name: adapters integration tests (Postgres + default features)
        run: cargo llvm-cov --no-report -p batlehub-adapters --test '*'
      - name: adapters S3 integration tests
        run: >-
          cargo llvm-cov --no-report -p batlehub-adapters --features storage-s3 --test s3_storage
      - name: adapters Redis integration tests
        run: |
          cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_cache
          cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_rate_limit
          cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_warm_coordinator
      - name: Generate integration LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-integration.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: coverage-integration.lcov
          if-no-files-found: error

  heavy-marketplace:
    name: Heavy integration (marketplaces)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      # Pinned IDE builds — the cache key below must move with these.
      VSCODE_VERSION: "1.96.4"
      IDEA_VERSION: "2026.1.3"
      WEEBO_VERSION: "0.5.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies (incl. headless VS Code runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            xvfb libnss3 libgtk-3-0 libasound2t64 libgbm1 libxkbfile1 libxshmfence1
      - name: Cache IDE downloads (VS Code + IntelliJ IDEA)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-ides-vscode${{ env.VSCODE_VERSION }}-idea${{ env.IDEA_VERSION }}
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      # Publishes weebo-bridge-notify to local-mode vscode-marketplace and
      # jetbrains-marketplace registries, then installs it with real IDE tooling
      # (headless `code --install-extension`, IntelliJ `installPlugins`). The
      # server runs under cargo-llvm-cov, so its execution is part of coverage.
      - name: Marketplace heavy tests
        run: bash tests/heavy/marketplace.sh
        env:
          COVERAGE: "1"
      - name: Generate heavy LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-heavy.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-heavy
          path: coverage-heavy.lcov
          if-no-files-found: error

  heavy-bundler:
    name: Heavy integration (Bundler)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      # The Bundler generation under test. 4.x is the one whose compact-index
      # updater sends `Range` with an opaque `If-None-Match` and refuses to
      # append a partial response carrying no `Repr-Digest` (RFC 0009 §13.24) —
      # the behaviour the assertions are written against.
      BUNDLER_VERSION: "4.0.17"
      # Install into the workspace so `gem install` needs no sudo, and put its
      # binstubs first so `bundle _4.0.17_` resolves to what we just installed
      # rather than the runner image's default bundler.
      GEM_HOME: ${{ github.workspace }}/.gem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Put the workspace gem bindir on PATH
        run: echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      # Publishes two gems (the second depending on the first) to a local-mode
      # rubygems registry, then drives a real `bundle install` through a logging
      # tap. Asserts the gems resolve at all (§12.15), that the incremental
      # fetch gets a `206` Bundler *accepts* — no full re-fetch after it — and
      # that an unchanged document answers `304` (§13.24). The server runs under
      # cargo-llvm-cov, so its execution is part of coverage.
      - name: Bundler heavy tests
        run: bash tests/heavy/bundler.sh
        env:
          COVERAGE: "1"
      - name: Generate heavy Bundler LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-heavy-bundler.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-heavy-bundler
          path: coverage-heavy-bundler.lcov
          if-no-files-found: error

  # One job per ecosystem, run in parallel: each drives that ecosystem's real
  # client against a real server behind a logging tap and asserts on the wire
  # (tests/heavy/*.sh). They are a matrix rather than seven copies because only
  # the toolchain differs — the Postgres service, the coverage instrumentation
  # and the artifact are the same job.
  #
  # RubyGems and the marketplaces are *not* in here: they were scripted first,
  # have their own pinned clients (Bundler 4.0.17; VS Code + IntelliJ builds
  # with a download cache), and folding them in would mean carrying two more
  # conditional setup blocks for no shared structure.
  heavy-client:
    name: Heavy integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      # One ecosystem failing says nothing about the others, and the whole point
      # is to learn which clients are unhappy.
      fail-fast: false
      matrix:
        include:
          - suite: npm
          - suite: pypi
          - suite: openvsx
          - suite: conda
          - suite: nuget
          - suite: composer
          - suite: terraform
          # nvm: the script downloads nvm's release tarball itself (RFC 0010
          # decision 9 — not the installer) and needs only curl, tar and xz,
          # all on the runner image.
          - suite: nvm
          # sdkman: the script downloads the sdkman-cli release zip itself (RFC
          # 0010 decision 9 — not the installer) and needs curl, zip, unzip and
          # tar, all on the runner image. Installs one JDK (~200 MB) from the
          # vendor CDN the broker names.
          - suite: sdkman
          # mise: installed by the job below. Anonymous GitHub, and the run
          # spends about eighteen of the sixty requests an hour that allows —
          # RFC 0019 phase 1's ref headers, plus RFC 0008 §4's air gap, which
          # seeds a second instance and installs through it with egress
          # denied. A 502 on `releases/assets/{id}` is the budget, not a bug.
          - suite: mise
          # RFC 0018 phase 0a — the rejection survey. cargo, go, mvn and java
          # are on the runner image; the path-proxy suite drives apt (on the
          # image) and dnf (installed by the job below).
          - suite: cargo
          - suite: go
          - suite: maven
          - suite: pathproxy
          # RFC 0018 from the client side: npm against a `[registries.security]`
          # registry backed by npmjs.org and the real OSV, the worker embedded.
          # Needs Node (installed below) and bubblewrap for the egress row —
          # a scanner under the worker's sandbox trying to reach the tap.
          - suite: quarantine
          # RFC 0014 from the receiving end: npm against a directory the
          # suite serves as a registry, a staged disappearance, and the
          # notification asserted at a webhook receiver the suite runs.
          # Needs Node (installed below) and nothing off the runner.
          - suite: upstream_audit
          # RFC 0008-bis phase 0 — the measurement: npm, pip and mise against
          # a second `[air_gap]` instance holding one version of each, with
          # egress denied. Needs Node and mise (installed below), python3
          # with venv (on the image), and about three anonymous GitHub
          # requests for the seed.
          - suite: airgap
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      # Pinned clients, for the same reason `heavy-bundler` pins Bundler: what
      # these assert is one client generation's behaviour, and an unannounced
      # upgrade turning a suite red should name itself here rather than look
      # like a regression in this repository.
      #
      # Only the three the *job* installs are pinned here. The rest — micromamba,
      # ovsx, vsce — are downloaded by the scripts and pinned there, and are
      # deliberately not repeated: the version would then live in two places, and
      # the copy in this file is the one the cache key below cannot see.
      NODE_VERSION: "24"
      DOTNET_CHANNEL: "10.0"
      TERRAFORM_VERSION: "1.8.5"
      MISE_VERSION: "2026.8.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      # ── Per-ecosystem client setup ──────────────────────────────────────────
      - name: Set up Node (npm / Open VSX / quarantine / upstream_audit / airgap)
        if: matrix.suite == 'npm' || matrix.suite == 'openvsx' || matrix.suite == 'quarantine' || matrix.suite == 'upstream_audit' || matrix.suite == 'airgap'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the .NET SDK
        if: matrix.suite == 'nuget'
        run: |
          # Microsoft's own install script rather than a third-party action:
          # one URL, one channel, and no action SHA to keep pinned.
          curl -fsSL --proto '=https' --proto-redir '=https' \
            https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel "$DOTNET_CHANNEL" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Install Terraform
        if: matrix.suite == 'terraform'
        run: |
          # From the release archive rather than a third-party action: one URL,
          # one version, and nothing else enters the runner.
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          sudo unzip -o -q /tmp/terraform.zip -d /usr/local/bin
          terraform version
      - name: Install mise
        if: matrix.suite == 'mise' || matrix.suite == 'airgap'
        run: |
          # From the release archive rather than the `curl | sh` installer:
          # one URL, one version, and nothing else enters the runner.
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/mise.tar.gz \
            "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/mise.tar.gz -C /tmp
          sudo install -m 0755 /tmp/mise/bin/mise /usr/local/bin/mise
          mise --version
      - name: Install dnf
        if: matrix.suite == 'pathproxy'
        run: |
          # Ubuntu packages dnf; the suite refuses to run without it rather
          # than skip the rpm rows (HEAVY_PATHPROXY_SKIP_DNF=1 is the explicit
          # opt-out, for a developer's machine without root).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dnf
          dnf --version | head -1
      - name: Install bubblewrap
        if: matrix.suite == 'quarantine'
        run: |
          # The worker's scanner sandbox (RFC 0018 §6.3). The suite refuses to
          # run without it rather than skip the egress row
          # (HEAVY_QUARANTINE_SKIP_SANDBOX=1 is the explicit opt-out, for a
          # developer's machine without user namespaces).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
      - name: Check PHP and Composer
        if: matrix.suite == 'composer'
        run: |
          # Both ship on the runner image. The script falls back to a static PHP
          # build when they do not, so this step only reports which it will use.
          php --version || echo "no php on PATH — the suite will download a static build"
          composer --version || echo "no composer on PATH — the suite will download composer.phar"
      - name: Cache heavy client downloads
        # conda downloads micromamba; Composer may download a static PHP and
        # composer.phar; nvm downloads its own release tarball. The versions
        # are pinned *in the scripts*, so hashing
        # them is the key that cannot go stale — an env var repeated here would
        # have to be kept in step with the default it shadows.
        #
        # `~` is expanded by the action; it is deliberately not passed to the
        # scripts as `HEAVY_CACHE`, where bash would take it literally and put
        # the downloads in a directory named `~`.
        if: matrix.suite == 'conda' || matrix.suite == 'composer' || matrix.suite == 'nvm' || matrix.suite == 'sdkman'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-clients-${{ matrix.suite }}-${{ hashFiles(format('tests/heavy/{0}.sh', matrix.suite)) }}

      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: Run the ${{ matrix.suite }} heavy suite
        run: bash tests/heavy/${{ matrix.suite }}.sh
        env:
          COVERAGE: "1"
      - name: Generate LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-heavy-${{ matrix.suite }}.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-heavy-${{ matrix.suite }}
          path: coverage-heavy-${{ matrix.suite }}.lcov
          if-no-files-found: error

  # The authorization suite (tests/heavy/authz.sh), one job per target.
  #
  # A job of its own rather than more rows in `heavy-client`, because the shape
  # is different in two ways that would make that matrix lie: every row runs the
  # *same* script with a target argument, and one row — `matrix` — needs no
  # client toolchain at all. It is also the row that matters most and the
  # cheapest to run, so it must not be gated behind seven toolchain installs.
  #
  # What the rows other than `matrix` add is the half no `curl` can check: that
  # a package manager handed a `403` stops, rather than reporting success over a
  # partial install. See the script header for why that is a separate claim.
  heavy-authz:
    name: Heavy authorization (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # One client being unhappy says nothing about the others, and which ones
      # are is the thing being learned.
      fail-fast: false
      matrix:
        include:
          - target: matrix
          - target: signing
          - target: npm
          - target: pypi
          - target: openvsx
          - target: conda
          - target: nuget
          - target: composer
          - target: rubygems
          - target: terraform
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      # Same pins, and the same reason, as `heavy-client`: what these assert is
      # one client generation's behaviour. Kept in step with that job by being
      # spelled the same way rather than shared, because a matrix cannot inherit
      # another matrix's env.
      NODE_VERSION: "24"
      DOTNET_CHANNEL: "10.0"
      TERRAFORM_VERSION: "1.8.5"
      BUNDLER_VERSION: "4.0.17"
      GEM_HOME: ${{ github.workspace }}/.gem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Set up Node (npm / Open VSX)
        if: matrix.target == 'npm' || matrix.target == 'openvsx'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the .NET SDK
        if: matrix.target == 'nuget'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' \
            https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel "$DOTNET_CHANNEL" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Install Terraform
        if: matrix.target == 'terraform'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          sudo unzip -o -q /tmp/terraform.zip -d /usr/local/bin
          terraform version
      - name: Put the workspace gem bindir on PATH
        if: matrix.target == 'rubygems'
        run: echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
      - name: Cache heavy client downloads
        if: matrix.target == 'conda' || matrix.target == 'composer'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-authz-${{ matrix.target }}-${{ hashFiles('tests/heavy/authz.sh') }}

      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: Run the authorization suite (${{ matrix.target }})
        run: bash tests/heavy/authz.sh ${{ matrix.target }}
        env:
          COVERAGE: "1"
      - name: Generate LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-authz-${{ matrix.target }}.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-authz-${{ matrix.target }}
          path: coverage-authz-${{ matrix.target }}.lcov
          if-no-files-found: error

  coverage-report:
    name: Coverage report (merged)
    runs-on: ubuntu-latest
    needs: [unit, integration, heavy-marketplace, heavy-bundler, heavy-client, heavy-authz]
    # Run even when a coverage job fails: merge_coverage.py renders an "absent"
    # row for any missing LCOV, so a partially-green pipeline still reports
    # (download-artifact with a pattern warns, not fails, on zero matches).
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Merge LCOV files and publish the coverage table
        run: |
          python3 .github/scripts/merge_coverage.py --output coverage-merged.lcov \
            unit=coverage-unit.lcov \
            integration=coverage-integration.lcov \
            heavy=coverage-heavy.lcov \
            heavy-bundler=coverage-heavy-bundler.lcov \
            heavy-npm=coverage-heavy-npm.lcov \
            heavy-pypi=coverage-heavy-pypi.lcov \
            heavy-openvsx=coverage-heavy-openvsx.lcov \
            heavy-conda=coverage-heavy-conda.lcov \
            heavy-nuget=coverage-heavy-nuget.lcov \
            heavy-composer=coverage-heavy-composer.lcov \
            heavy-terraform=coverage-heavy-terraform.lcov \
            authz-matrix=coverage-authz-matrix.lcov \
            authz-signing=coverage-authz-signing.lcov \
            authz-npm=coverage-authz-npm.lcov \
            authz-pypi=coverage-authz-pypi.lcov \
            authz-openvsx=coverage-authz-openvsx.lcov \
            authz-conda=coverage-authz-conda.lcov \
            authz-nuget=coverage-authz-nuget.lcov \
            authz-composer=coverage-authz-composer.lcov \
            authz-rubygems=coverage-authz-rubygems.lcov \
            authz-terraform=coverage-authz-terraform.lcov \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-merged
          path: coverage-merged.lcov
          if-no-files-found: error
