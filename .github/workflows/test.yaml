name: Test
# Decorrelated test jobs — unit, integration (Postgres/S3/Redis), and the heavy
# client integrations: the marketplaces (headless VS Code + IntelliJ installing
# an extension that exists only on this instance), Bundler, and one job per
# remaining ecosystem in the `heavy-client` matrix (npm, pypi, openvsx, conda,
# nuget, composer, terraform, nvm, sdkman, mise, cargo, rustup, go, maven,
# pathproxy, quarantine, upstream_audit), each driving that ecosystem's real client
# against a real server. Each job produces an LCOV file; the final job merges them and
# publishes a coverage table in the run summary.
#
# The heavy jobs exist because the layers above them cannot fail on the bugs
# that matter here: a route can be present, tested and answering `200` with a
# document no client can use (RFC 0009 §5.1). Only the client is the oracle.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/**"
      - "server/**"
      - "cli/**"
      - "fuzz/**"
      - "tests/heavy/**"
      - "docs/guide/admin-policies.md"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/test.yaml"
      - ".github/scripts/merge_coverage.py"
  pull_request:
    branches: ["main"]
    # `labeled` on top of the three defaults: the `full-test` label below is a
    # *condition*, and a condition nothing re-evaluates is a condition nobody can
    # use — adding the label to an open dependabot pull request has to start a
    # run, not wait for the next push that will never come.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "crates/**"
      - "server/**"
      - "cli/**"
      - "fuzz/**"
      - "tests/heavy/**"
      - "docs/guide/admin-policies.md"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/test.yaml"
      - ".github/scripts/merge_coverage.py"
  # Nightly as well as per-PR, for the heavy client jobs: what they drive is not
  # all in this repository. They install Bundler and npm from their own
  # registries, pinned IDE, Terraform, .NET and micromamba builds, and several
  # resolve against live upstreams — so a new client version, or an upstream
  # that stops serving one, breaks a green tree with no commit to blame. Same
  # reasoning as the daily dependency audits, and the same slot.
  #
  # This runs the whole workflow, not just those jobs: the cheap ones cost
  # little beside them, and a nightly full-suite signal is worth more than a
  # nightly run reporting one job.
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  # Same exclusion list as Taskfile.yml (coverage/coverage-check) and sonar.yaml.
  COVERAGE_EXCLUDE: >-
    server/src/(main|server_factory|setup|stores|watcher)\.rs|crates/web/src/handlers/auth/oidc(\.rs|/)|crates/web/src/handlers/back_office/health/system\.rs|crates/adapters/src/db/|crates/adapters/src/registry/(cargo|npm)\.rs|crates/adapters/src/registry/github/|crates/adapters/src/notification/postgres\.rs|crates/adapters/src/sbom/fetcher\.rs|crates/adapters/src/cache/(postgres|banner_redis)\.rs|crates/adapters/src/local_registry/postgres\.rs|crates/adapters/src/rate_limit/(postgres|ip_block_postgres)\.rs|crates/adapters/src/storage/router/|cli/src/tui/|cli/src/(api|cli)/owner\.rs
jobs:
  # Dependabot opens a pull request per bump, daily, across four ecosystems
  # (`.github/dependabot.yaml`) — and every one of them used to buy the whole
  # workflow below, the heavy clients included: a `Cargo.lock` bump paying for a
  # real `ansible-galaxy`, a real `dotnet restore` and a headless VS Code to
  # prove it had not broken them. It almost never has, and when it might, the
  # answer is to *ask* for the run rather than to buy it forty times a week.
  #
  # So this job is the one gate the rest of the workflow hangs off: on a
  # `dependabot/*` head branch every job below is skipped unless the pull
  # request carries the **`full-test`** label. Nothing else changes — a human
  # branch, a push to `main`, the nightly schedule and `workflow_dispatch` all
  # run the full suite as before, because `github.head_ref` is empty outside a
  # pull request and the dependabot test is then false.
  #
  # It also swallows the cost of the `labeled` trigger that makes the label
  # usable: any label on any pull request now starts this workflow, so a label
  # that is not `full-test` (`soak`, `breaking-point`, a triage label) stops
  # here rather than re-running a suite that already ran on the push.
  #
  # Every job in this file must declare `needs: gate` and the `if` below —
  # a job that forgets it is a job dependabot still pays for.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          HEAD_REF: ${{ github.head_ref }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          FULL_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'full-test') }}
        run: |
          run=true
          why=""
          if [[ "$ACTION" == "labeled" && "$LABEL" != "full-test" ]]; then
            run=false
            why="the \`$LABEL\` label is not \`full-test\` — the suite already ran on the push"
          elif [[ "$HEAD_REF" == dependabot/* && "$FULL_TEST" != "true" ]]; then
            run=false
            why="\`$HEAD_REF\` is a dependabot branch and the pull request is not labelled \`full-test\`"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [[ "$run" == "false" ]]; then
            {
              echo "### Test suite skipped"
              echo
              echo "Skipped because $why."
              echo
              echo "Add the **\`full-test\`** label to the pull request to run it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          components: clippy, rustfmt
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      # CI fails on any warning — clippy is denied, formatting must be clean.
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: rustfmt
        run: cargo fmt --all --check
      # Which registries hide blocked versions from their listings is generated
      # from `RegistryKind::listing_filter()` — an exhaustive match a new
      # registry kind cannot be added without answering. Before RFC 0006 the
      # same fact was a hand-written warning box in the admin guide naming npm
      # as the only filtered ecosystem, which nothing kept true.
      #
      # It lives in this job rather than with the other docs drift checks in
      # front-design.yaml because the source of truth is Rust: that workflow has
      # no cargo and does not run on `crates/**`.
      - name: Listing-filter coverage table in sync
        run: |
          table=$(cargo run -q -p batlehub-server --bin listing_coverage)
          page=docs/guide/admin-policies.md
          awk -v table="$table" '
            /^<!-- BEGIN listing-coverage/ { print; print table; skip = 1; next }
            /^<!-- END listing-coverage/   { skip = 0 }
            !skip                          { print }
          ' "$page" > "$page.tmp"
          mv "$page.tmp" "$page"
          if ! git diff --quiet -- "$page"; then
            echo "::error::the listing-coverage table is stale — run 'task docs:listing-coverage' and commit"
            git --no-pager diff -- "$page"
            exit 1
          fi

  fuzz:
    # `fuzz/**` has been in this workflow's path filters since the targets
    # landed, but only as a *trigger*: nothing built them. They live in their own
    # workspace, so `cargo check --workspace` never sees them and neither does
    # clippy — four of the six had been failing to compile against types that
    # moved underneath them, and the first thing to notice was somebody running
    # `task fuzz` by hand. A target that does not build is not a weaker guard
    # than one that does; it is no guard, while still reading like one in the
    # module docs that name it.
    #
    # Two tiers, matching what this workflow already does with the heavy client
    # jobs: every PR pays for the compile, which is what catches drift; the
    # nightly run pays for the actual fuzzing, which is what finds bugs.
    name: Fuzz targets
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "nightly"
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target\nfuzz -> target"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      # The cheap half, and the one that would have caught this: a type error in
      # a target is a type error whether or not libFuzzer ever links. `cargo
      # check` rather than `cargo fuzz build` because the sanitiser-instrumented
      # release build costs minutes and catches nothing extra for this class.
      - name: Every fuzz target still compiles
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --all-targets

      # The expensive half. Nightly and manual only — a per-PR fuzz run is a
      # flaky gate that fails on whichever job got the slow runner, and the
      # targets assert invariants that a 60-second budget explores shallowly
      # anyway. `-max_total_time` bounds each; `-runs` is deliberately not set,
      # so a fast target gets the executions rather than the clock.
      #
      # `detect_leaks=0`: LeakSanitizer cannot start under this runner's
      # `ptrace_scope` and reports the refusal as a 0-byte crash artefact, which
      # is a false positive that looks exactly like a finding.
      #
      # `--target` is passed explicitly because cargo-fuzz's default is not the
      # host but the triple *cargo-fuzz itself* was compiled for
      # (`current_platform::CURRENT_PLATFORM`, cargo-fuzz 0.13 `utils.rs`), and
      # the prebuilt binary install-action ships is a static musl build. Left to
      # that default, every target is built for `x86_64-unknown-linux-musl`,
      # which has no `rust-src` here and cannot carry AddressSanitizer at all
      # ("sanitizer is incompatible with statically linked libc"). Read from the
      # nightly toolchain rather than hard-coded, so a runner on another
      # architecture gets its own triple.
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          tool: cargo-fuzz
      - name: Fuzz each target
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          # Enumerated from the manifest rather than hard-coded, so a new target
          # is fuzzed by existing here rather than by somebody remembering to
          # add it to a list in a second place.
          targets=$(cargo fuzz list)
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          echo "targets: $targets"
          echo "target triple: $host"
          for t in $targets; do
            echo "::group::$t"
            cargo +nightly fuzz run --target "$host" "$t" -- -max_total_time=60
            echo "::endgroup::"
          done
      # The input that broke it is the whole value of a fuzz failure, and it is
      # written to a file the job would otherwise throw away.
      - name: Upload crash artefacts
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  unit:
    name: Unit tests (+ coverage)
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Unit tests with coverage (libs + bins)
        run: >-
          cargo llvm-cov --workspace --lib --bins
          --lcov --output-path coverage-unit.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      # llvm-cov cannot instrument doctests on stable — run them uninstrumented.
      - name: Doc tests
        run: cargo test --workspace --doc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage-unit.lcov
          if-no-files-found: error

  integration:
    name: Integration tests (+ coverage)
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ROOT_USER: rustfsadmin
          RUSTFS_ROOT_PASSWORD: rustfsadmin
        ports:
          - 9000:9000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      S3_TEST_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      # Integration tests only (tests/ directories); unit tests are covered by
      # the `unit` job.
      - name: web integration tests
        run: cargo llvm-cov --no-report -p batlehub-web --test '*'
      - name: CLI integration tests (subprocess binary)
        run: cargo llvm-cov --no-report -p batlehub-cli --test integration
      - name: examples integration tests
        run: cargo llvm-cov --no-report -p batlehub-examples --test '*'
      - name: adapters integration tests (Postgres + default features)
        run: cargo llvm-cov --no-report -p batlehub-adapters --test '*'
      - name: adapters S3 integration tests
        run: >-
          cargo llvm-cov --no-report -p batlehub-adapters --features storage-s3 --test s3_storage
      - name: adapters Redis integration tests
        run: |
          cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_cache
          cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_rate_limit
          cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_warm_coordinator
      - name: Generate integration LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-integration.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: coverage-integration.lcov
          if-no-files-found: error

  heavy-marketplace:
    name: Heavy integration (marketplaces)
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      # Pinned IDE builds — the cache key below must move with these.
      VSCODE_VERSION: "1.136.2"
      IDEA_VERSION: "2026.1.3"
      WEEBO_VERSION: "0.5.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      # No xvfb and no GTK: the VS Code half runs the server build
      # (`server-linux-x64-web`) under the node it bundles, and IntelliJ's
      # `installPlugins` is a JVM command. The desktop build needed both up to
      # 1.96.4; see the VS Code section of tests/heavy/marketplace.sh.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Cache IDE downloads (VS Code + IntelliJ IDEA)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-ides-vscode${{ env.VSCODE_VERSION }}-idea${{ env.IDEA_VERSION }}
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      # Publishes weebo-bridge-notify to local-mode vscode-marketplace and
      # jetbrains-marketplace registries, then installs it with real IDE tooling
      # (headless `code-server --install-extension`, IntelliJ `installPlugins`). The
      # server runs under cargo-llvm-cov, so its execution is part of coverage.
      - name: Marketplace heavy tests
        run: bash tests/heavy/marketplace.sh
        env:
          COVERAGE: "1"
      - name: Generate heavy LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-heavy.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-heavy
          path: coverage-heavy.lcov
          if-no-files-found: error

  # The batlehub-vsx extension (RFC 0011 §6.5, phases 7–8) in a real editor,
  # against this checkout. The extension and its suite live in their own
  # repository (§11 q6); tests/heavy/vsx_extension.sh runs that suite with
  # BATLEHUB_SRC pointed here. Its default branch rather than a pin: this
  # job is the canary that says when the server's VSX API, the CLI's contract
  # file or the gallery proxy and their consumer have drifted apart — a pin
  # would only say it later.
  heavy-vsx-extension:
    name: Heavy integration (batlehub-vsx extension, real editor)
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      BATLEHUB_VSX_REF: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: batlehub/batlehub-vsx
          ref: ${{ env.BATLEHUB_VSX_REF }}
          path: batlehub-vsx
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Cache the editor download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-vsx-extension-${{ hashFiles('tests/heavy/vsx_extension.sh') }}
      # The workbench runs in the runner's Chrome, driven over CDP by the
      # extension repository's driver; the same browser the rendered gates use.
      - name: Start a headless browser
        uses: ./.github/actions/headless-chrome
      - name: Extension heavy suite
        run: bash tests/heavy/vsx_extension.sh
        env:
          BATLEHUB_VSX_SRC: ${{ github.workspace }}/batlehub-vsx
          CDP_URL: http://127.0.0.1:9222
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: vsx-extension-run
          path: batlehub-vsx/tests/heavy/work/last
          if-no-files-found: ignore

  # The production backends under real clients (tests/heavy/backends.sh):
  # S3 for the artifacts, Redis for the cache, dex as the OIDC issuer. Its
  # own job because it is the one suite that needs three services: the
  # RustFS and Redis containers the integration job already uses, plus dex
  # — run as a container from a config rendered off dev/dex/config.tmpl.yaml,
  # the same template the workspace sidecar runs, with a loopback issuer.
  # RustFS is mapped to 9100 because dex takes 9000, the port every
  # rendered config names.
  heavy-backends:
    name: Heavy integration (S3 + Redis + OIDC backends)
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ROOT_USER: rustfsadmin
          RUSTFS_ROOT_PASSWORD: rustfsadmin
        ports:
          - 9100:9000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      S3_TEST_ENDPOINT: http://localhost:9100
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      REDIS_URL: redis://localhost:6379
      OIDC_ISSUER: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Start dex
        run: |
          # The workspace's template, rendered the way `task dex:config
          # LOCAL=1` renders it — a loopback issuer, which the server's
          # `is_secure_issuer_url` lets through as plain HTTP — and the dev
          # password hashed here rather than committed, for the same reason
          # the task hashes it: a bcrypt literal in a tracked file is a
          # secret-scanner finding it cannot tell from a live credential.
          # `--only-binary :all:` refuses a source distribution, and with it the
          # `setup.py` a sdist runs at install time — an arbitrary script from the
          # index, executed on the runner before anything here gets a say. bcrypt
          # publishes manylinux wheels, so nothing is given up by insisting on one;
          # if the wheel is ever missing this fails loudly rather than quietly
          # building from source.
          python3 -m pip install --quiet --user --only-binary :all: bcrypt==5.0.0
          python3 - <<'PY'
          import bcrypt, pathlib
          t = pathlib.Path("dev/dex/config.tmpl.yaml").read_text()
          t = t.replace("__ISSUER__", "http://127.0.0.1:9000")
          t = t.replace("__CALLBACK__", "http://127.0.0.1:8140/api/v1/auth/oidc/callback")
          t = t.replace("__PASSWORD_HASH__", bcrypt.hashpw(b"password", bcrypt.gensalt(10, prefix=b"2b")).decode())
          pathlib.Path("/tmp/dex-config.yaml").write_text(t)
          PY
          docker run -d --name dex --network host -v /tmp/dex-config.yaml:/etc/dex/config.yaml \
            ghcr.io/dexidp/dex:v2.45.0 dex serve /etc/dex/config.yaml
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/.well-known/openid-configuration >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/.well-known/openid-configuration >/dev/null \
            || { docker logs dex; echo "::error::dex never served its discovery document"; exit 1; }
      # The S3 server this job runs is RustFS (the service above); the client is
      # still MinIO's `mc`, and deliberately: RustFS *does* ship a CLI
      # (`rustfs/cli`, the `rc` binary `mise.toml` installs), but `rc` has no
      # `--config-dir` — its alias file is fixed at `~/.config/rc/config.toml`,
      # so a suite run would write throwaway credentials into the caller's own
      # config and two runs would fight over it. Verified against rc 0.1.35,
      # whose only global options are --format, --json, --no-color and
      # --no-progress. The four things the suite asks of the client — alias, mb,
      # ls, cat — are plain S3 calls, verified against RustFS.
      # `tests/heavy/backends.sh` carries the same note beside the same choice.
      #
      # From the project's own GitHub release, pinned. `dl.min.io/client/mc/release/…`
      # answers **410 Gone** — MinIO withdrew the community download host, and
      # every path under it, so the unpinned URL that used to work now fails the
      # job before the suite starts. A pinned asset is also one less thing that
      # moves under a heavy suite.
      - name: Install the MinIO client
        env:
          MC_RELEASE: RELEASE.2025-08-13T08-35-41Z
        run: |
          curl -fsSL --proto '=https' -o /usr/local/bin/mc \
            "https://github.com/minio/mc/releases/download/$MC_RELEASE/mc.linux-amd64.$MC_RELEASE"
          chmod +x /usr/local/bin/mc
          mc --version | head -1
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: Backends heavy suite
        run: bash tests/heavy/backends.sh
        env:
          COVERAGE: "1"
      - name: Generate LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-heavy-backends.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-heavy-backends
          path: coverage-heavy-backends.lcov
          if-no-files-found: error

  # The three suites that drive a real browser (tests/heavy/vsx_login.sh,
  # vsx_view.sh, console_fetch.sh) — the Extensions view, the sign-in entry
  # and the console's Fetch button. They ran only on a developer's machine
  # until 2026-09-11; the runner's Chrome over CDP, the same one the rendered
  # gates use, is all they need. Sequential: each binds its own ports but
  # they share one Postgres and one Chrome. vsx_view.sh reaches
  # marketplace.visualstudio.com once and vscode-cdn.net for the webview.
  heavy-browser:
    name: "Heavy integration (real browser: VS Code views, console Fetch)"
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # puppeteer-core for the two drivers, and the console's own build for
      # console_fetch.sh (which builds it itself, from these modules).
      - name: Install the console's dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Cache the editor download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-browser-${{ hashFiles('tests/heavy/vsx_login.sh', 'tests/heavy/vsx_view.sh', 'tests/heavy/console_fetch.sh') }}
      - name: Start a headless browser
        uses: ./.github/actions/headless-chrome
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: vsx_login heavy suite
        run: bash tests/heavy/vsx_login.sh
        env:
          COVERAGE: "1"
      - name: vsx_view heavy suite
        run: bash tests/heavy/vsx_view.sh
        env:
          COVERAGE: "1"
          CDP_URL: http://127.0.0.1:9222
      - name: console_fetch heavy suite
        run: bash tests/heavy/console_fetch.sh
        env:
          COVERAGE: "1"
          CDP_URL: http://127.0.0.1:9222
      - name: Generate LCOV
        if: ${{ !cancelled() }}
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-heavy-browser.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-heavy-browser
          path: coverage-heavy-browser.lcov
          if-no-files-found: ignore
      # vsx_view.sh keeps its screenshots, transcripts and the editor's log
      # under ~/.cache/batlehub-heavy/vsx_view-last when a step past the
      # editor start fails.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: heavy-browser-evidence
          path: ~/.cache/batlehub-heavy/vsx_view-last
          if-no-files-found: ignore

  heavy-bundler:
    name: Heavy integration (Bundler)
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      # The Bundler generation under test. 4.x is the one whose compact-index
      # updater sends `Range` with an opaque `If-None-Match` and refuses to
      # append a partial response carrying no `Repr-Digest` (RFC 0009 §13.24) —
      # the behaviour the assertions are written against.
      BUNDLER_VERSION: "4.0.17"
      # Install into the workspace so `gem install` needs no sudo, and put its
      # binstubs first so `bundle _4.0.17_` resolves to what we just installed
      # rather than the runner image's default bundler.
      GEM_HOME: ${{ github.workspace }}/.gem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Put the workspace gem bindir on PATH
        run: echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      # Publishes two gems (the second depending on the first) to a local-mode
      # rubygems registry, then drives a real `bundle install` through a logging
      # tap. Asserts the gems resolve at all (§12.15), that the incremental
      # fetch gets a `206` Bundler *accepts* — no full re-fetch after it — and
      # that an unchanged document answers `304` (§13.24). The server runs under
      # cargo-llvm-cov, so its execution is part of coverage.
      - name: Bundler heavy tests
        run: bash tests/heavy/bundler.sh
        env:
          COVERAGE: "1"
      - name: Generate heavy Bundler LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-heavy-bundler.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-heavy-bundler
          path: coverage-heavy-bundler.lcov
          if-no-files-found: error

  # One job per ecosystem, run in parallel: each drives that ecosystem's real
  # client against a real server behind a logging tap and asserts on the wire
  # (tests/heavy/*.sh). They are a matrix rather than seven copies because only
  # the toolchain differs — the Postgres service, the coverage instrumentation
  # and the artifact are the same job.
  #
  # RubyGems and the marketplaces are *not* in here: they were scripted first,
  # have their own pinned clients (Bundler 4.0.17; VS Code + IntelliJ builds
  # with a download cache), and folding them in would mean carrying two more
  # conditional setup blocks for no shared structure.
  heavy-client:
    name: Heavy integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      # One ecosystem failing says nothing about the others, and the whole point
      # is to learn which clients are unhappy.
      fail-fast: false
      matrix:
        include:
          - suite: npm
          - suite: pypi
          - suite: openvsx
          - suite: conda
          - suite: nuget
          - suite: composer
          - suite: terraform
          # apk: the script downloads apk-tools-static for both generations
          # (2.14.10 from v3.22, 3.0.8 from v3.24) and the alpine-keys package
          # from the CDN, and needs only curl, tar and python3 — all on the
          # runner image. No rootfs and no user namespace, which is why neither
          # generation is skipped here (RFC 0026 §6.8).
          - suite: apk
          # nvm: the script downloads nvm's release tarball itself (RFC 0010
          # decision 9 — not the installer) and needs only curl, tar and xz,
          # all on the runner image.
          - suite: nvm
          # sdkman: the script downloads the sdkman-cli release zip itself (RFC
          # 0010 decision 9 — not the installer) and needs curl, zip, unzip and
          # tar, all on the runner image. Installs one JDK (~200 MB) from the
          # vendor CDN the broker names.
          - suite: sdkman
          # mise: installed by the job below. The run spends about eighteen
          # GitHub API requests — RFC 0019 phase 1's ref headers, plus RFC 0008
          # §4's air gap, which seeds a second instance and installs through it
          # with egress denied. They are drawn on the workflow token
          # (HEAVY_FORGE_TOKEN below); with no token, as on a developer's
          # machine, a 502 on `releases/assets/{id}` is the anonymous budget,
          # not a bug.
          - suite: mise
          # RFC 0018 phase 0a — the rejection survey. cargo, go, mvn and java
          # are on the runner image; the path-proxy suite drives apt (on the
          # image) and dnf (installed by the job below).
          - suite: cargo
          # rustup: the closed world of RFC 0024 §6.10 — the compiler, the
          # crates, the build and the run all through one instance, with
          # egress denied to every client process. rustup itself is on the
          # runner image (the toolchain step above uses it) and the suite
          # redirects RUSTUP_HOME and CARGO_HOME into its own temp directory,
          # so the job's cached toolchain is untouched. It installs two
          # minimal toolchains (~120 MB each) from static.rust-lang.org.
          - suite: rustup
          - suite: go
          - suite: maven
          - suite: pathproxy
          # vscode_patch / che_code_patch: the che-code credential patch
          # (patches/che-code) loaded into a built editor's own node and
          # driven through its CLI — the stock VS Code server build (a cached
          # ~200 MB download) and the che-code build, copied out of
          # quay.io/che-incubator/che-code with the runner's docker.
          - suite: vscode_patch
          - suite: che_code_patch
          # hybrid: npm and pip on a `mode = "hybrid"` registry over a served
          # directory; both clients are on the runner image.
          - suite: hybrid
          # RFC 0018 from the client side: npm against a `[registries.security]`
          # registry backed by npmjs.org and the real OSV, the worker embedded.
          # Needs Node (installed below) and bubblewrap for the egress row —
          # a scanner under the worker's sandbox trying to reach the tap.
          - suite: quarantine
          # RFC 0014 from the receiving end: npm against a directory the
          # suite serves as a registry, a staged disappearance, and the
          # notification asserted at a webhook receiver the suite runs.
          # Needs Node (installed below) and nothing off the runner.
          - suite: upstream_audit
          # RFC 0008-bis phase 0 — the measurement: npm, pip and mise against
          # a second `[air_gap]` instance holding one version of each, with
          # egress denied. Needs Node and mise (installed below), python3
          # with venv (on the image), and about three GitHub API requests for
          # the seed — on the workflow token (HEAVY_FORGE_TOKEN below),
          # because the seed *fails* on a spent anonymous budget rather than
          # tolerating it.
          # galaxy: ansible-core in a run-local virtualenv built with uv
          # (installed below), driving the real collections API v3 and the v1
          # role surface through the proxy. It downloads one collection
          # (~1 MB), publishes one it builds itself, and installs one role
          # from github.com — the egress `roles = "proxy"` implies.
          - suite: galaxy
          # nix: the real Nix client substituting from cache.nixos.org through
          # the proxy, and publishing back to it. The client runs in its own
          # `nixos/nix` image — a `nix` binary is dynamically linked into
          # `/nix/store` and cannot execute without one, and no static build is
          # published — so the suite needs a container engine and nothing else,
          # exactly as `closed_world.sh`'s dnf and pacman phases do. Nothing is
          # installed on the runner.
          - suite: nix
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      # Pinned clients, for the same reason `heavy-bundler` pins Bundler: what
      # these assert is one client generation's behaviour, and an unannounced
      # upgrade turning a suite red should name itself here rather than look
      # like a regression in this repository.
      #
      # Only the three the *job* installs are pinned here. The rest — micromamba,
      # ovsx, vsce — are downloaded by the scripts and pinned there, and are
      # deliberately not repeated: the version would then live in two places, and
      # the copy in this file is the one the cache key below cannot see.
      NODE_VERSION: "24"
      DOTNET_CHANNEL: "10.0"
      TERRAFORM_VERSION: "1.16.2"
      MISE_VERSION: "2026.9.5"
      ANSIBLE_CORE_VERSION: "2.19.3"
      UV_VERSION: "0.9.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      # ── Per-ecosystem client setup ──────────────────────────────────────────
      - name: Set up Node (npm / Open VSX / quarantine / upstream_audit / airgap)
        if: matrix.suite == 'npm' || matrix.suite == 'openvsx' || matrix.suite == 'quarantine' || matrix.suite == 'upstream_audit' || matrix.suite == 'airgap' || matrix.suite == 'hybrid'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the .NET SDK
        if: matrix.suite == 'nuget'
        run: |
          # Microsoft's own install script rather than a third-party action:
          # one URL, one channel, and no action SHA to keep pinned.
          curl -fsSL --proto '=https' --proto-redir '=https' \
            https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel "$DOTNET_CHANNEL" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Install Terraform
        if: matrix.suite == 'terraform'
        run: |
          # From the release archive rather than a third-party action: one URL,
          # one version, and nothing else enters the runner.
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          sudo unzip -o -q /tmp/terraform.zip -d /usr/local/bin
          terraform version
      - name: Install mise
        if: matrix.suite == 'mise' || matrix.suite == 'airgap'
        run: |
          # From the release archive rather than the `curl | sh` installer:
          # one URL, one version, and nothing else enters the runner.
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/mise.tar.gz \
            "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/mise.tar.gz -C /tmp
          sudo install -m 0755 /tmp/mise/bin/mise /usr/local/bin/mise
          mise --version
      - name: Install uv
        if: matrix.suite == 'galaxy'
        run: |
          # From the release archive rather than the `curl | sh` installer:
          # one URL, one version, and nothing else enters the runner. The
          # suite builds its own virtualenv with it and pins ansible-core
          # there, so the runner's system Python is untouched.
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          uv --version
      - name: Install dnf
        if: matrix.suite == 'pathproxy'
        run: |
          # Ubuntu packages dnf; the suite refuses to run without it rather
          # than skip the rpm rows (HEAVY_PATHPROXY_SKIP_DNF=1 is the explicit
          # opt-out, for a developer's machine without root).
          #
          # `dnf download` is a *plugin* subcommand, not a built-in: the `dnf`
          # package alone answers "No such command: download", which the suite
          # meets four steps in, after it has already built and started a
          # server. `dnf-plugins-core` is what ships `dnf-plugins/download.py`
          # on Ubuntu — noble/universe, the same component `dnf` itself comes
          # from. Not `python3-dnf-plugins-core` (a Debian name Ubuntu does not
          # carry) and not `dnf5-plugins` (the dnf5 line, which noble predates).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dnf dnf-plugins-core
          dnf --version | head -1
          # The probe, not the install, is the gate: a plugin that installed
          # but did not register is the same failure as one that never landed,
          # and both are cheaper to read here than four steps into the suite.
          dnf download --help >/dev/null 2>&1 \
            || { echo "::error::dnf has no 'download' subcommand — dnf-plugins-core did not register it"; exit 1; }
      - name: Install bubblewrap
        if: matrix.suite == 'quarantine'
        run: |
          # The worker's scanner sandbox (RFC 0018 §6.3). The suite refuses to
          # run without it rather than skip the egress row
          # (HEAVY_QUARANTINE_SKIP_SANDBOX=1 is the explicit opt-out, for a
          # developer's machine without user namespaces).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
          # Ubuntu 24.04 ships an AppArmor profile that denies unprivileged
          # user namespaces, so `bwrap --version` succeeds and every actual
          # sandbox exits before it writes a byte. The worker reads that as
          # "scanner output is not JSON: EOF", holds the version SCAN_PENDING,
          # and the suite only finds out five minutes later when `batlehub
          # wait` times out. Lift the restriction, then prove a namespace can
          # really be created before the suite starts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind / / --dev /dev /bin/true \
            || { echo "::error::bwrap cannot create a user namespace on this runner"; exit 1; }
      - name: Check PHP and Composer
        if: matrix.suite == 'composer'
        run: |
          # Both ship on the runner image. The script falls back to a static PHP
          # build when they do not, so this step only reports which it will use.
          php --version || echo "no php on PATH — the suite will download a static build"
          composer --version || echo "no composer on PATH — the suite will download composer.phar"
      - name: Cache heavy client downloads
        # conda downloads micromamba; Composer may download a static PHP and
        # composer.phar; nvm downloads its own release tarball. The versions
        # are pinned *in the scripts*, so hashing
        # them is the key that cannot go stale — an env var repeated here would
        # have to be kept in step with the default it shadows.
        #
        # `~` is expanded by the action; it is deliberately not passed to the
        # scripts as `HEAVY_CACHE`, where bash would take it literally and put
        # the downloads in a directory named `~`.
        if: matrix.suite == 'conda' || matrix.suite == 'composer' || matrix.suite == 'nvm' || matrix.suite == 'sdkman' || matrix.suite == 'vscode_patch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-clients-${{ matrix.suite }}-${{ hashFiles(format('tests/heavy/{0}.sh', matrix.suite)) }}

      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: Run the ${{ matrix.suite }} heavy suite
        run: bash tests/heavy/${{ matrix.suite }}.sh
        env:
          COVERAGE: "1"
          # The forge suites (mise, airgap) drive a `github` registry. Read by
          # `heavy_forge_auth_config` (tests/heavy/lib.sh), which authenticates
          # that registry's upstream with it: anonymous GitHub is 60 API
          # requests an hour *per source IP*, and a hosted runner's IP is shared
          # with every other job on the machine, so the budget is regularly
          # already spent and the proxy refuses below its 10 % reserve. The
          # workflow token is 1 000 an hour per repository, is issued on forks
          # too, and needs no more than the `contents: read` this workflow
          # already declares. Every other suite ignores it.
          HEAVY_FORGE_TOKEN: ${{ github.token }}
      - name: Generate LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-heavy-${{ matrix.suite }}.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-heavy-${{ matrix.suite }}
          path: coverage-heavy-${{ matrix.suite }}.lcov
          if-no-files-found: error

  # The authorization suite (tests/heavy/authz.sh), one job per target.
  #
  # A job of its own rather than more rows in `heavy-client`, because the shape
  # is different in two ways that would make that matrix lie: every row runs the
  # *same* script with a target argument, and one row — `matrix` — needs no
  # client toolchain at all. It is also the row that matters most and the
  # cheapest to run, so it must not be gated behind seven toolchain installs.
  #
  # What the rows other than `matrix` add is the half no `curl` can check: that
  # a package manager handed a `403` stops, rather than reporting success over a
  # partial install. See the script header for why that is a separate claim.
  heavy-authz:
    name: Heavy authorization (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      # One client being unhappy says nothing about the others, and which ones
      # are is the thing being learned.
      fail-fast: false
      matrix:
        include:
          - target: matrix
          - target: signing
          # The read boundary on the eight kinds no client phase drives. No
          # client and no upstream: every registry it touches is local and
          # empty, which is exactly what makes the boundary observable.
          - target: reads
          - target: npm
          - target: pypi
          - target: openvsx
          - target: conda
          - target: nuget
          - target: composer
          - target: rubygems
          - target: terraform
          # Hermetic like the rest: both have a local mode, so the run
          # publishes its own fixture and reads it back — no upstream, no
          # network. `cargo` is also the regression test for `auth-required`
          # in the sparse index's config.json, without which cargo sends no
          # credential on a read at all.
          - target: maven
          - target: cargo
          # The one client that carries a credential on a *read*:
          # `ansible-galaxy` sends `Authorization: Bearer` on every call once a
          # token is configured, so all three arms — anonymous, a caller
          # holding no read verb, and the reader — are attributable to the
          # identity the client presented. Hermetic: the run publishes its own
          # collection and installs it back.
          - target: galaxy
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      # Same pins, and the same reason, as `heavy-client`: what these assert is
      # one client generation's behaviour. Kept in step with that job by being
      # spelled the same way rather than shared, because a matrix cannot inherit
      # another matrix's env.
      NODE_VERSION: "24"
      DOTNET_CHANNEL: "10.0"
      TERRAFORM_VERSION: "1.16.2"
      ANSIBLE_CORE_VERSION: "2.19.3"
      UV_VERSION: "0.9.7"
      BUNDLER_VERSION: "4.0.17"
      GEM_HOME: ${{ github.workspace }}/.gem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Set up Node (npm / Open VSX)
        if: matrix.target == 'npm' || matrix.target == 'openvsx'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the .NET SDK
        if: matrix.target == 'nuget'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' \
            https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel "$DOTNET_CHANNEL" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Install Terraform
        if: matrix.target == 'terraform'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          sudo unzip -o -q /tmp/terraform.zip -d /usr/local/bin
          terraform version
      - name: Install uv
        if: matrix.target == 'galaxy'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          uv --version
      - name: Put the workspace gem bindir on PATH
        if: matrix.target == 'rubygems'
        run: echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
      - name: Cache heavy client downloads
        # maven caches the warmed plugin repository, which is not a client
        # download but has the same reason to be kept: Central rate-limits by
        # source IP, a hosted runner's IP is shared, and a `429` on Maven's own
        # plugins fails the run before the boundary under test is reached.
        #
        # `restore-keys` because the key hashes the whole script: every edit to
        # authz.sh would otherwise throw away downloads that are still good. A
        # stale restore is safe by construction — each cached tree is named
        # after the versions it holds (`mvn-warm-3.7.0-3.1.4`,
        # `composer-2.8.12.phar`), so a bump misses the lookup and fetches
        # afresh rather than reusing the wrong bytes.
        if: matrix.target == 'conda' || matrix.target == 'composer' || matrix.target == 'maven'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-authz-${{ matrix.target }}-${{ hashFiles('tests/heavy/authz.sh') }}
          restore-keys: heavy-authz-${{ matrix.target }}-

      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: Run the authorization suite (${{ matrix.target }})
        run: bash tests/heavy/authz.sh ${{ matrix.target }}
        env:
          COVERAGE: "1"
      - name: Generate LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-authz-${{ matrix.target }}.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-authz-${{ matrix.target }}
          path: coverage-authz-${{ matrix.target }}.lcov
          if-no-files-found: error

  # The authorization suite's **live** targets (`authz.sh live:<kind>`).
  #
  # A job of its own, and nightly rather than per-PR, because these are the one
  # family in that suite that reaches the public internet. Nine registry kinds
  # have no local mode — a forge, a Node distribution, a JDK broker, a file tree
  # and two OS archives have nothing to publish *into* — so proving that a real
  # client is refused without a credential and works with one needs a real
  # upstream for the positive arm. The `reads` target in `heavy-authz` measures
  # the same boundary at route level, hermetically, on every PR; this measures
  # it where only a client can.
  heavy-authz-live:
    name: Heavy authorization, live (${{ matrix.kind }})
    runs-on: ubuntu-latest
    needs: gate
    # Nightly and on demand, like the rest of the network-dependent heavy work.
    if: needs.gate.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: goproxy
          - kind: nodedist
          - kind: sdkman
          - kind: github
          - kind: forgejo
          - kind: gitlab
          - kind: generic
          - kind: deb
          - kind: rpm
          - kind: pacman
          - kind: rustup
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      MISE_VERSION: "2026.9.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      # mise is the client for all three forge kinds — one binary, three
      # backends — and it is the client whose `netrc` setting the phases rely on.
      - name: Install mise
        if: matrix.kind == 'github' || matrix.kind == 'forgejo' || matrix.kind == 'gitlab'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/mise.tar.gz \
            "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/mise.tar.gz -C /tmp
          sudo install -m 0755 /tmp/mise/bin/mise /usr/local/bin/mise
          mise --version
      # The rpm client runs in AlmaLinux 9, for the reason `closed_world.sh`
      # spells out: an EPEL build is linked against that userland. All the
      # runner provides is an engine.
      - name: Report the container engine
        if: matrix.kind == 'rpm' || matrix.kind == 'pacman'
        run: |
          podman info >/dev/null 2>&1 && podman --version && exit 0
          docker info >/dev/null 2>&1 && docker --version && exit 0
          echo "neither podman nor docker answered 'info' on this runner" >&2
          exit 1
      # `rustup` is installed by the toolchain action above, so the `rustup`
      # row needs no client step of its own.
      - name: Cache heavy client downloads
        if: matrix.kind == 'nodedist' || matrix.kind == 'sdkman'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-authz-live-${{ matrix.kind }}-${{ hashFiles('tests/heavy/authz.sh') }}

      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: Run the live authorization target (${{ matrix.kind }})
        run: bash tests/heavy/authz.sh live:${{ matrix.kind }}
        env:
          COVERAGE: "1"
          # A **GitHub** token, and it authenticates github registries only —
          # `heavy_forge_auth_config` maps one variable per forge kind, so the
          # forgejo and gitlab rows stay anonymous against codeberg.org and
          # gitlab.com rather than being handed a credential for another host.
          # This is the *upstream's* credential; what the phases carry is this
          # instance's, and the two are unrelated.
          HEAVY_FORGE_TOKEN: ${{ github.token }}
      - name: Generate LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-authz-live-${{ matrix.kind }}.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-authz-live-${{ matrix.kind }}
          path: coverage-authz-live-${{ matrix.kind }}.lcov
          if-no-files-found: error

  # The closed-world suite (tests/heavy/closed_world.sh), one job per registry
  # kind.
  #
  # A job of its own rather than more rows in `heavy-client`, for the reason
  # `heavy-authz` is one: every row runs the *same* script with a phase
  # argument. What each row adds is the half no protocol test can check — that
  # a client which can reach nothing but this instance can still resolve, build
  # and run. Rust's closed world is `rustup` in `heavy-client`, and proves more
  # (the toolchain comes from the instance too).
  #
  # The `dnf` and `pacman` rows run their client inside AlmaLinux 9 and Arch
  # images respectively, on the runner's own container engine — a distribution
  # package is linked against its own libraries, so executing what is inside it
  # anywhere else cannot work. That is also why neither row installs a package
  # manager onto the runner any more, and why `pacman` is a row at all: no
  # hosted runner ships it and it cannot be apt-installed.
  heavy-closed-world:
    name: Heavy closed world (${{ matrix.phase }})
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      # One ecosystem failing says nothing about the others, and which ones can
      # survive the closed world is the thing being learned.
      fail-fast: false
      matrix:
        include:
          - phase: go
          - phase: node
          - phase: python
          - phase: java
          - phase: ruby
          - phase: dotnet
          - phase: php
          - phase: conda
          - phase: terraform
          - phase: mise
          # The tool installers and the galleries. `jbplugin` downloads a
          # ~1.5 GB IDE and `vscode` a ~300 MB editor, both cached below.
          - phase: nvm
          - phase: sdkman
          - phase: ovsx
          - phase: helm
          - phase: apt
          - phase: forgejo
          - phase: gitlab
          - phase: jbr
          - phase: vscode
          - phase: jbplugin
          - phase: dnf
          - phase: pacman
          # `ansible` is galaxy's closed world, and the only phase whose client
          # is a Python distribution: ansible-core is pinned into a run-local
          # virtualenv by the step below, *before* egress is denied, so what the
          # phase proves is the collection resolve and the module execution and
          # not pip's ability to reach PyPI.
          - phase: ansible
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
      # The same pins, and the same reason, as the two matrices above: what
      # these assert is one client generation's behaviour. Spelled again rather
      # than shared, because a matrix cannot inherit another matrix's env.
      NODE_VERSION: "24"
      DOTNET_CHANNEL: "10.0"
      TERRAFORM_VERSION: "1.16.2"
      MISE_VERSION: "2026.9.5"
      UV_VERSION: "0.9.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      # Go, Python, Java, Maven, Ruby, Bundler and PHP are on the runner image;
      # the four below are not, and conda's micromamba the suite fetches itself.
      # `ovsx` needs npm for the same reason `node` does: its client is an npm
      # package, and the phase installs it *through the instance's own npm
      # registry* — so what the runner has to provide is npm itself, not ovsx.
      - name: Set up Node
        if: matrix.phase == 'node' || matrix.phase == 'ovsx'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the .NET SDK
        if: matrix.phase == 'dotnet'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' \
            https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel "$DOTNET_CHANNEL" --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Install Terraform
        if: matrix.phase == 'terraform'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          sudo unzip -o -q /tmp/terraform.zip -d /usr/local/bin
          terraform version
      # mise is the client for three kinds: a GitHub release (`mise`), a Codeberg
      # one (`forgejo`) and a GitLab one (`gitlab`). Same binary, three backends.
      - name: Install mise
        if: matrix.phase == 'mise' || matrix.phase == 'forgejo' || matrix.phase == 'gitlab'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/mise.tar.gz \
            "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-x64.tar.gz"
          tar -xzf /tmp/mise.tar.gz -C /tmp
          sudo install -m 0755 /tmp/mise/bin/mise /usr/local/bin/mise
          mise --version
      # The same release archive, version and reasoning as `heavy-client`'s
      # galaxy row: one URL, one version, nothing else enters the runner, and
      # the runner's system Python is untouched because the phase builds its
      # own virtualenv.
      - name: Install uv
        if: matrix.phase == 'ansible'
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          uv --version
      # `dnf` and `pacman` bring their own client, in their own image; all the
      # runner has to provide is an engine. `ubuntu-latest` ships both podman
      # and docker, and the suite takes whichever answers `info` first — so this
      # step reports what it found rather than installing anything, and turns a
      # missing engine into a legible failure here instead of a pull error two
      # steps later.
      - name: Report the container engine
        if: matrix.phase == 'dnf' || matrix.phase == 'pacman'
        run: |
          podman info >/dev/null 2>&1 && podman --version && exit 0
          docker info >/dev/null 2>&1 && docker --version && exit 0
          echo "neither podman nor docker answered 'info' on this runner" >&2
          exit 1
      - name: Cache heavy client downloads
        if: matrix.phase == 'conda' || matrix.phase == 'php' || matrix.phase == 'nvm' || matrix.phase == 'sdkman' || matrix.phase == 'vscode' || matrix.phase == 'jbplugin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batlehub-heavy
          key: heavy-closed-world-${{ matrix.phase }}-${{ hashFiles('tests/heavy/closed_world.sh') }}

      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: Run the closed-world suite (${{ matrix.phase }})
        run: bash tests/heavy/closed_world.sh ${{ matrix.phase }}
        env:
          COVERAGE: "1"
          # Only the mise phase drives a `github` registry; see the note on the
          # same variable in `heavy-client` for why the workflow token is what
          # it should be given.
          #
          # It is a **GitHub** token and it authenticates github registries
          # only — `heavy_forge_auth_config` maps one variable per forge kind
          # for exactly this reason. The `forgejo` and `gitlab` phases run
          # anonymous against codeberg.org and gitlab.com unless
          # HEAVY_FORGEJO_TOKEN / HEAVY_GITLAB_TOKEN are set, which is right:
          # this token would not authenticate there, and sending it would hand
          # a repository credential to a third party.
          HEAVY_FORGE_TOKEN: ${{ github.token }}
      - name: Generate LCOV
        run: >-
          cargo llvm-cov report --lcov --output-path coverage-closed-world-${{ matrix.phase }}.lcov
          --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-closed-world-${{ matrix.phase }}
          path: coverage-closed-world-${{ matrix.phase }}.lcov
          if-no-files-found: error

  coverage-report:
    name: Coverage report (merged)
    runs-on: ubuntu-latest
    needs: [gate, unit, integration, heavy-marketplace, heavy-bundler, heavy-backends, heavy-browser, heavy-client, heavy-authz, heavy-closed-world]
    # Run even when a coverage job fails: merge_coverage.py renders an "absent"
    # row for any missing LCOV, so a partially-green pipeline still reports
    # (download-artifact with a pattern warns, not fails, on zero matches).
    if: ${{ needs.gate.outputs.run == 'true' && !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Merge LCOV files and publish the coverage table
        run: |
          python3 .github/scripts/merge_coverage.py --output coverage-merged.lcov \
            unit=coverage-unit.lcov \
            integration=coverage-integration.lcov \
            heavy=coverage-heavy.lcov \
            heavy-bundler=coverage-heavy-bundler.lcov \
            heavy-npm=coverage-heavy-npm.lcov \
            heavy-pypi=coverage-heavy-pypi.lcov \
            heavy-openvsx=coverage-heavy-openvsx.lcov \
            heavy-conda=coverage-heavy-conda.lcov \
            heavy-nuget=coverage-heavy-nuget.lcov \
            heavy-composer=coverage-heavy-composer.lcov \
            heavy-terraform=coverage-heavy-terraform.lcov \
            heavy-vscode_patch=coverage-heavy-vscode_patch.lcov \
            heavy-che_code_patch=coverage-heavy-che_code_patch.lcov \
            heavy-hybrid=coverage-heavy-hybrid.lcov \
            heavy-backends=coverage-heavy-backends.lcov \
            heavy-browser=coverage-heavy-browser.lcov \
            authz-matrix=coverage-authz-matrix.lcov \
            authz-signing=coverage-authz-signing.lcov \
            authz-npm=coverage-authz-npm.lcov \
            authz-pypi=coverage-authz-pypi.lcov \
            authz-openvsx=coverage-authz-openvsx.lcov \
            authz-conda=coverage-authz-conda.lcov \
            authz-nuget=coverage-authz-nuget.lcov \
            authz-composer=coverage-authz-composer.lcov \
            authz-rubygems=coverage-authz-rubygems.lcov \
            authz-terraform=coverage-authz-terraform.lcov \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-merged
          path: coverage-merged.lcov
          if-no-files-found: error
