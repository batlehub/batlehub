name: Helm chart lint
# The publish workflow (.forgejo/workflows/helm.yaml) only runs on push to main,
# so it cannot gate a pull request. This job renders the chart on every PR that
# touches it and asserts the invariants that are easy to break silently and
# expensive to discover in the cluster.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # RFC 0041 decision 28: no workflow-level `paths:` (a skipped pull request
  # would leave `required` "Expected"); this job applies them instead.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        uses: ./.github/actions/required-gate
        with:
          paths: |
            helm/**
            deploy/helm/**
            config.example*.toml
            docs/public/schema/**
            .tasks/scripts/config_schema_check.sh
            .github/workflows/helm-lint.yaml
            .github/scripts/required_gate.py
            .github/actions/required-gate/action.yml

  lint:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: helm lint + rendered-manifest assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The Trivy server sub-chart (RFC 0018 §6.3) is a declared dependency
      # fetched at build time; `charts/` is not committed. Helm 4 refuses
      # `dependency build` for a repository it has never been told about, so
      # the repo is added first — a no-op for Helm 3, required from Helm 4 on.
      - name: helm dependency build
        run: |
          helm repo add aquasecurity https://aquasecurity.github.io/helm-charts/
          helm repo update
          helm dependency build helm/batlehub
      - name: helm lint
        run: helm lint helm/batlehub

      - name: Render default values
        run: helm template batlehub helm/batlehub > /tmp/rendered.yaml

      # A probe path under /api/v1/admin is answered with 403 for the kubelet
      # (it sends no credentials), so the pod never becomes Ready and liveness
      # restarts it forever. /livez and /healthz are the only auth-exempt routes.
      - name: Probes must not target an authenticated endpoint
        run: |
          if grep -A2 -E 'livenessProbe:|readinessProbe:' /tmp/rendered.yaml \
             | grep -E 'path:\s*/api/'; then
            echo "::error::A probe targets an authenticated endpoint. Use /livez (liveness) or /healthz (readiness)."
            exit 1
          fi

      # Scoped to each probe block on purpose. Two independent global greps both
      # pass when the paths are *swapped* — liveness on /healthz would then
      # restart every replica on a database blip, exactly the failure this guard
      # exists to prevent, while the check stayed green.
      - name: Probes must target /livez and /healthz
        run: |
          grep -A3 -E '^[[:space:]]+livenessProbe:' /tmp/rendered.yaml \
            | grep -qE '^[[:space:]]+path: /livez$' \
            || { echo "::error::liveness probe is not /livez"; exit 1; }
          grep -A3 -E '^[[:space:]]+readinessProbe:' /tmp/rendered.yaml \
            | grep -qE '^[[:space:]]+path: /healthz$' \
            || { echo "::error::readiness probe is not /healthz"; exit 1; }

      # The image has no USER of its own baked in for every base we ship, so the
      # chart is the backstop that keeps the workload off uid 0.
      - name: Pod must be non-root by default
        run: |
          for key in 'runAsNonRoot: true' 'allowPrivilegeEscalation: false' 'readOnlyRootFilesystem: true'; do
            grep -q "$key" /tmp/rendered.yaml || { echo "::error::default values dropped '$key'"; exit 1; }
          done

      # ── The credentials layer (a second --config) ──────────────────────────
      #
      # Rendering it is the only test this feature has at the chart level, and
      # each assertion below is one way it has a silent failure mode: an arg
      # that is not passed leaves the credentials unread while every manifest
      # still looks right, and a checksum annotation would turn a credential
      # rotation into a pod rollout, which is what the hot reload exists to
      # avoid.
      - name: Render with the credentials layer
        run: |
          helm template batlehub helm/batlehub \
            --set credentials.enabled=true \
            --set credentials.config.database.url=postgresql://x \
            --set worker.enabled=true \
            > /tmp/credentials.yaml

      - name: Both Deployments must pass the second --config
        run: |
          count=$(grep -c -- '- /etc/batlehub/credentials/credentials.toml' /tmp/credentials.yaml || true)
          [ "$count" = "2" ] || {
            echo "::error::expected the credentials layer on both the proxy and the worker, found $count"
            exit 1
          }
          # Order decides the merge: the primary has to come first, or the base
          # config would win over the credentials it is supposed to complete.
          grep -A3 -- '- --config' /tmp/credentials.yaml \
            | grep -q -- '- /etc/batlehub/config.toml' \
            || { echo "::error::the primary config is not the first layer"; exit 1; }

      - name: The credentials Secret must not trigger a rollout
        run: |
          if grep -E '^\s+checksum/.*credential' /tmp/credentials.yaml; then
            echo "::error::a checksum annotation on the credentials Secret turns a rotation into a pod rollout"
            exit 1
          fi

      - name: An existing Secret replaces the chart-rendered one
        run: |
          helm template batlehub helm/batlehub \
            --set credentials.enabled=true \
            --set credentials.existingSecret=managed-elsewhere \
            > /tmp/existing.yaml
          grep -q 'secretName: managed-elsewhere' /tmp/existing.yaml \
            || { echo "::error::the named Secret is not mounted"; exit 1; }
          if grep -q 'batlehub-credentials' /tmp/existing.yaml; then
            echo "::error::the chart rendered its own credentials Secret alongside the named one"
            exit 1
          fi

      - name: The layer is absent by default
        run: |
          helm template batlehub helm/batlehub > /tmp/default.yaml
          if grep -q '/etc/batlehub/credentials' /tmp/default.yaml; then
            echo "::error::the credentials layer is mounted with credentials.enabled=false"
            exit 1
          fi

      # writableConfig: the server must mount the claim read-write at the
      # config directory, the chart's config only as the init container's seed,
      # and nothing of it may appear with the option off.
      - name: Render with a writable config
        run: |
          helm template batlehub helm/batlehub \
            --set writableConfig.enabled=true \
            --set worker.enabled=true \
            > /tmp/writable.yaml

      - name: The proxy reads its config from the claim, seeded by the init container
        run: |
          grep -q 'claimName: batlehub-writable-config' /tmp/writable.yaml \
            || { echo "::error::the proxy does not mount the config claim"; exit 1; }
          grep -q 'name: seed-config' /tmp/writable.yaml \
            || { echo "::error::no seed init container"; exit 1; }
          grep -q 'mountPath: /etc/batlehub-seed' /tmp/writable.yaml \
            || { echo "::error::the chart's config is not mounted as the seed"; exit 1; }
          grep -q 'helm.sh/resource-policy: keep' /tmp/writable.yaml \
            || { echo "::error::the config claim would be deleted on uninstall"; exit 1; }
          # One claim reference: the worker keeps the chart's read-only config.
          count=$(grep -c 'claimName: batlehub-writable-config' /tmp/writable.yaml || true)
          [ "$count" = "1" ] || {
            echo "::error::expected the config claim on the proxy only, found $count"
            exit 1
          }

      - name: A bad seed policy fails the render
        run: |
          if helm template batlehub helm/batlehub --set writableConfig.seed=Sometimes >/dev/null 2>&1; then
            echo "::error::writableConfig.seed=Sometimes rendered"
            exit 1
          fi

      - name: The writable config is absent by default
        run: |
          if grep -qE 'seed-config|writable-config|/etc/batlehub-seed' /tmp/default.yaml; then
            echo "::error::writableConfig renders with writableConfig.enabled=false"
            exit 1
          fi

      # Helm reads every number of a values file as a float64, and toToml then
      # writes `access_retention_days = 30.0`, which the server refuses for an
      # integer field and does not start. `--set` hides it (it types the value
      # itself), so this renders from a file. Both config files are read, and
      # `outage_ratio = 0.5` proves a float with a fraction is left alone.
      - name: Integer fields render as integers
        run: |
          helm template batlehub helm/batlehub -f helm/batlehub/ci/values-integers.yaml > /tmp/ints.yaml
          python3 - /tmp/ints.yaml <<'PY'
          import re, sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d and d.get("kind") == "Secret"]
          tomls = {k: v for d in docs for k, v in (d.get("stringData") or {}).items() if k.endswith(".toml")}
          assert set(tomls) >= {"config.toml", "credentials.toml"}, f"rendered: {sorted(tomls)}"
          bad = [f"{k}: {l.strip()}" for k, t in tomls.items() for l in t.splitlines() if re.search(r'=[^"]*(?<![\w.])\d+\.0(?![\w.])', l)]
          assert not bad, "integer fields rendered as floats:\n" + "\n".join(bad)
          for k in ("access_retention_days = 30", "security_retention_days = 365", "outage_ratio = 0.5"):
              assert k in tomls["config.toml"], f"missing {k!r}"
          assert "access_retention_days = 30" in tomls["credentials.toml"]
          print("every integer field renders as an integer")
          PY

      # RFC 0049 phase 2: values.schema.json validates `config` and
      # `credentials.config` against the config's layer schema. A misspelt key
      # must fail the render, and the documented credentials layer (partial
      # by design: no server, no storage) must not.
      - name: A mistyped config key fails the render
        run: |
          printf 'config:\n  audit:\n    acess_retention_days: 3\n' > /tmp/typo.yaml
          if helm template batlehub helm/batlehub -f /tmp/typo.yaml > /dev/null 2> /tmp/typo.err; then
            echo "::error::values.schema.json accepted config.audit.acess_retention_days"
            exit 1
          fi
          grep -q acess_retention_days /tmp/typo.err
      - name: The documented credentials layer passes the schema
        run: |
          cat > /tmp/cred.yaml <<'YAML'
          credentials:
            enabled: true
            config:
              database:
                url: "postgresql://batlehub:${DB_PASSWORD}@postgres:5432/batlehub"
              auth:
                - type: "token"
                  tokens:
                    - value: "a-real-admin-token"
                      role: "admin"
                      user_id: "admin"
          YAML
          helm template batlehub helm/batlehub -f /tmp/cred.yaml > /dev/null

      # RFC 0049: the example configs and every deploy/helm render validate
      # against the committed config JSON Schema, checked by taplo — the
      # engine the editors run. The schema itself is held current by
      # `cargo test` (crates/config/tests/config_schema.rs).
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.9.5
          install: true
          install_args: taplo
          add_shims_to_path: false
          cache: false
      - name: Example configs and chart renders validate against the schema
        run: mise exec taplo -- bash .tasks/scripts/config_schema_check.sh

      # Rendering with a non-default combination catches template errors that
      # the default path never reaches (ingress rules, PDB, extra manifests).
      - name: Render a non-default configuration
        run: |
          helm template batlehub helm/batlehub \
            --set replicaCount=3 \
            --set ingress.enabled=true \
            --set 'ingress.extraHosts[0]=*.batlehub.example.com' \
            --set persistence.enabled=false \
            --set config.storage.type=s3 \
            > /dev/null

  docs:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: chart README matches values.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the commit in mise.toml, not "latest": two builds of
      # helm-docs do not have to agree on the generated table, and a drifting
      # one would fail the gate on a commit that changed nothing. Built from
      # source because the last release (v1.14.2, 2024) carries a Go 1.22
      # toolchain's worth of CVEs; see mise.toml. The runner's Go builds it, and
      # fetches the toolchain the module asks for when its own is older.
      - name: Install helm-docs
        env:
          HELM_DOCS_COMMIT: a5573af096a4b526dcbc3c896c220b1714a0765b
        run: |
          set -euo pipefail
          GOBIN=/tmp/bin go install "github.com/norwoodj/helm-docs/cmd/helm-docs@${HELM_DOCS_COMMIT}"
          sudo install -m 0755 /tmp/bin/helm-docs /usr/local/bin/helm-docs
          go version -m /usr/local/bin/helm-docs | head -2

      # Regenerates and diffs. `helm/batlehub/README.md` is generated from
      # Chart.yaml and the `# --` comments in values.yaml, so a value added
      # without a description, or with a stale one, is caught here rather than
      # read by an operator as the truth about the chart.
      - name: helm-docs drift
        run: |
          set -euo pipefail
          helm-docs --chart-search-root=helm/batlehub --sort-values-order=file
          if ! git diff --exit-code -- helm/batlehub/README.md; then
            echo "::error::helm/batlehub/README.md is out of date. Run 'task helm:docs' and commit the result."
            exit 1
          fi

  # The one check the `main` ruleset requires: every job succeeded, or the
  # gate skipped them all (RFC 0041 decision 28).
  required:
    # Unique across workflows: a ruleset matches a required check by this name.
    name: helm-lint.yaml / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, lint, docs]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I .github/scripts/required_gate.py verdict "$NEEDS"
