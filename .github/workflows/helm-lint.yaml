name: Helm chart lint
# The publish workflow (.forgejo/workflows/helm.yaml) only runs on push to main,
# so it cannot gate a pull request. This job renders the chart on every PR that
# touches it and asserts the invariants that are easy to break silently and
# expensive to discover in the cluster.
on:
  push:
    branches: ["main"]
    paths:
      - "helm/**"
      - ".github/workflows/helm-lint.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "helm/**"
      - ".github/workflows/helm-lint.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: helm lint + rendered-manifest assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The Trivy server sub-chart (RFC 0018 §6.3) is a declared dependency
      # fetched at build time; `charts/` is not committed. Helm 4 refuses
      # `dependency build` for a repository it has never been told about, so
      # the repo is added first — a no-op for Helm 3, required from Helm 4 on.
      - name: helm dependency build
        run: |
          helm repo add aquasecurity https://aquasecurity.github.io/helm-charts/
          helm repo update
          helm dependency build helm/batlehub
      - name: helm lint
        run: helm lint helm/batlehub

      - name: Render default values
        run: helm template batlehub helm/batlehub > /tmp/rendered.yaml

      # A probe path under /api/v1/admin is answered with 403 for the kubelet
      # (it sends no credentials), so the pod never becomes Ready and liveness
      # restarts it forever. /livez and /healthz are the only auth-exempt routes.
      - name: Probes must not target an authenticated endpoint
        run: |
          if grep -A2 -E 'livenessProbe:|readinessProbe:' /tmp/rendered.yaml \
             | grep -E 'path:\s*/api/'; then
            echo "::error::A probe targets an authenticated endpoint. Use /livez (liveness) or /healthz (readiness)."
            exit 1
          fi

      # Scoped to each probe block on purpose. Two independent global greps both
      # pass when the paths are *swapped* — liveness on /healthz would then
      # restart every replica on a database blip, exactly the failure this guard
      # exists to prevent, while the check stayed green.
      - name: Probes must target /livez and /healthz
        run: |
          grep -A3 -E '^[[:space:]]+livenessProbe:' /tmp/rendered.yaml \
            | grep -qE '^[[:space:]]+path: /livez$' \
            || { echo "::error::liveness probe is not /livez"; exit 1; }
          grep -A3 -E '^[[:space:]]+readinessProbe:' /tmp/rendered.yaml \
            | grep -qE '^[[:space:]]+path: /healthz$' \
            || { echo "::error::readiness probe is not /healthz"; exit 1; }

      # The image has no USER of its own baked in for every base we ship, so the
      # chart is the backstop that keeps the workload off uid 0.
      - name: Pod must be non-root by default
        run: |
          for key in 'runAsNonRoot: true' 'allowPrivilegeEscalation: false' 'readOnlyRootFilesystem: true'; do
            grep -q "$key" /tmp/rendered.yaml || { echo "::error::default values dropped '$key'"; exit 1; }
          done

      # ── The credentials layer (a second --config) ──────────────────────────
      #
      # Rendering it is the only test this feature has at the chart level, and
      # each assertion below is one way it has a silent failure mode: an arg
      # that is not passed leaves the credentials unread while every manifest
      # still looks right, and a checksum annotation would turn a credential
      # rotation into a pod rollout, which is what the hot reload exists to
      # avoid.
      - name: Render with the credentials layer
        run: |
          helm template batlehub helm/batlehub \
            --set credentials.enabled=true \
            --set credentials.config.database.url=postgresql://x \
            --set worker.enabled=true \
            > /tmp/credentials.yaml

      - name: Both Deployments must pass the second --config
        run: |
          count=$(grep -c -- '- /etc/batlehub/credentials/credentials.toml' /tmp/credentials.yaml || true)
          [ "$count" = "2" ] || {
            echo "::error::expected the credentials layer on both the proxy and the worker, found $count"
            exit 1
          }
          # Order decides the merge: the primary has to come first, or the base
          # config would win over the credentials it is supposed to complete.
          grep -A3 -- '- --config' /tmp/credentials.yaml \
            | grep -q -- '- /etc/batlehub/config.toml' \
            || { echo "::error::the primary config is not the first layer"; exit 1; }

      - name: The credentials Secret must not trigger a rollout
        run: |
          if grep -E '^\s+checksum/.*credential' /tmp/credentials.yaml; then
            echo "::error::a checksum annotation on the credentials Secret turns a rotation into a pod rollout"
            exit 1
          fi

      - name: An existing Secret replaces the chart-rendered one
        run: |
          helm template batlehub helm/batlehub \
            --set credentials.enabled=true \
            --set credentials.existingSecret=managed-elsewhere \
            > /tmp/existing.yaml
          grep -q 'secretName: managed-elsewhere' /tmp/existing.yaml \
            || { echo "::error::the named Secret is not mounted"; exit 1; }
          if grep -q 'batlehub-credentials' /tmp/existing.yaml; then
            echo "::error::the chart rendered its own credentials Secret alongside the named one"
            exit 1
          fi

      - name: The layer is absent by default
        run: |
          helm template batlehub helm/batlehub > /tmp/default.yaml
          if grep -q '/etc/batlehub/credentials' /tmp/default.yaml; then
            echo "::error::the credentials layer is mounted with credentials.enabled=false"
            exit 1
          fi

      # Rendering with a non-default combination catches template errors that
      # the default path never reaches (ingress rules, PDB, extra manifests).
      - name: Render a non-default configuration
        run: |
          helm template batlehub helm/batlehub \
            --set replicaCount=3 \
            --set ingress.enabled=true \
            --set 'ingress.extraHosts[0]=*.batlehub.example.com' \
            --set persistence.enabled=false \
            --set config.storage.type=s3 \
            > /dev/null

  docs:
    name: chart README matches values.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the version in mise.toml, not "latest": the generated table
      # carries the generator's own version in its footer, and two versions of
      # helm-docs do not have to agree on the rest of it either. A drifting
      # version here would fail the gate on a commit that changed nothing.
      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: "1.14.2"
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs --version

      # Regenerates and diffs. `helm/batlehub/README.md` is generated from
      # Chart.yaml and the `# --` comments in values.yaml, so a value added
      # without a description, or with a stale one, is caught here rather than
      # read by an operator as the truth about the chart.
      - name: helm-docs drift
        run: |
          set -euo pipefail
          helm-docs --chart-search-root=helm/batlehub --sort-values-order=file
          if ! git diff --exit-code -- helm/batlehub/README.md; then
            echo "::error::helm/batlehub/README.md is out of date. Run 'task helm:docs' and commit the result."
            exit 1
          fi
