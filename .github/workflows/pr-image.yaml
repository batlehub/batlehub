name: PR image
# A proxy image of a pull request, on demand: add the `image` label and this
# pushes `ghcr.io/<repo>:pr-<number>` (amd64 + arm64) built from the PR head.
# Same mechanism as `soak.yaml` — a label, because a `workflow_dispatch`-only
# workflow does not exist until it lands on the default branch — and the label
# is removed at the end, so adding it again rebuilds.
#
# A fork's pull request gets a read-only token, so this cannot push for one.
#
# Not a release: no signature, no attestation, no worker images. The CLI is the
# one the Containerfile builds itself (no `cli` build context here).
on:
  pull_request:
    branches: ["main"]
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CACHE: ghcr.io/${{ github.repository }}/buildcache
jobs:
  build:
    name: PR image — ${{ matrix.platform }}
    if: github.event.label.name == 'image'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: amd64
            os: ubuntu-latest
          - platform: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reads the release cache but never writes it: a release must not build
      # on layers a pull request produced. PRs share their own ref instead.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: |
            type=registry,ref=${{ env.CACHE }}:pr-${{ matrix.platform }}
            type=registry,ref=${{ env.CACHE }}:proxy-${{ matrix.platform }}
          cache-to: type=registry,ref=${{ env.CACHE }}:pr-${{ matrix.platform }},mode=max
      - name: Record the digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.platform }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Tag pr-${{ github.event.pull_request.number }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Tag the multi-arch index
        shell: bash
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: pr-${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sources=()
          for d in digests/*; do sources+=("${REF}@sha256:$(basename "$d")"); done
          docker buildx imagetools create -t "${REF}:${TAG}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "${REF}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "### \`${REF}:${TAG}\`"
            echo
            echo "Built from \`${SHA}\`, amd64 + arm64."
            echo
            echo '```'
            echo "docker pull ${REF}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  unlabel:
    name: Remove the label
    needs: [build, publish]
    if: always() && github.event.label.name == 'image'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove `image` so adding it again rebuilds
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/image" >/dev/null
