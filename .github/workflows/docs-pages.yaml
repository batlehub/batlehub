name: Docs (GitHub Pages)
# Mirror of .forgejo/workflows/website.yaml: the same VitePress build, published
# to https://batleforc.github.io/batlehub/ as well as the Git Pages site.
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs-pages.yaml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, never an
# in-progress one (a cancelled deploy can leave Pages half-published).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm before setup-node so its cache step can resolve the store directory.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # BASE_URL drives VitePress `base` (project page → /batlehub/), SITE_ORIGIN
      # the sitemap and canonical URLs; both are read by docs/.vitepress/config.ts.
      - name: Build the documentation site
        working-directory: docs
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}/
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
