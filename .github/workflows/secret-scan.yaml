name: Secret scan
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      # Pinned, and pinned to the same version `mise.toml` installs, so
      #   GITLEAKS_CONFIG=$PWD/gitleaks.toml gitleaks git .
      # run locally reproduces this gate exactly. A drifting version did not:
      # 8.24.3's `generic-api-key` rule matched a test fixture that 8.30.1's
      # does not, so the gate failed on a finding no contributor could
      # reproduce while `task security` said the tree was clean.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so PR commits and the existing tree are scanned
      # The upstream binary, not `gitleaks/gitleaks-action`. The action refuses
      # to run for a repository owned by a GitHub *organisation* without a
      # `GITLEAKS_LICENSE` secret — "missing gitleaks license", exit 1, nothing
      # scanned — and this repository moved under one. The scanner itself is
      # unencumbered, so invoking it directly removes the licensing surface
      # rather than working around it, and it is the same binary and the same
      # ruleset `mise` installs for `task security`.
      - name: Install gitleaks
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # `gitleaks git` walks the history the checkout above fetched in full, so
      # a secret committed and then removed is still a finding. `--redact` keeps
      # the value itself out of the log, which is public.
      - name: gitleaks
        env:
          GITLEAKS_CONFIG: ${{ github.workspace }}/gitleaks.toml
        run: gitleaks git . --redact --verbose
