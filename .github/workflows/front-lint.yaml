name: Frontend Lint
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # RFC 0041 decision 28: no workflow-level `paths:` (a skipped pull request
  # would leave `required` "Expected"); this job applies them instead.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        uses: ./.github/actions/required-gate
        with:
          paths: |
            ui/**/*.ts
            ui/**/*.vue
            ui/package.json
            ui/pnpm-lock.yaml
            ui/.oxlintrc.json
            ui/.oxfmtrc.json
            .github/workflows/front-lint.yaml
            .github/scripts/required_gate.py
            .github/actions/required-gate/action.yml

  lint:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Only this job uploads SARIF; the gate and required jobs stay read-only.
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must be installed before setup-node so its cache step can resolve
      # the pnpm store directory. Same action/pin as .forgejo/workflows/updatecli.yml.
      # (Corepack is not used: Node stopped distributing it in v25.)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # --frozen-lockfile fails the job if pnpm-lock.yaml would need updating
      # (the `npm ci` equivalent). --ignore-scripts states the script policy on the
      # command line rather than relying on pnpm's default deny + the `allowBuilds`
      # list in ui/pnpm-workspace.yaml alone; neither package.json here declares a
      # lifecycle script, so nothing this project needs is skipped.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run oxlint
        id: oxlint
        continue-on-error: true
        run: pnpm run lint -f sarif src > oxlint-results.sarif
      - name: Upload oxlint SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ui/oxlint-results.sarif
          category: oxlint
          wait-for-processing: true
      - name: Run eslint
        id: eslint
        continue-on-error: true
        run: pnpm run lint:eslint --format @microsoft/eslint-formatter-sarif -o eslint-results.sarif
      - name: Upload eslint SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ui/eslint-results.sarif
          category: eslint
          wait-for-processing: true
      - name: Check formatting (oxfmt)
        run: pnpm run format:check
      - name: Fail on lint errors
        if: steps.oxlint.outcome == 'failure' || steps.eslint.outcome == 'failure'
        run: exit 1

  # The one check the `main` ruleset requires: every job succeeded, or the
  # gate skipped them all (RFC 0041 decision 28).
  required:
    # Unique across workflows: a ruleset matches a required check by this name.
    name: front-lint.yaml / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, lint]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I .github/scripts/required_gate.py verdict "$NEEDS"
