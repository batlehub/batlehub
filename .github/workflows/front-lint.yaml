name: Frontend Lint
on:
  push:
    branches: ["main"]
    paths:
      - "ui/**/*.ts"
      - "ui/**/*.vue"
      - "ui/package.json"
      - "ui/pnpm-lock.yaml"
      - "ui/.oxlintrc.json"
      - "ui/.oxfmtrc.json"
      - ".github/workflows/front-lint.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "ui/**/*.ts"
      - "ui/**/*.vue"
      - "ui/package.json"
      - "ui/pnpm-lock.yaml"
      - "ui/.oxlintrc.json"
      - "ui/.oxfmtrc.json"
      - ".github/workflows/front-lint.yaml"
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must be installed before setup-node so its cache step can resolve
      # the pnpm store directory. Same action/pin as .forgejo/workflows/updatecli.yml.
      # (Corepack is not used: Node stopped distributing it in v25.)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # --frozen-lockfile fails the job if pnpm-lock.yaml would need updating
      # (the `npm ci` equivalent). --ignore-scripts states the script policy on the
      # command line rather than relying on pnpm's default deny + the `allowBuilds`
      # list in ui/pnpm-workspace.yaml alone; neither package.json here declares a
      # lifecycle script, so nothing this project needs is skipped.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run oxlint
        id: oxlint
        continue-on-error: true
        run: pnpm run lint -f sarif src > oxlint-results.sarif
      - name: Upload oxlint SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ui/oxlint-results.sarif
          category: oxlint
          wait-for-processing: true
      - name: Run eslint
        id: eslint
        continue-on-error: true
        run: pnpm run lint:eslint --format @microsoft/eslint-formatter-sarif -o eslint-results.sarif
      - name: Upload eslint SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ui/eslint-results.sarif
          category: eslint
          wait-for-processing: true
      - name: Check formatting (oxfmt)
        run: pnpm run format:check
      - name: Fail on lint errors
        if: steps.oxlint.outcome == 'failure' || steps.eslint.outcome == 'failure'
        run: exit 1
