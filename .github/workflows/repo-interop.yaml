name: Repo interop (apt/dnf/pacman)
# Confirms that real `apt`, `dnf`, and `pacman` accept BatleHub's Deb/RPM/pacman
# repositories — the hand-rolled Ed25519 OpenPGP signatures and generated indexes —
# end to end.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  # RFC 0041 decision 28: no workflow-level `paths:` (a skipped pull request
  # would leave `required` "Expected"); this job applies them instead.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        uses: ./.github/actions/required-gate
        with:
          paths: |
            crates/adapters/src/repo/**
            crates/adapters/tests/repo_interop.rs
            tests/interop/**
            .github/workflows/repo-interop.yaml
            .github/scripts/required_gate.py
            .github/actions/required-gate/action.yml

  interop:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: apt + dnf + pacman accept signed repos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      # ubuntu-latest ships Docker; verify.sh auto-detects docker or podman.
      - name: Verify apt + dnf + pacman interop
        run: bash tests/interop/verify.sh

  # The one check the `main` ruleset requires: every job succeeded, or the
  # gate skipped them all (RFC 0041 decision 28).
  required:
    # Unique across workflows: a ruleset matches a required check by this name.
    name: repo-interop.yaml / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, interop]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I .github/scripts/required_gate.py verdict "$NEEDS"
