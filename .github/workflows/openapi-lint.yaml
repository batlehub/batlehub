name: OpenAPI lint
# Spectral over the committed spec: OAS correctness plus the OWASP API Top 10
# authentication rules. Ruleset and every exception: .spectral.yaml.
# Reproduce locally with `task openapi:lint`.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # RFC 0041 decision 28: no workflow-level `paths:` (a skipped pull request
  # would leave `required` "Expected"); this job applies them instead.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        uses: ./.github/actions/required-gate
        with:
          paths: |
            ui/openapi.json
            .spectral.yaml
            .github/workflows/openapi-lint.yaml
            .github/scripts/required_gate.py
            .github/actions/required-gate/action.yml

  spectral:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Spectral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Same command as `task openapi:lint` (see the note there on why it is not
      # a ui/ devDependency). Fails on any warning: the spec is kept at zero.
      - name: Spectral lint
        run: npx --yes --ignore-scripts @stoplight/spectral-cli@6.17.0 lint ui/openapi.json --fail-severity=warn

  # The one check the `main` ruleset requires: every job succeeded, or the
  # gate skipped them all (RFC 0041 decision 28).
  required:
    # Unique across workflows: a ruleset matches a required check by this name.
    name: openapi-lint.yaml / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, spectral]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I .github/scripts/required_gate.py verdict "$NEEDS"
