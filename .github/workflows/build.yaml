name: Release
on:
  push:
    tags:
      - "*"
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_NAMESPACE: oci://ghcr.io/${{ github.repository }}/charts
jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          version="${tag_name#v}"
          echo "tag=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
  # Publishes the binary the proxy image's amd64 leg built (its `server` stage),
  # not a build of its own: the release compiles the server once per arch
  # (TD-0003 §3). Built on bookworm, so it also runs on a glibc as old as 2.36.
  server:
    name: Publish server binary
    runs-on: ubuntu-latest
    needs: [meta, image-proxy]
    permissions:
      contents: write
      packages: write
      id-token: write # keyless signing + attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Fetch the server
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-linux-amd64
          path: dist/server
      # upload-artifact does not keep mode bits.
      - name: Restore the executable bit
        run: chmod 0755 dist/server/batlehub
      # CycloneDX SBOM of the Rust workspace — lets a future-disclosed crate CVE
      # be matched against this exact shipped build (`trivy sbom sbom-rust.cdx.json`).
      - name: Generate Rust SBOM (CycloneDX)
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx
          # cargo-cyclonedx writes one <crate>.cdx.json per workspace member next
          # to its manifest; keep only the server's, for the release upload below.
          cargo cyclonedx --format json --manifest-path server/Cargo.toml
          cp server/batlehub-server.cdx.json sbom-rust.cdx.json
          find . -maxdepth 3 -name '*.cdx.json' -not -path './sbom-rust.cdx.json' -delete
      # ── Signing the binary ──────────────────────────────────────────────
      #
      # Two artefacts, two mechanisms, and they answer different questions.
      #
      # *Provenance* (`attest-build-provenance`) answers "which workflow, from
      # which commit, built this?" — a SLSA statement signed by the Sigstore
      # public-good instance and recorded in Rekor. `gh attestation verify`
      # checks it with no key to distribute.
      #
      # *A detached signature* (`cosign sign-blob`, in the `sign` job below)
      # answers "is this the file that release published?" for someone who has
      # the file and not the GitHub API — an air-gapped mirror, a distro
      # packager, a Renovate-style bot pulling the tarball.
      #
      # Keyless throughout: the signing identity is this workflow's OIDC token,
      # so there is no private key in a secret to leak or rotate.
      - name: Attest the binary's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/server/batlehub
      # The SBOM is *bound to the binary*, not merely uploaded beside it: the
      # attestation names the binary's digest as its subject, so a consumer who
      # has the file can ask which SBOM describes it and get an answer that
      # cannot be swapped.
      - name: Attest the binary's SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/server/batlehub
          sbom-path: sbom-rust.cdx.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "🚀 BatleHub ${{ needs.meta.outputs.tag }}"
          draft: true
          body: |
            ## 🚀 BatleHub ${{ needs.meta.outputs.tag }}

            A fresh release just landed! ✨

            ### 📦 What's in the box
            - 🖥️ **Server binary** — `batlehub` (Linux x86_64)
            - 🧰 **CLI** — Linux (amd64/arm64), Windows, macOS
            - 🐳 **Container image** — `ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.version }}`
            - 🔬 **Worker image** (scanner toolchains, RFC 0018) — `ghcr.io/${{ github.repository }}-worker:${{ needs.meta.outputs.version }}`
            - 🐕 **Worker image + GuardDog** (the optional Python scanner) — `ghcr.io/${{ github.repository }}-worker-guarddog:${{ needs.meta.outputs.version }}`
            - ⎈ **Helm chart** — `${{ env.CHART_NAMESPACE }}`
            - 🛡️ **SBOMs** (CycloneDX) attached & attested — the binary and all three images
            - 🧾 **VEX** (OpenVEX) — `batlehub.openvex.json`, what the standing CVE findings mean for these images
            - 🔏 **`checksums.txt`** + a Sigstore bundle covering every asset here

            ### 🔍 Verify it

            Everything is signed **keylessly**: the identity is this workflow, and
            there is no public key to fetch.

            ```bash
            # Every image and the chart (replace the digest with the one you pulled)
            cosign verify \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.version }}

            # The downloads on this page, without calling the GitHub API
            cosign verify-blob --bundle checksums.txt.sigstore.json \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              checksums.txt
            sha256sum -c checksums.txt

            # Provenance and SBOM, per artefact
            gh attestation verify batlehub --repo ${{ github.repository }}

            # Scan an image with our assessment of the standing findings applied
            trivy image --vex batlehub.openvex.json \
              ghcr.io/${{ github.repository }}-worker:${{ needs.meta.outputs.version }}
            ```

            ### 📚 Docs
            https://batleforc.git.batleforc.fr/batlehub

            ---
            #### 📝 Changes
          generate_release_notes: true
          files: |
            dist/server/batlehub
            sbom-rust.cdx.json
          fail_on_unmatched_files: true
  cli:
    name: CLI — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: meta
    permissions:
      contents: write
      packages: write
      id-token: write # keyless attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One native runner per Linux arch, no `cross`: the arm64 leg used
          # to build on an amd64 runner, and the image job below now copies
          # these two binaries rather than compiling the CLI a second time.
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: batlehub-cli
            archive: batlehub-cli-linux-amd64.tar.gz
            image_platform: amd64
            windows: false
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: batlehub-cli
            archive: batlehub-cli-linux-arm64.tar.gz
            image_platform: arm64
            windows: false
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: batlehub-cli.exe
            archive: batlehub-cli-windows-amd64.zip
            windows: true
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: batlehub-cli
            archive: batlehub-cli-darwin-arm64.tar.gz
            windows: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # musl-gcc for aws-lc-sys's C. cc-rs looks for `aarch64-linux-musl-gcc`
      # on the arm64 leg, which musl-tools does not ship, hence the explicit CC.
      # musl-gcc's specs drop /usr/include, where the kernel headers aws-lc
      # includes (`linux/random.h`) live — `-idirafter` puts them back behind
      # musl's own headers, so libc still resolves to musl.
      - name: Install the musl toolchain
        if: matrix.image_platform
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          target_env=$(echo '${{ matrix.target }}' | tr '-' '_')
          echo "CC_${target_env}=musl-gcc" >> "$GITHUB_ENV"
          echo "CFLAGS_${target_env}=-idirafter /usr/include -idirafter /usr/include/$(uname -m)-linux-gnu" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p batlehub-cli --target ${{ matrix.target }}
      - name: Stage artifact (Unix)
        if: "!matrix.windows"
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" batlehub-cli
          tar czf "${{ matrix.archive }}" batlehub-cli
      - name: Stage artifact (Windows)
        if: matrix.windows
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" batlehub-cli.exe
          Compress-Archive -Path batlehub-cli.exe -DestinationPath "${{ matrix.archive }}"
      # Per-target, because each runner builds its own archive and only that
      # runner ever holds the bytes. The windows/macOS legs attest from their
      # own OS, which is also what makes "built on macOS" a checkable claim.
      - name: Attest the archive's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}
      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "🚀 BatleHub ${{ needs.meta.outputs.tag }}"
          draft: true
          files: ${{ matrix.archive }}
          fail_on_unmatched_files: true
      # The bare binary, for the image job: its `cli` build context.
      - name: Hand the binary to the image job
        if: matrix.image_platform
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-linux-${{ matrix.image_platform }}
          path: batlehub-cli
          if-no-files-found: error
          retention-days: 1
  # ── Container images ────────────────────────────────────────────────────────
  #
  # Three jobs. `image-proxy` builds the proxy image once per arch on a native
  # runner — under QEMU the arm64 leg alone took 3 h 28 of v1.8.1's release —
  # and pushes each by digest only. Its amd64 leg also hands its `server` stage
  # to the `server` job and to `image-worker`, which builds the two amd64 worker
  # images around that binary rather than compiling it again. `image` stitches the proxy digests into the tagged index,
  # then signs, scans, attests and gates all three images.
  #
  # Build caches live in the registry, not in `type=gha`: a tag run can only
  # read the Actions cache of its own ref and of `main`, so a release never saw
  # the previous release's cache — and the proxy and worker builds shared the
  # default gha scope, each overwriting the other's. One ref per image and arch.
  image-proxy:
    name: Proxy image — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: meta
    permissions:
      contents: read
      packages: write
      actions: read # list this run's artifacts while waiting for the CLI
    strategy:
      matrix:
        include:
          - platform: amd64
            os: ubuntu-latest
          - platform: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The server, while the `cli` job builds the CLI: the server is the
      # twenty minutes, the CLI is a COPY. Exported as a file for the `server`
      # and `image-worker` jobs; the final build below reuses these layers from
      # this builder's local cache.
      - name: Build the server stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          target: server
          platforms: linux/${{ matrix.platform }}
          outputs: type=local,dest=dist/server
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:proxy-${{ matrix.platform }}
      - name: Hand the server to the release and the worker images
        if: matrix.platform == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-linux-amd64
          path: dist/server/batlehub
          if-no-files-found: error
          retention-days: 1
      # The image ships the binary the `cli` job built and attested, not a
      # second build of it. That job is normally done long before this point;
      # the wait only covers a slow runner queue.
      - name: Wait for the CLI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: cli-linux-${{ matrix.platform }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[].name')
            if grep -qx "$ARTIFACT" <<<"$names"; then
              exit 0
            fi
            sleep 20
          done
          echo "${ARTIFACT} never appeared after 30 min — did the cli job fail?" >&2
          exit 1
      - name: Fetch the CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-linux-${{ matrix.platform }}
          path: dist/cli
      # upload-artifact does not keep mode bits, and COPY carries them over.
      - name: Restore the executable bit
        run: chmod 0755 dist/cli/batlehub-cli
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/${{ matrix.platform }}
          # Replaces the Containerfile's `cli` stage, so it is never built.
          build-contexts: cli=dist/cli
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:proxy-${{ matrix.platform }}
          # Here rather than on the server step, so the UI stage's layers are
          # in it too.
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:proxy-${{ matrix.platform }},mode=max
      - name: Record the digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-proxy-${{ matrix.platform }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
  image-worker:
    name: Worker images
    runs-on: ubuntu-latest
    needs: [meta, image-proxy]
    permissions:
      contents: read
      packages: write
    outputs:
      worker: ${{ steps.build_worker.outputs.digest }}
      guarddog: ${{ steps.build_worker_guarddog.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the server
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-linux-amd64
          path: dist/server
      # upload-artifact does not keep mode bits, and COPY carries them over.
      - name: Restore the executable bit
        run: chmod 0755 dist/server/batlehub
      # The worker image (RFC 0018 §5.4): the same binary with the scanner
      # toolchains — bubblewrap, postmortem, the Trivy client — that the proxy
      # image deliberately does not carry. amd64 only: the Containerfile
      # fetches the x86_64 postmortem release asset.
      - name: Build and push worker image
        id: build_worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile.worker
          push: true
          platforms: linux/amd64
          # Replaces the Containerfile's `server` stage, so it is never built.
          build-contexts: server=dist/server
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ needs.meta.outputs.version }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:worker
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:worker,mode=max
      # The GuardDog variant of the worker image (RFC 0018 §6.3): the optional
      # Python scanner, on top of the image just pushed — by digest, so the two
      # can never carry different binaries. A deployment that enables
      # `[scanners.guarddog]` runs this one instead of the worker image.
      - name: Build and push GuardDog worker image
        id: build_worker_guarddog
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile.worker-guarddog
          push: true
          platforms: linux/amd64
          build-args: |
            WORKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker@${{ steps.build_worker.outputs.digest }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog:${{ needs.meta.outputs.version }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:worker-guarddog
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:worker-guarddog,mode=max
  image:
    name: Publish, sign and scan the images
    runs-on: ubuntu-latest
    needs: [meta, image-proxy, image-worker]
    permissions:
      contents: write
      packages: write
      security-events: write # upload Trivy SARIF
      id-token: write # SBOM / provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Keyless: cosign takes this job's OIDC token as the signing identity and
      # records the signature in the Sigstore transparency log. No key material
      # exists to be stolen, and `cosign verify` checks the *identity* — this
      # workflow, at this tag — rather than a fingerprint someone has to trust.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-proxy-*
          path: digests
          merge-multiple: true
      # `id: build` so every step below keeps reading the proxy digest from
      # `steps.build.outputs.digest` — now the index's, not one arch's.
      - name: Tag the multi-arch proxy index
        id: build
        shell: bash
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          sources=()
          for d in digests/*; do sources+=("${REF}@sha256:$(basename "$d")"); done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "expected 2 arch digests, got ${#sources[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create -t "${REF}:${VERSION}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "${REF}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of the worker image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker@${{ needs.image-worker.outputs.worker }}
          format: sarif
          output: trivy-results-worker.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload worker SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results-worker.sarif
          category: trivy-worker-image
      # ── Signatures ──────────────────────────────────────────────────────
      #
      # By digest, never by tag: a tag is a mutable pointer, so signing
      # `:1.2.3` would sign whatever that name resolves to at verification
      # time. `--yes` because there is no console to confirm on.
      #
      # This is separate from the attestations below, and both are wanted. A
      # signature says *this registry content was published by this workflow*;
      # an attestation carries a document (the SBOM, the VEX) bound to the same
      # digest. Kubernetes admission policies check the first; a scanner or an
      # auditor reads the second.
      - name: Sign the images
        shell: bash
        env:
          PROXY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          WORKER: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker@${{ needs.image-worker.outputs.worker }}
          GUARDDOG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog@${{ needs.image-worker.outputs.guarddog }}
        run: |
          set -euo pipefail
          for image in "$PROXY" "$WORKER" "$GUARDDOG"; do
            echo "::group::cosign sign ${image}"
            cosign sign --yes "$image"
            echo "::endgroup::"
          done
      - name: Trivy scan of the GuardDog worker image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog@${{ needs.image-worker.outputs.guarddog }}
          format: sarif
          output: trivy-results-worker-guarddog.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload GuardDog worker SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results-worker-guarddog.sarif
          category: trivy-worker-guarddog-image
      # Scan the published image. Prevention happens earlier (image-scan.yaml on
      # PRs + the daily rebuild-and-scan); this is the release backstop and feeds
      # the Security tab.
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release-image
      # ── SBOMs: one per image, each bound to the image it describes ──────
      #
      # All three images, not just the proxy one. The worker images are the ones
      # that carry a *second* toolchain — bubblewrap, the Trivy client,
      # postmortem, and GuardDog's whole Python tree — so they are precisely the
      # images whose contents a consumer cannot guess from this repository's
      # lockfiles. Shipping an SBOM for the thin image and none for the fat ones
      # is the wrong way round.
      #
      # `push-to-registry: true` is what "bound" means here: the attestation
      # becomes an OCI referrer of the image digest, so it travels with the
      # image through any registry that understands referrers — no release page,
      # no GitHub API, and nothing to keep in step by hand.
      - name: Generate image SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image.cdx.json
      - name: Generate worker image SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker@${{ needs.image-worker.outputs.worker }}
          format: cyclonedx-json
          output-file: sbom-image-worker.cdx.json
          artifact-name: sbom-image-worker.cdx.json
      - name: Generate GuardDog worker image SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog@${{ needs.image-worker.outputs.guarddog }}
          format: cyclonedx-json
          output-file: sbom-image-worker-guarddog.cdx.json
          artifact-name: sbom-image-worker-guarddog.cdx.json
      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-image.cdx.json
          push-to-registry: true
      - name: Attest worker image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          subject-digest: ${{ needs.image-worker.outputs.worker }}
          sbom-path: sbom-image-worker.cdx.json
          push-to-registry: true
      - name: Attest GuardDog worker image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog
          subject-digest: ${{ needs.image-worker.outputs.guarddog }}
          sbom-path: sbom-image-worker-guarddog.cdx.json
          push-to-registry: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest worker build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          subject-digest: ${{ needs.image-worker.outputs.worker }}
          push-to-registry: true
      - name: Attest GuardDog worker build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog
          subject-digest: ${{ needs.image-worker.outputs.guarddog }}
          push-to-registry: true

      # ── VEX: what the CVEs in these images mean, said once, to everyone ──
      #
      # A scanner run by a consumer sees the same findings the gate below
      # accepted, and has no way to know they were assessed — `.trivyignore.yaml`
      # is read by Trivy and by nothing else, and it never leaves this
      # repository. The rendered OpenVEX document is the same set of decisions
      # in the format every mainstream scanner reads, with the products
      # rewritten to the digests this release actually published.
      #
      # Attested with `cosign attest`, so it travels as a referrer of the image
      # exactly as the SBOM does. A consumer can then do
      #
      #   cosign download attestation --predicate-type https://openvex.dev/ns \
      #     ghcr.io/…/batlehub-worker@sha256:… | jq …
      #
      # or point `trivy image --vex` at the file from the release page.
      - name: Render the VEX document for this release
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PROXY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          WORKER: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker@${{ needs.image-worker.outputs.worker }}
          GUARDDOG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog@${{ needs.image-worker.outputs.guarddog }}
        run: |
          set -euo pipefail
          # The same check `task security` runs, here as well: a release is the
          # last place a stale statement can still be caught before it is
          # published under a signature.
          python3 .github/scripts/vex.py check
          python3 .github/scripts/vex.py render \
            --version "$VERSION" \
            --image "$PROXY" --image "$WORKER" --image "$GUARDDOG" \
            --out batlehub.openvex.json
      - name: Attest the VEX document to each image
        shell: bash
        env:
          PROXY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          WORKER: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker@${{ needs.image-worker.outputs.worker }}
          GUARDDOG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog@${{ needs.image-worker.outputs.guarddog }}
        run: |
          set -euo pipefail
          for image in "$PROXY" "$WORKER" "$GUARDDOG"; do
            echo "::group::cosign attest openvex ${image}"
            cosign attest --yes --type openvex \
              --predicate batlehub.openvex.json "$image"
            echo "::endgroup::"
          done
      - name: Attach the SBOMs and the VEX document to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "🚀 BatleHub ${{ needs.meta.outputs.tag }}"
          draft: true
          files: |
            sbom-image.cdx.json
            sbom-image-worker.cdx.json
            sbom-image-worker-guarddog.cdx.json
            batlehub.openvex.json
      # Final gate — fail the release run on any fixable HIGH/CRITICAL CVE.
      #
      # `TRIVY_VEX` rather than a `vex:` input: trivy-action passes the
      # environment through to the binary, and Trivy reads a `TRIVY_`-prefixed
      # variable for every flag it has. The document is the one just rendered,
      # so a finding is only ever suppressed here by a statement that was also
      # published, signed and attested — the gate cannot be quieter than what
      # the consumer is told.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: batlehub.openvex.json
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  chart:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: write
      packages: write
      id-token: write # keyless signing of the pushed chart
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        shell: bash
        run: |
          # Helm 4 refuses `dependency build` for a repository it has never
          # been told about; harmless on the Helm 3 pinned above.
          helm repo add aquasecurity https://aquasecurity.github.io/helm-charts/
          helm repo update
          helm dependency build helm/batlehub
          mkdir -p dist
          helm package helm/batlehub \
            --destination dist \
            --version "${{ needs.meta.outputs.version }}" \
            --app-version "${{ needs.meta.outputs.version }}"
      # The digest comes out of `helm push`, which prints it to **stderr** along
      # with the pushed reference. A chart in an OCI registry is an image as far
      # as cosign is concerned, so signing it is the same operation as signing
      # the container images — and a cluster that pulls charts over OCI can hold
      # them to the same admission policy.
      - name: Push chart to GHCR and sign it
        shell: bash
        run: |
          set -euo pipefail
          helm push "dist/batlehub-${{ needs.meta.outputs.version }}.tgz" "${CHART_NAMESPACE}" 2>&1 \
            | tee push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -n1)
          if [ -z "${digest}" ]; then
            echo "helm push printed no digest — refusing to sign a tag" >&2
            exit 1
          fi
          repo="${CHART_NAMESPACE#oci://}/batlehub"
          echo "Signing ${repo}@${digest}"
          cosign sign --yes "${repo}@${digest}"

  # ── One file that covers every release asset ────────────────────────────────
  #
  # The attestations above are per-artefact and live in GitHub's attestation
  # API; this is the offline half. `checksums.txt` names every asset the release
  # published, and the detached Sigstore bundle beside it says this workflow
  # produced that list — so a mirror, a distro packager or an air-gapped
  # importer can verify a download with `cosign verify-blob` and `sha256sum -c`,
  # with no GitHub API call and no key to distribute.
  #
  # Last, and needing every other job: it can only list assets that exist. The
  # performance report is the one thing deliberately not covered — it is
  # attached by `perf-report.yaml`, which runs on the same tag and takes far
  # longer, and holding the release's signature behind twenty minutes of load
  # generation would be the wrong trade.
  sign:
    name: Checksums and detached signature
    runs-on: ubuntu-latest
    needs: [meta, server, cli, image, chart]
    permissions:
      contents: write
      id-token: write # keyless signing
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # The release is still a draft at this point, which `gh release
          # download` handles — it resolves drafts by tag for a token that can
          # see them.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --clobber
          ls -la assets
      - name: Checksum and sign
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          # Sorted, so the file is byte-identical for the same set of assets
          # whatever order they were downloaded in — and without the checksum
          # files themselves, which a re-run would otherwise have downloaded
          # from the previous attempt and then checksummed.
          sha256sum $(ls | grep -v '^checksums\.txt' | sort) > ../checksums.txt
          cd ..
          cat checksums.txt
          # `--bundle` writes signature, certificate and the transparency-log
          # entry as one file. Verifying then needs that file and nothing else:
          #
          #   cosign verify-blob --bundle checksums.txt.sigstore.json \
          #     --certificate-identity-regexp '^https://github\.com/OWNER/REPO/' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #     checksums.txt
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt
      - name: Attach them to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "🚀 BatleHub ${{ needs.meta.outputs.tag }}"
          draft: true
          files: |
            checksums.txt
            checksums.txt.sigstore.json
          fail_on_unmatched_files: true
