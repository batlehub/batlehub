name: Release
on:
  push:
    tags:
      - "*"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_NAMESPACE: oci://ghcr.io/${{ github.repository }}/charts
jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          version="${tag_name#v}"
          echo "tag=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
  server:
    name: Build and publish server binary
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked -p batlehub-server
      # CycloneDX SBOM of the Rust workspace — lets a future-disclosed crate CVE
      # be matched against this exact shipped build (`trivy sbom sbom-rust.cdx.json`).
      - name: Generate Rust SBOM (CycloneDX)
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx
          # cargo-cyclonedx writes one <crate>.cdx.json per workspace member next
          # to its manifest; keep only the server's, for the release upload below.
          cargo cyclonedx --format json --manifest-path server/Cargo.toml
          cp server/batlehub-server.cdx.json sbom-rust.cdx.json
          find . -maxdepth 3 -name '*.cdx.json' -not -path './sbom-rust.cdx.json' -delete
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "🚀 BatleHub ${{ needs.meta.outputs.tag }}"
          draft: true
          body: |
            ## 🚀 BatleHub ${{ needs.meta.outputs.tag }}

            A fresh release just landed! ✨

            ### 📦 What's in the box
            - 🖥️ **Server binary** — `batlehub` (Linux x86_64)
            - 🧰 **CLI** — Linux (amd64/arm64), Windows, macOS
            - 🐳 **Container image** — `ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.version }}`
            - 🔬 **Worker image** (scanner toolchains, RFC 0018) — `ghcr.io/${{ github.repository }}-worker:${{ needs.meta.outputs.version }}`
            - 🐕 **Worker image + GuardDog** (the optional Python scanner) — `ghcr.io/${{ github.repository }}-worker-guarddog:${{ needs.meta.outputs.version }}`
            - ⎈ **Helm chart** — `${{ env.CHART_NAMESPACE }}`
            - 🛡️ **SBOMs** (CycloneDX) attached & attested for both the binary and the container image

            ### 🔍 Verify it
            Build provenance and SBOM attestations are published — check them with `gh attestation verify`.

            ### 📚 Docs
            https://batleforc.git.batleforc.fr/batlehub

            ---
            #### 📝 Changes
          generate_release_notes: true
          files: |
            target/release/batlehub
            sbom-rust.cdx.json
          fail_on_unmatched_files: true
  cli:
    name: CLI — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: meta
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: batlehub-cli
            archive: batlehub-cli-linux-amd64.tar.gz
            use_cross: true
            windows: false
          - name: Linux aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: batlehub-cli
            archive: batlehub-cli-linux-arm64.tar.gz
            use_cross: true
            windows: false
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: batlehub-cli.exe
            archive: batlehub-cli-windows-amd64.zip
            use_cross: false
            windows: true
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: batlehub-cli
            archive: batlehub-cli-darwin-arm64.tar.gz
            use_cross: false
            windows: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cross
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked -p batlehub-cli --target ${{ matrix.target }}
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --locked -p batlehub-cli --target ${{ matrix.target }}
      - name: Stage artifact (Unix)
        if: "!matrix.windows"
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" batlehub-cli
          tar czf "${{ matrix.archive }}" batlehub-cli
      - name: Stage artifact (Windows)
        if: matrix.windows
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" batlehub-cli.exe
          Compress-Archive -Path batlehub-cli.exe -DestinationPath "${{ matrix.archive }}"
      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "🚀 BatleHub ${{ needs.meta.outputs.tag }}"
          draft: true
          files: ${{ matrix.archive }}
          fail_on_unmatched_files: true
  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: write
      packages: write
      security-events: write # upload Trivy SARIF
      id-token: write # SBOM / provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The worker image (RFC 0018 §5.4): the same binary with the scanner
      # toolchains — bubblewrap, postmortem, the Trivy client — that the proxy
      # image deliberately does not carry. amd64 only: the Containerfile
      # fetches the x86_64 postmortem release asset.
      - name: Build and push worker image
        id: build_worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile.worker
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ needs.meta.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan of the worker image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker@${{ steps.build_worker.outputs.digest }}
          format: sarif
          output: trivy-results-worker.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload worker SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results-worker.sarif
          category: trivy-worker-image
      # The GuardDog variant of the worker image (RFC 0018 §6.3): the optional
      # Python scanner, on top of the image just pushed — by digest, so the two
      # can never carry different binaries. A deployment that enables
      # `[scanners.guarddog]` runs this one instead of the worker image.
      - name: Build and push GuardDog worker image
        id: build_worker_guarddog
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile.worker-guarddog
          push: true
          platforms: linux/amd64
          build-args: |
            WORKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker@${{ steps.build_worker.outputs.digest }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog:${{ needs.meta.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=worker-guarddog
          cache-to: type=gha,mode=max,scope=worker-guarddog
      - name: Trivy scan of the GuardDog worker image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker-guarddog@${{ steps.build_worker_guarddog.outputs.digest }}
          format: sarif
          output: trivy-results-worker-guarddog.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload GuardDog worker SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results-worker-guarddog.sarif
          category: trivy-worker-guarddog-image
      # Scan the published image. Prevention happens earlier (image-scan.yaml on
      # PRs + the daily rebuild-and-scan); this is the release backstop and feeds
      # the Security tab.
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release-image
      # Generate a CycloneDX SBOM of the published image and attest it.
      - name: Generate image SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image.cdx.json
      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-image.cdx.json
          push-to-registry: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attach image SBOM to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "🚀 BatleHub ${{ needs.meta.outputs.tag }}"
          draft: true
          files: sbom-image.cdx.json
      # Final gate — fail the release run on any fixable HIGH/CRITICAL CVE.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  chart:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        shell: bash
        run: |
          # Helm 4 refuses `dependency build` for a repository it has never
          # been told about; harmless on the Helm 3 pinned above.
          helm repo add aquasecurity https://aquasecurity.github.io/helm-charts/
          helm repo update
          helm dependency build helm/batlehub
          mkdir -p dist
          helm package helm/batlehub \
            --destination dist \
            --version "${{ needs.meta.outputs.version }}" \
            --app-version "${{ needs.meta.outputs.version }}"
      - name: Push chart to GHCR
        shell: bash
        run: |
          helm push "dist/batlehub-${{ needs.meta.outputs.version }}.tgz" "${CHART_NAMESPACE}"
