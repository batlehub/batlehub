name: Docs CLI commands
# Every `batlehub-cli` command the published docs show must parse with the CLI
# as built, and none may use a spelling RFC 0040 deprecated (`task
# docs:cli-commands`). Its own workflow because it needs both halves: a docs
# edit can break an example, and a CLI change can break every example of the
# command it renames. test.yaml does not run on docs, and front-design.yaml has
# no cargo and does not run on cli/.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # RFC 0041 decision 28: no workflow-level `paths:` (a skipped pull request
  # would leave `required` "Expected"); this job applies them instead.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        uses: ./.github/actions/required-gate
        with:
          paths: |
            docs/**/*.md
            cli/**
            .tasks/scripts/check_doc_commands.py
            .tasks/scripts/test_check_doc_commands.py
            .github/workflows/docs-cli-commands.yaml
            .github/scripts/required_gate.py
            .github/actions/required-gate/action.yml

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Documented CLI commands parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the CLI
        run: cargo build --locked --quiet -p batlehub-cli
      - name: Checker's own tests
        run: python3 -m unittest -q test_check_doc_commands
        working-directory: .tasks/scripts
      - name: Every documented command parses
        run: python3 .tasks/scripts/check_doc_commands.py target/debug/batlehub-cli docs

  # The one check the `main` ruleset requires: every job succeeded, or the
  # gate skipped them all (RFC 0041 decision 28).
  required:
    # Unique across workflows: a ruleset matches a required check by this name.
    name: docs-cli-commands.yaml / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, check]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I .github/scripts/required_gate.py verdict "$NEEDS"
