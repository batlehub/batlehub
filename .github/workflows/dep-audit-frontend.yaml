name: Frontend dependency audit
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Daily so a CVE disclosed against an already-pinned dependency trips CI even
  # when nothing in the repo changed.
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # RFC 0041 decision 28: no workflow-level `paths:` (a skipped pull request
  # would leave `required` "Expected"); this job applies them instead.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        uses: ./.github/actions/required-gate
        with:
          paths: |
            ui/package.json
            ui/pnpm-lock.yaml
            docs/package.json
            docs/pnpm-lock.yaml
            .github/workflows/dep-audit-frontend.yaml
            .github/scripts/required_gate.py
            .github/actions/required-gate/action.yml

  audit:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: pnpm audit — ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: ui
            audit-args: ""
          # vitepress (and its transitive vite/esbuild) are build-only tooling
          # for the static site, never shipped or run as a service. Their
          # current advisories have no fix available upstream for vitepress 1.x
          # and don't apply to this repo's build; runtime deps (e.g. hash-wasm)
          # are still audited. Keep in sync with `task docs:audit`.
          - workspace: docs
            audit-args: "--prod"
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Same action/pin as .forgejo/workflows/updatecli.yml. Corepack is not used:
      # Node stopped distributing it in v25.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      # Audit resolves straight from the committed pnpm-lock.yaml — no install,
      # no lifecycle scripts. It covers the whole tree (direct + transitive) and
      # fails the job on any high/critical advisory.
      - name: pnpm audit
        run: pnpm audit --audit-level high ${{ matrix.audit-args }}

  # The one check the `main` ruleset requires: every job succeeded, or the
  # gate skipped them all (RFC 0041 decision 28).
  required:
    # Unique across workflows: a ruleset matches a required check by this name.
    name: dep-audit-frontend.yaml / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, audit]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I .github/scripts/required_gate.py verdict "$NEEDS"
