name: Development toolchain CVEs (mise)
# Scans the tools `mise.toml` installs — not the code they build — and reports
# on the pull request that changed them.
#
# ## Why this exists when `mise.lock` is already scanned
#
# `vuln-scan.yaml` sends `mise.lock` to vuln.mlab.sh, and that scan reads
# **four** of the forty-odd tools in it: the endpoint's lockfile parser
# understands the `cargo:` and PyPI backends and nothing else. Every tool that
# arrives as a GitHub release asset — trivy, syft, helm, k6, gitleaks, node, go,
# task, mc, and the rest — comes back with no findings, which is indistinguishable
# from being clean. Measured on 2026-09-15: 4 packages recognised out of the
# whole file, and a green result.
#
# A `trivy rootfs` over the *installed* toolchain reads what the lockfile scan
# cannot: the Go module metadata is embedded in every Go binary, the Node and
# Python trees are on disk as themselves. The same scan locally found 854
# findings, 461 of them fixable HIGH or CRITICAL, in a toolchain that had just
# been reported clean.
#
# The two are complementary rather than redundant, and neither covers the other:
# the lockfile scan sees the four packages that are *not* installed as binaries,
# this one sees the thirty-odd that are.
#
# ## Why a budget rather than a zero
#
# None of this ships. A CVE in `k9s` reaches nothing this project publishes, and
# a gate that fails a pull request every time somebody else's tool has a bad
# week is a gate that gets switched off. `.github/mise-cve-budget.json` records
# the number this toolchain currently carries; the job goes red when the number
# *grows*, which is the event worth looking at — a tool that has gone stale, or
# a new tool that arrived carrying a pile of findings.
#
# Raising the budget is a commit, in the open, with a reason. `task mise:cve:budget`
# rewrites the file.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "mise.toml"
      - "mise.lock"
      - ".github/mise-cve-budget.json"
      - ".github/scripts/mise_cve_report.py"
      - ".github/workflows/mise-scan.yaml"
  # Weekly, and not daily: the advisory database moves, but so does nothing else
  # here between tool bumps, and installing the whole toolchain is minutes of
  # runner time. Monday morning, before the week's work starts on it.
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  scan:
    name: Toolchain CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # `write`, for the comment. A fork's GITHUB_TOKEN stays read-only whatever
      # this says, which is why the post step tolerates its own failure.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The whole toolchain, from the lockfile, with mise's own cache: the
      # `cargo:` tools compile from source and would otherwise be several
      # minutes of every run. `install: true` is what makes this a scan of what
      # a contributor actually gets rather than of a list of version strings.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # The same version `test.yaml` pins as MISE_VERSION, so a toolchain
          # resolved here is the one the heavy suites resolve.
          version: 2026.9.5
          install: true
          cache: true

      - name: Say what was installed
        shell: bash
        run: |
          set -euo pipefail
          mise ls --installed || true
          echo "MISE_INSTALLS=$(mise where trivy | sed 's#/trivy/.*##')" >> "$GITHUB_ENV"

      # `rootfs`, not `fs`. They are not the same analysis: `fs` looks for
      # lockfiles and finds nothing inside a statically linked Go binary, which
      # is what most of this toolchain is. `rootfs` runs the binary analysers —
      # the ones that read Go's embedded module list — and is what turns 40
      # opaque executables into a dependency inventory.
      - name: Scan the installed toolchain
        shell: bash
        run: |
          set -euo pipefail
          trivy rootfs \
            --scanners vuln \
            --format json \
            --output mise-trivy.json \
            --quiet \
            "${MISE_INSTALLS}"
          echo "scanned ${MISE_INSTALLS}"

      - name: Build the report and check it against the budget
        id: report
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/mise_cve_report.py \
            --trivy-json mise-trivy.json \
            --root "${MISE_INSTALLS}" \
            --out mise-cve-report.md \
            --json-out mise-cve-report.json

      # From here on `always()`: the report is most worth reading on the run
      # that went red, and the step above exits 1 precisely then.
      - name: Put the report in the job summary
        if: always()
        shell: bash
        run: cat mise-cve-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Post it on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -s mise-cve-report.md ] || exit 0
          # The marker is the first line of the report and is what the upsert
          # matches on — one thread, edited in place, the same shape as the
          # vuln-scan and pr-checklist comments.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- mise-cve -->")) | .id' \
            | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@mise-cve-report.md >/dev/null
            echo "Updated comment $existing"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@mise-cve-report.md >/dev/null
            echo "Posted a new comment"
          fi

      - name: Keep the raw scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mise-toolchain-cves
          path: |
            mise-trivy.json
            mise-cve-report.md
            mise-cve-report.json
          retention-days: 14
