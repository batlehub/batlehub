name: PR checklist
# What this pull request's diff implies, posted on it as a checklist.
#
# **Advisory, and deliberately so.** Every other workflow here fails on what it
# can decide mechanically; this one answers what they cannot — which of this
# repository's written obligations the changed paths pull in. A new
# `RegistryKind` variant owes nine things in eight files; a file under
# `migrations/` owes a `mig!` entry; a `values.yaml` edit owes a regenerated
# chart README. Those rules are real, they are written down, and they are the
# ones a hurried author skips.
#
# It does not gate the merge. A required check that turns green when somebody
# ticks a box measures nothing but the ticking, and a bot's reading of a diff
# is not a reason to block a human's merge. What it does is put the list where
# the review happens, with the items the diff suggests are *missing* marked.
#
# One comment per pull request, edited in place on every push, so the
# conversation is not buried under a wall of near-identical reports — the same
# shape as the SonarCloud gate comment beside it.
# **`pull_request_target`, and the head is never checked out** (RFC 0041 §6.5,
# decision 47). The checklist warns a reviewer about changes to the files a
# gate reads (`GATE_INPUTS` in the script); running it from the pull request
# would let that pull request delete the warning about itself. Here the
# workflow and the script are the base branch's, the changed paths come from
# the pulls/files API, and nothing from the head is executed or even written
# to disk beyond that JSON. `pull_request_target` also hands a fork's pull
# request a token that can comment, so the post step no longer fails on forks.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  checklist:
    name: Derive the checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base branch — the default ref of `pull_request_target`. Never the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The files this pull request changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --paginate --slurp > "$RUNNER_TEMP/files.json"
          jq -r '.[][].filename' "$RUNNER_TEMP/files.json"
      - name: Build the checklist
        run: |
          python3 -I .github/scripts/pr_checklist.py --api-files "$RUNNER_TEMP/files.json" \
            | tee "$RUNNER_TEMP/checklist.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post it on the pull request
        # Never fails the job: the checklist is in the step summary either way.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pr-checklist -->")) | .id' \
            | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@"$RUNNER_TEMP/checklist.md" >/dev/null
            echo "Updated comment $existing"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/checklist.md" >/dev/null
            echo "Posted a new comment"
          fi
