name: Frontend Test
on:
  push:
    branches: ["main"]
    paths:
      - "ui/**/*.ts"
      - "ui/**/*.vue"
      - "ui/package.json"
      - "ui/pnpm-lock.yaml"
      - "ui/vite.config.ts"
      - ".github/workflows/front-test.yaml"
      # `registryTypes.docs.test.ts` compares the console's setup snippets
      # against `docs/registries/*.md`. It lives in `ui/`, but half of what it
      # asserts lives here — so a docs-only edit that breaks the agreement, or
      # one that fixes a drift and should lower the pinned baseline, has to run
      # it too. A gate that does not run is not a gate.
      - "docs/registries/**"
      # The editor credential patch (RFC 0011) is TypeScript with no build
      # and no dependencies — `node --test` strips its types. It runs here
      # because this is the workflow that has a Node, not because it is part
      # of the console.
      - "patches/che-code/**"
  pull_request:
    branches: ["main"]
    paths:
      - "ui/**/*.ts"
      - "ui/**/*.vue"
      - "ui/package.json"
      - "ui/pnpm-lock.yaml"
      - "ui/vite.config.ts"
      - ".github/workflows/front-test.yaml"
      # `registryTypes.docs.test.ts` compares the console's setup snippets
      # against `docs/registries/*.md`. It lives in `ui/`, but half of what it
      # asserts lives here — so a docs-only edit that breaks the agreement, or
      # one that fixes a drift and should lower the pinned baseline, has to run
      # it too. A gate that does not run is not a gate.
      - "docs/registries/**"
      # The editor credential patch (RFC 0011) is TypeScript with no build
      # and no dependencies — `node --test` strips its types. It runs here
      # because this is the workflow that has a Node, not because it is part
      # of the console.
      - "patches/che-code/**"
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # pnpm must be installed before setup-node so its cache step can resolve
      # the pnpm store directory. Same action/pin as .forgejo/workflows/updatecli.yml.
      # (Corepack is not used: Node stopped distributing it in v25.)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # --frozen-lockfile fails the job if pnpm-lock.yaml would need updating
      # (the `npm ci` equivalent). --ignore-scripts states the script policy on the
      # command line rather than relying on pnpm's default deny + the `allowBuilds`
      # list in ui/pnpm-workspace.yaml alone; neither package.json here declares a
      # lifecycle script, so nothing this project needs is skipped.
      # Before the install, deliberately: it needs no dependency at all, so a
      # broken lockfile should not be able to hide a broken patch.
      - name: Editor credential patch (RFC 0011)
        # The patch lives at the repo root, not under `ui/`, so it opts out of
        # this job's `working-directory: ui` default.
        working-directory: .
        run: node --test patches/che-code/vsxRegistryAuth.test.ts
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate OpenAPI spec
        working-directory: .
        run: cargo run -p batlehub-server -- --config config.example.toml dump-spec > ui/openapi.json
      - name: Generate TypeScript client
        run: pnpm run generate
      - name: Run tests with coverage
        run: pnpm run coverage
