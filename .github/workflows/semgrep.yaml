name: Semgrep
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "50 23 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # RFC 0041 decision 28: no workflow-level `paths:` (a skipped pull request
  # would leave `required` "Expected"); this job applies them instead.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: filter
        uses: ./.github/actions/required-gate
        with:
          paths: |
            **/*.rs
            **/*.ts
            **/*.vue
            .github/workflows/semgrep.yaml
            .github/scripts/required_gate.py
            .github/actions/required-gate/action.yml

  semgrep:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pipx is preinstalled on GitHub-hosted runners.
      - name: Install Semgrep
        run: pipx install semgrep
      # Produce SARIF for the Security tab (writes the file even when it fails).
      # ERROR and WARNING: a WARNING is `report` on the grid of
      # security-scanning.md (RFC 0041 §6.7) — in the Security tab, never
      # failing. Only the gate step below blocks, on ERROR.
      - name: Semgrep scan (SARIF)
        run: |
          semgrep scan \
            --config p/rust --config p/typescript --config p/secrets \
            --severity ERROR --severity WARNING \
            --sarif --output semgrep.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      # The gate — non-zero exit on any ERROR-severity finding.
      - name: Semgrep scan (gate)
        run: |
          semgrep scan \
            --config p/rust --config p/typescript --config p/secrets \
            --severity ERROR \
            --error

  # The one check the `main` ruleset requires: every job succeeded, or the
  # gate skipped them all (RFC 0041 decision 28).
  required:
    # Unique across workflows: a ruleset matches a required check by this name.
    name: semgrep.yaml / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, semgrep]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I .github/scripts/required_gate.py verdict "$NEEDS"
