name: SonarCloud
on:
  push:
    branches: ["main"]
    paths:
      - "crates/**"
      - "server/**"
      - "cli/**"
      - "ui/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "ui/package*.json"
      - "sonar-project.properties"
      - ".github/workflows/sonar.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/**"
      - "server/**"
      - "cli/**"
      - "ui/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "ui/package*.json"
      - "sonar-project.properties"
      - ".github/workflows/sonar.yaml"
      - ".github/scripts/sonar_quality_gate.py"
  workflow_dispatch:
permissions:
  contents: read
  # `write`, not `read`: the gate result is posted back as a pull request
  # comment. A fork's `GITHUB_TOKEN` stays read-only whatever this says, but a
  # fork has no `SONAR_TOKEN` either, so the scan does not run there at all.
  pull-requests: write
env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://postgres:testpass@localhost:5432/postgres
  S3_TEST_ENDPOINT: http://localhost:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  REDIS_URL: redis://localhost:6379
  COVERAGE_EXCLUDE: >-
    server/src/(main|server_factory|setup|stores|watcher)\.rs|crates/web/src/handlers/auth/oidc(\.rs|/)|crates/web/src/handlers/back_office/health/system\.rs|crates/adapters/src/db/|crates/adapters/src/registry/(cargo|npm)\.rs|crates/adapters/src/registry/github/|crates/adapters/src/notification/postgres\.rs|crates/adapters/src/sbom/fetcher\.rs|crates/adapters/src/cache/(postgres|banner_redis)\.rs|crates/adapters/src/local_registry/postgres\.rs|crates/adapters/src/rate_limit/(postgres|ip_block_postgres)\.rs|crates/adapters/src/storage/router/|cli/src/tui/|cli/src/(api|cli)/owner\.rs
jobs:
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ROOT_USER: minioadmin
          RUSTFS_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # ── Rust toolchain (needed early to dump the OpenAPI spec the frontend
      #    client is generated from, then reused for Rust coverage) ─────────────
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      # ── Frontend coverage ────────────────────────────────────────────────────
      # pnpm must be installed before setup-node so its cache step can resolve
      # the pnpm store directory. Same action/pin as .forgejo/workflows/updatecli.yml.
      # (Corepack is not used: Node stopped distributing it in v25.)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # --frozen-lockfile is the `npm ci` equivalent. --ignore-scripts states the
      # script policy on the command line rather than relying on pnpm's default
      # deny + the `allowBuilds` list in ui/pnpm-workspace.yaml alone; no
      # package.json here declares a lifecycle script, so nothing is skipped.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: ui
      # The generated client (ui/src/client/) and ui/openapi.json are gitignored,
      # so they must be produced before the Vitest coverage run — otherwise the
      # suites that import `@/client/*` fail to resolve. Mirrors front-test.yaml.
      - name: Generate OpenAPI spec
        run: cargo run -p batlehub-server -- --config config.example.toml dump-spec > ui/openapi.json
      - name: Generate TypeScript client
        run: pnpm run generate
        working-directory: ui
      - name: Generate frontend coverage (lcov)
        run: pnpm run coverage
        working-directory: ui
        env:
          CI: "true"
      # ── Rust coverage (workspace + integration tests) ────────────────────────
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Clean previous coverage data
        run: cargo llvm-cov clean --workspace
      - name: Coverage — workspace unit + doc tests
        run: >-
          cargo llvm-cov --no-report --workspace --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      - name: Coverage — pg_cache integration tests
        run: cargo llvm-cov --no-report -p batlehub-adapters --test pg_cache
      - name: Coverage — pg_vulnerability integration tests
        run: cargo llvm-cov --no-report -p batlehub-adapters --test pg_vulnerability
      - name: Coverage — local_registry integration tests
        run: cargo llvm-cov --no-report -p batlehub-adapters --test local_registry
      - name: Coverage — artifact_meta integration tests
        run: cargo llvm-cov --no-report -p batlehub-adapters --test artifact_meta
      - name: Coverage — pg_rate_limit integration tests
        run: cargo llvm-cov --no-report -p batlehub-adapters --test pg_rate_limit
      - name: Coverage — storage_router integration tests
        run: cargo llvm-cov --no-report -p batlehub-adapters --test storage_router
      - name: Coverage — s3_storage integration tests
        run: >-
          cargo llvm-cov --no-report -p batlehub-adapters --features storage-s3 --test s3_storage
      - name: Coverage — actions_oidc integration tests
        run: cargo llvm-cov --no-report -p batlehub-adapters --test actions_oidc
      - name: Coverage — redis_cache integration tests
        run: >-
          cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_cache
      - name: Coverage — redis_rate_limit integration tests
        run: >-
          cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_rate_limit
      - name: Generate LCOV report
        run: >-
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "${{ env.COVERAGE_EXCLUDE }}"
      # ── SonarCloud scan ──────────────────────────────────────────────────────
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── Quality gate ─────────────────────────────────────────────────────────
      # The scan step submits the analysis and returns, so on its own it is
      # green whatever the gate says. These three steps wait for the server to
      # finish, publish the verdict where it will be read, and only then fail.
      - name: Wait for the quality gate
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 .github/scripts/sonar_quality_gate.py \
            --pull-request "${{ github.event.pull_request.number }}" \
            | tee quality-gate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the quality gate on the pull request
        # No `always()`: a red gate is a *successful* run of the step above, so
        # this still runs for the case that matters. If that step failed
        # outright there is no verdict to report, and the job stops there.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One comment per pull request, edited in place: a new comment per
          # push buries the conversation under a wall of near-identical reports.
          # The marker is the first line of the body the script emits.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- sonar-quality-gate -->")) | .id' \
            | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@quality-gate.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@quality-gate.md >/dev/null
          fi

      - name: Fail on a red quality gate
        if: steps.gate.outputs.status != 'PASSED'
        run: |
          echo "::error::SonarCloud quality gate: ${{ steps.gate.outputs.status }} — see the job summary"
          exit 1
