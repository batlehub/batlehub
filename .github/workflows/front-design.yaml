name: Frontend Design Gates
# The design system's rules, enforced (RFC 0003 Phase 9).
#
# Four gates, and the split between them is deliberate. Three are static and run
# anywhere; the fourth needs a real browser, which is the whole reason it lives
# in CI rather than in a pre-commit hook:
#
#   - impeccable detect  — anti-pattern rules over source
#   - i18n:check         — no hardcoded user-visible strings (pinned at 0)
#   - ui:tokens:check    — the docs site's token copy has not drifted
#   - rendered pass      — the detector against real pages at two viewports,
#                          plus axe. Contrast on painted pixels, focus rings and
#                          reflow cannot be checked by reading source, and a
#                          rule that is never executed is not a rule.
on:
  push:
    branches: ["main"]
    paths:
      - "ui/**"
      - "docs/**"
      - "DESIGN.md"
      - ".github/workflows/front-design.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "ui/**"
      - "docs/**"
      - "DESIGN.md"
      - ".github/workflows/front-design.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    name: Static design gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui

      # Anti-pattern rules over source. No LLM, no API key, no network.
      - name: Impeccable detector
        run: npx --yes impeccable detect ui/src docs/.vitepress

      # Pinned at 0: a new hardcoded user-visible string fails here.
      - name: No untranslated strings
        run: pnpm run i18n:check
        working-directory: ui

      # The tokens are declared once; the docs site holds a committed copy.
      # A drift means someone edited one of the two and not the other.
      - name: Design tokens in sync
        run: |
          cp ui/src/design/tokens.css docs/.vitepress/theme/tokens.css
          if ! git diff --quiet -- docs/.vitepress/theme/tokens.css; then
            echo "::error::the docs site's token copy is stale — run 'task ui:tokens' and commit"
            git --no-pager diff -- docs/.vitepress/theme/tokens.css
            exit 1
          fi

      # Same arrangement, same failure mode: the published roadmap page is
      # generated from the canonical ROADMAP.md. The two were hand-maintained
      # and 393 lines apart before RFC 0005.
      - name: Published roadmap in sync
        run: |
          {
            printf '%s\n' '---' 'reference: true' '---' ''
            echo '<!-- Generated from ROADMAP.md by `task docs:roadmap`. Do not edit this file. -->'
            echo
            cat ROADMAP.md
          } > docs/guide/roadmap.md
          if ! git diff --quiet -- docs/guide/roadmap.md; then
            echo "::error::the published roadmap is stale — run 'task docs:roadmap' and commit"
            git --no-pager diff -- docs/guide/roadmap.md
            exit 1
          fi

      # Every cross-reference in the documentation resolves, and no published
      # page is unreachable. Nothing checked this before RFC 0005 and two
      # references were already dead. No install needed — the script is plain
      # Node with no dependencies.
      - name: Documentation links
        run: node build/check-links.mjs
        working-directory: docs

      # Shape, not rendering: heading depth, section numbering, and the
      # `reference: true` declaration a page over 4 000 words has to make. The
      # numbering assertion is the one that finds a subsection filed under the
      # wrong parent, which is how a `6.16` sat inside section 11 of the biggest
      # page in the documentation through every green build (RFC 0005-bis).
      - name: Documentation structure
        run: node build/check-structure.mjs
        working-directory: docs

      # One sidebar per page, no "see also" that loops back, and the counts.
      - name: Documentation audience
        run: node build/check-audience.mjs
        working-directory: docs

      # The config generator's own harness: its pure half renders each scenario
      # and the assertions hold; the fixtures crates/config loads with the real
      # parser (`cargo test -p batlehub-config --test config_generator_fixtures`,
      # in the test workflow) have not drifted from the generator. Plain Node,
      # types stripped by Node itself, no install.
      - name: Config generator harness
        run: |
          node --test build/config-generator.test.ts
          node build/config-generator-fixtures.ts --check
        working-directory: docs

  rendered:
    name: Rendered page gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui

      # `ui/src/client/` is generated and gitignored; the spec it is generated
      # from (`ui/openapi.json`) is tracked. Without this step the type-check in
      # `pnpm run build` cannot resolve `@/client/*` and the build never gets as
      # far as emitting a page to measure. Mirrors front-test.yaml and
      # sonar.yaml — minus their `dump-spec` step, since this gate measures
      # rendered pages rather than the contract, so the committed spec is the
      # right input and there is no reason to build the server here.
      - name: Generate TypeScript client
        run: pnpm run generate
        working-directory: ui

      - name: Build the SPA
        run: pnpm run build
        working-directory: ui

      # The build plus a stubbed read-only API on one origin.
      #
      # This replaces `serve -s ui/dist`, and the comment that used to sit here
      # was wrong: it claimed the pages "fall back to their error and empty
      # states". They did not. With no API the identity fetch never resolves,
      # every guard redirects and every page rendered as an empty shell — six
      # pages reported clean while none of them existed.
      #
      # Stubbed rather than a real backend, deliberately: a fresh backend is an
      # *empty* backend, and an empty page is exactly what measures nothing.
      # Eight of the twenty-one endpoints returned `[]` even against a populated
      # development instance. The fixtures carry rows, because rows are what
      # expose contrast, reflow and truncation — and `fixtures.test.ts` checks
      # them against openapi.json so they cannot drift from the contract.
      - name: Serve the build with a stubbed API
        run: |
          node ui/build/stub-server.mjs --port 4173 --dist ui/dist &
          npx --yes wait-on http://127.0.0.1:4173 -t 60000

      # Two viewports here, four in the rendered harness below. The split is
      # deliberate: these rules are anti-pattern rules over what is on the page,
      # and they do not change between 1024 and 768 — what changes at those
      # widths is overflow and reflow, which axe and the ramp check measure, so
      # that is where the two middle widths were added. Doubling this loop would
      # double the slowest job in the workflow to re-measure width-independent
      # findings.
      #
      # Every route reachable without a session. `/me/*` and `/admin/*` sit
      # behind router guards and would redirect, so scanning them here would
      # measure the login page over and over — see RFC 0003 §13.
      #
      # One `detect` invocation per route, deliberately: passing every URL to a
      # single run reuses one browser session with a ~100ms settle, and an SPA
      # that hydrates asynchronously then gets measured mid-hydration. Three
      # identical batched runs returned 1, 2 and 1 findings. A gate that fails
      # at random is a gate people retry until it passes.
      - name: Impeccable detector — desktop and mobile
        run: |
          fail=0
          for viewport in 1440x900 390x844; do
            for route in / /login /packages /packages/npm/react /setup /tools/access-check /tools/url-mapper; do
              echo "::group::$viewport $route"
              npx --yes impeccable detect --viewport "$viewport" "http://127.0.0.1:4173$route" || fail=1
              echo "::endgroup::"
            done
          done
          exit $fail

      # axe used to run here over the public routes via `@axe-core/cli`. It now
      # runs in the harness below, over these routes *and* the authenticated
      # ones, with one set of assertions — because `@axe-core/cli` does not know
      # what a type ramp is, and running it here meant the ramp and display-face
      # checks covered `/admin/*`, `/me/*` and `/` and nothing else. `/packages`
      # — the one page with a checked-in specification of its own appearance —
      # was the significant page no ramp check ran against, which is how its
      # 104px display element became 24px with this workflow green
      # (RFC 0004-bis §4.4).

      # The rendered harness drives an existing browser over CDP rather
      # than launching its own — locally that is the workspace's `che-browser`
      # sidecar, and here it is this. Same contract either way: something is
      # listening on 9222.
      - name: Start a headless browser
        uses: ./.github/actions/headless-chrome

      # Every rendered route: the 15 admin pages and 4 account pages — the
      # largest surface in the console, and the one no URL-based scanner can
      # reach, since they sit behind router guards — plus the six public ones.
      # This harness seeds a token into localStorage before the app boots (the
      # anonymous plan seeds none), then runs axe and a type-ramp check in the
      # page.
      #
      # The tokens are not secrets. The stub answers /api/v1/me with an admin
      # identity whatever is presented, because what is under test is rendering,
      # not authentication — so there is nothing here worth protecting, and the
      # gate needs no repository secrets to run.
      #
      # Nothing is pinned in the script's EXPECTED_FAIL, and that is a result.
      # `/packages/npm/react` was added expecting to go red — it was the densest
      # page in the console with no gate on it at all — and it enters green,
      # because the pass that added it fixed what it would have reported. A pin
      # on a passing route fails this gate by design, so the honest entry is no
      # entry.
      - name: Rendered gates — every route, axe and type ramp
        env:
          BATLEHUB_ADMIN_TOKEN: stub
          BATLEHUB_USER_TOKEN: stub
          BASE: http://127.0.0.1:4173
        run: node build/design-routes.mjs
        working-directory: ui

  docs-rendered:
    name: Rendered page gates — docs site
    runs-on: ubuntu-latest
    # The same class of gate the console has, on the surface every prospective
    # user actually reads (RFC 0005 phase 4). Before this, the public site's
    # entire design coverage was the static scan in the job above.
    #
    # It differs from the console's in one way that follows from the subject:
    # there is no route list. A static site's pages are whatever the build
    # emitted, and `design-routes.mjs` reads them off `.vitepress/dist` — a page
    # added and never added to a list is exactly the page that drifts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs

      # No BASE_URL: the gate measures paint, and the publish prefix does not
      # change one. `.forgejo/workflows/website.yaml` is what builds for deploy.
      # `pnpm run docs:build`, not `vitepress build`: the script is a wrapper
      # that turns a server-render failure into a build failure. VitePress
      # prints the stack and exits 0, and the page ships as an empty shell.
      - name: Build the site
        run: pnpm run docs:build
        working-directory: docs

      # `vitepress preview` maps the output directory once at startup, so it has
      # to be started after the build it is meant to serve.
      - name: Serve the build
        run: |
          pnpm exec vitepress preview --port 4173 >/dev/null 2>&1 &
          npx --yes wait-on http://127.0.0.1:4173 -t 60000
        working-directory: docs

      - name: Start a headless browser
        uses: ./.github/actions/headless-chrome

      # axe at WCAG 2.2 AA, the two type ramps per face, zero radius, no blurred
      # shadow, no off-box request, and both authored renditions — over every
      # built page at 1440 and 390.
      - name: Rendered gates — every page, both renditions
        env:
          BASE: http://127.0.0.1:4173
        run: node build/design-routes.mjs
        working-directory: docs
