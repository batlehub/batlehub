name: Supply chain (postmortem)
# Dependency supply-chain gate (RFC 0041 §6.5): known vulnerabilities and
# known-malicious packages in each dependency root, plus source-repo
# reputation in the SARIF. Complements `back-dep-audit.yaml` (RUSTSEC) and
# `dep-audit-frontend.yaml` (pnpm audit).
#
# What each job decides, from the grid of docs/contributing/security-scanning.md:
#
#   | root            | push, schedule             | pull request                          |
#   | --------------- | -------------------------- | ------------------------------------- |
#   | Rust, UI        | block on any advisory ≥ high | block-new: ≥ high on a package the PR adds or changes |
#   | docs (builds)   | block at critical          | block at critical                     |
#   | all three       | block on any `MAL-`        | block on any `MAL-`, existing packages included |
#
# The verdict is `postmortem_new_risk.py`'s, never postmortem's exit code:
# postmortem 2.9.2 exits 0 and writes an empty SARIF when vuln.mlab.sh does not
# answer, `--fail-on-vuln` included (§17 M18), and ranks a `MAL-` record
# `medium` (§17 M4). The script reads the JSON's diagnostics and fails closed.
#
# **Nothing the pull request controls picks the binary, the script or the
# action** (decision 39). The trusted tree is checked out into `base/` — the
# merge's first parent on a PR, or the pushed commit itself — and the tree
# under test into `head/`; postmortem is installed from `base/mise.toml` +
# `base/mise.lock` and called by absolute path,
# `base/.github/scripts/postmortem_new_risk.py` judges, and the composite
# action is copied from `base/` before it is used. A PR can still rewrite this
# workflow; review is the gate for that (decisions 30, 47) and
# pr-checklist.yaml points at it.
#
# **`VULN_MLAB_TOKEN` is required** (decision 50). An anonymous scan reads 512
# packages and says nothing about the rest; the Rust root and ui/ are over it,
# so without the token those two jobs fail, by design, instead of passing on a
# cut scan. Dependabot runs need it as a *Dependabot* secret too. A fork's pull
# request never gets the secret: a maintainer runs postmortem-fork.yaml on its
# reviewed head instead.
#
# Three *separate jobs*, not a matrix: Code Scanning tells the SARIF uploads
# apart by a category derived from the job id, and the job ids are the ones
# the composite action used, so the alerts already open keep their category.
#
# Deliberately unfiltered by path: advisories and reputation are fetched live,
# so an unchanged lockfile can change verdict without a commit.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Decision 46: a maintainer's approval of the head re-runs the gate, which
  # then reports a reputation block instead of failing on it.
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
# A review run has its own group: a comment or a bot review must not cancel the
# push's run mid-way, which would post a red `postmortem.yaml / required`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_review' && 'review-' || '' }}${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  rust:
    name: postmortem — Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
      pull-requests: read # the approving review of decision 46
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 2
          persist-credentials: false
      # On a pull request head is refs/pull/N/merge, built on main as it is
      # now; pull_request.base.sha is not refreshed when main moves, so main's
      # own bumps would be judged as the PR's. The merge's first parent is the
      # base it was built on, and a commit of main: still the trusted side.
      - id: base
        env:
          IS_PR: ${{ github.event.pull_request != null }}
        run: |
          if [ "$IS_PR" = true ]; then rev=HEAD^1; else rev=HEAD; fi
          echo "sha=$(git -C head rev-parse "$rev")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
      # The action from the trusted tree, like the script and the binary it
      # runs: a pull request cannot pick the code its own gate executes. The
      # head's copy only on the pull request that adds the action (bootstrap).
      - name: The gate action, from base
        run: |
          src="base"
          if [ ! -f base/.github/actions/postmortem-gate/action.yml ]; then
            echo "::warning::the base has no postmortem-gate action — using the head's (bootstrap only)"
            src="head"
          fi
          mkdir -p trusted-actions
          cp -r "$src/.github/actions/postmortem-gate" trusted-actions/
      - name: postmortem gate (Rust)
        uses: ./trusted-actions/postmortem-gate
        with:
          root: "."
          fail-on: high
          diff: ${{ github.event.pull_request != null }}
          pr: ${{ github.event.pull_request.number }}
          # Reputation block-new (RFC 0041 phase 4, decisions 23, 49).
          online: ${{ github.event.pull_request != null }}
          harden: "true"
          out: pm-out
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }}
          github-token: ${{ github.token }}
      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('pm-out/tree.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: pm-out/tree.sarif
          checkout_path: ${{ github.workspace }}/head

  ui:
    name: postmortem — UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 2
          persist-credentials: false
      # On a pull request head is refs/pull/N/merge, built on main as it is
      # now; pull_request.base.sha is not refreshed when main moves, so main's
      # own bumps would be judged as the PR's. The merge's first parent is the
      # base it was built on, and a commit of main: still the trusted side.
      - id: base
        env:
          IS_PR: ${{ github.event.pull_request != null }}
        run: |
          if [ "$IS_PR" = true ]; then rev=HEAD^1; else rev=HEAD; fi
          echo "sha=$(git -C head rev-parse "$rev")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
      # The action from the trusted tree, like the script and the binary it
      # runs: a pull request cannot pick the code its own gate executes. The
      # head's copy only on the pull request that adds the action (bootstrap).
      - name: The gate action, from base
        run: |
          src="base"
          if [ ! -f base/.github/actions/postmortem-gate/action.yml ]; then
            echo "::warning::the base has no postmortem-gate action — using the head's (bootstrap only)"
            src="head"
          fi
          mkdir -p trusted-actions
          cp -r "$src/.github/actions/postmortem-gate" trusted-actions/
      - name: postmortem gate (UI)
        uses: ./trusted-actions/postmortem-gate
        with:
          root: ui
          fail-on: high
          diff: ${{ github.event.pull_request != null }}
          pr: ${{ github.event.pull_request.number }}
          # Reputation block-new lands here a week after the Rust job's
          # (RFC 0041 §16 phase 4), once its first false positives are seen.
          online: false
          out: pm-out
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }}
          github-token: ${{ github.token }}
      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('pm-out/tree.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: pm-out/tree.sarif
          checkout_path: ${{ github.workspace }}/head

  # `builds`, not `ships` (decisions 3 and 20): the whole docs tree is build
  # tooling, so it blocks at critical, on every event; what the published site
  # bundles is audited at high by `pnpm audit --prod` in dep-audit-frontend.yaml.
  docs:
    name: postmortem — Website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 2
          persist-credentials: false
      # On a pull request head is refs/pull/N/merge, built on main as it is
      # now; pull_request.base.sha is not refreshed when main moves, so main's
      # own bumps would be judged as the PR's. The merge's first parent is the
      # base it was built on, and a commit of main: still the trusted side.
      - id: base
        env:
          IS_PR: ${{ github.event.pull_request != null }}
        run: |
          if [ "$IS_PR" = true ]; then rev=HEAD^1; else rev=HEAD; fi
          echo "sha=$(git -C head rev-parse "$rev")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ steps.base.outputs.sha }}
          persist-credentials: false
      # The action from the trusted tree, like the script and the binary it
      # runs: a pull request cannot pick the code its own gate executes. The
      # head's copy only on the pull request that adds the action (bootstrap).
      - name: The gate action, from base
        run: |
          src="base"
          if [ ! -f base/.github/actions/postmortem-gate/action.yml ]; then
            echo "::warning::the base has no postmortem-gate action — using the head's (bootstrap only)"
            src="head"
          fi
          mkdir -p trusted-actions
          cp -r "$src/.github/actions/postmortem-gate" trusted-actions/
      - name: postmortem gate (Website)
        uses: ./trusted-actions/postmortem-gate
        with:
          root: docs
          fail-on: critical
          out: pm-out
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }}
          github-token: ${{ github.token }}
      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('pm-out/tree.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: pm-out/tree.sarif
          checkout_path: ${{ github.workspace }}/head

  # One issue per root on `main`, opened on a red run, updated on the next and
  # closed once green — what the action's `create-issue` did, in a job of its
  # own so the scanning jobs keep a read-only token.
  issue:
    name: postmortem issue (${{ matrix.job }})
    needs: [rust, ui, docs]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: rust, label: postmortem-rust }
          - { job: ui, label: postmortem-ui }
          - { job: docs, label: postmortem-docs }
    steps:
      - name: Open, update or close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ matrix.label }}
          RESULT: ${{ needs[matrix.job].result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          num=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          case "$RESULT" in
            failure)
              gh label create "$LABEL" --color B60205 --description "postmortem gate failing on main" --force >/dev/null
              if [ -n "$num" ]; then
                gh issue comment "$num" --body "Still failing: $RUN"
              else
                gh issue create --label "$LABEL" --title "postmortem gate failing on main ($LABEL)" \
                  --body "The \`$LABEL\` postmortem gate failed on \`main\`: $RUN — see the job summary for the package and the advisory."
              fi ;;
            success)
              if [ -n "$num" ]; then gh issue close "$num" --comment "Passing again: $RUN"; fi ;;
            *) echo "result $RESULT — leaving the issue as it is" ;;
          esac

  # The one check the `main` ruleset requires (RFC 0041 decision 28): every
  # job below succeeded. No path filter here, so no gate job.
  required:
    # Unique across workflows: a ruleset matches a required check by this name.
    name: postmortem.yaml / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [rust, ui, docs]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I .github/scripts/required_gate.py verdict "$NEEDS"
