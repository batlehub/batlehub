name: Supply chain (postmortem) — fork pull request
# RFC 0041 decision 50. A fork's pull request never receives
# `VULN_MLAB_TOKEN`, so its postmortem jobs are red by construction: the Rust
# root and ui/ hold more packages than an anonymous scan reads. A maintainer
# who has reviewed the pull request's head runs this with its number and the
# head SHA they reviewed. It runs the same gate with the token, and posts each
# verdict as a commit status on that SHA.
#
# **No code from the head runs.** Only the lockfiles and manifests of the
# head commit are checked out, sparsely, with symlinks written as plain files.
# The workflow, the composite action, postmortem (from mise.lock) and
# postmortem_new_risk.py all come from the default branch. The log lists every
# file checked out from the head.
#
# Shortcut: RFC 0041 wants this triggered by the maintainer's approving review.
# GitHub's `pull_request_review` event runs with a fork's read-only token and
# no secrets, so it cannot run this. A manual run by someone with write access,
# bound to the exact SHA they read, is that review's decision made explicit.
# The binding to an `APPROVED` review on `head.sha` is decision 46 (phase 4).
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      sha:
        description: The head commit you reviewed (full SHA)
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr }}
  cancel-in-progress: true
jobs:
  gate:
    name: postmortem — fork PR #${{ inputs.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: The pull request is still at the reviewed head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo "::error::pr must be a number"; exit 1 ;; esac
          case "$SHA" in *[!0-9a-f]*) echo "::error::sha must be a full hex SHA"; exit 1 ;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::sha must be a full 40-character SHA"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          head=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")
          if [ "$head" != "$SHA" ]; then
            echo "::error::the pull request's head is $head, not the reviewed $SHA — review the new head and run again"
            exit 1
          fi
          echo "repo=$(jq -r .head.repo.clone_url "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      # The trusted tree: the pull request's base commit, from this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ steps.pr.outputs.base }}
          persist-credentials: false

      - name: Lockfiles and manifests of the head, nothing else
        env:
          REPO: ${{ steps.pr.outputs.repo }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git init -q head
          cd head
          git config core.symlinks false
          git remote add origin "$REPO"
          git sparse-checkout set --no-cone \
            '/Cargo.lock' '/Cargo.toml' '/**/Cargo.toml' \
            '/ui/package.json' '/ui/pnpm-lock.yaml' '/ui/pnpm-workspace.yaml' \
            '/docs/package.json' '/docs/pnpm-lock.yaml' '/docs/pnpm-workspace.yaml'
          git fetch -q --depth 1 --filter=blob:none origin "$SHA"
          git checkout -q --detach FETCH_HEAD
          echo "Checked out from $SHA:"
          find . -path ./.git -prune -o -type f -print | sort

      - name: Rust
        id: rust
        continue-on-error: true
        uses: ./base/.github/actions/postmortem-gate
        with:
          root: "."
          fail-on: high
          diff: "true"
          out: pm-out/rust
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }}
          github-token: ${{ github.token }}
      - name: UI
        id: ui
        continue-on-error: true
        uses: ./base/.github/actions/postmortem-gate
        with:
          root: ui
          fail-on: high
          diff: "true"
          out: pm-out/ui
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }}
          github-token: ${{ github.token }}
      - name: Website
        id: docs
        continue-on-error: true
        uses: ./base/.github/actions/postmortem-gate
        with:
          root: docs
          fail-on: critical
          out: pm-out/docs
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }}
          github-token: ${{ github.token }}

      - name: Post the verdicts on the reviewed head
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUST: ${{ steps.rust.outcome }}
          UI: ${{ steps.ui.outcome }}
          DOCS: ${{ steps.docs.outcome }}
        run: |
          set -euo pipefail
          red=0
          for pair in "Rust:$RUST" "UI:$UI" "Website:$DOCS"; do
            name=${pair%%:*}; outcome=${pair#*:}
            state=failure; [ "$outcome" = success ] && state=success
            [ "$state" = success ] || red=1
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$state" -f context="postmortem-fork / $name" \
              -f target_url="$RUN" -f description="postmortem gate, $outcome" >/dev/null
            echo "postmortem-fork / $name: $state"
          done
          exit "$red"
