# pnpm settings for the Vue SPA.
#
# NOTE: as of pnpm 10/11 the `pnpm` field in package.json is no longer read —
# overrides and settings live here. Putting them back in package.json makes pnpm
# ignore them with only a warning, which would silently drop the pins below.
#
# ── typescript is held on the 6 line on purpose ───────────────────────────────
#
# TypeScript 7 (the native port) is the `latest` dist-tag, and `pnpm update
# --latest` will offer it. It is not taken here because `typescript-eslint`
# declares `typescript: ">=4.8.4 <6.1.0"` as a peer, and 8.70.0 is its newest
# stable release — there is no 9.x. (Re-checked 2026-09-17: the peer range is
# unchanged at 8.70.0, so TS 7 is still out.) Taking TS 7 therefore breaks `pnpm run
# lint:eslint`, which is the type-aware half of the lint gate and the job that
# feeds SARIF to Code Scanning (oxlint, the fast half, does not type-check).
# `^6.0.3` is the newest release of the 6 line. Revisit when typescript-eslint
# ships a major that widens the peer range.

# Transitive-dependency pins. js-yaml is covered by two advisories and needs
# the higher floor of the two; it reaches us through @hey-api/openapi-ts and
# eslint 8:
#
#   * GHSA-52cp-r559-cp3m — YAML merge-key chains force quadratic CPU
#     consumption, fixed in 4.3.0.
#   * GHSA-5p4m-2wfm-xmqj — fixed in 4.3.1. A `^4.3.0` pin still resolves 4.3.0
#     and leaves this one open, which is exactly what happened before this
#     comment was rewritten. Bump the floor, not just the caret.
#
# nanoid < 3.3.17 is GHSA-2v37-7h3g-55p8 (a custom generator with size 0 loops
# forever). It arrives via postcss, which every vite/@vue/compiler-sfc path
# depends on — 27 paths in this tree, none of them direct. Build-time only, but
# `pnpm audit` is not scoped to runtime deps for this workspace, so an unpinned
# nanoid fails CI.
#
# brace-expansion is covered by two advisories: GHSA-mh99-v99m-4gvg (unbounded
# expansion length OOMs the process, fixed in 5.0.8) and GHSA-rgw5-rvv9-x895
# (fixed in 5.0.9). The 5.x line exports `{ expand }` instead of a callable
# default, so the old 1.x/2.x majors cannot simply be force-upgraded — they have
# to be retired by upgrading whatever pulls them in. Both pins are needed:
#
#   * `minimatch: ^10.2.6` — minimatch 10 already depends on brace-expansion
#     ^5.0.8. This replaces minimatch 9 under js-beautify (`editorconfig`,
#     `glob@10`), which reaches us through @vue/test-utils.
#   * `brace-expansion: ^5.0.9` — minimatch 10.2.6 still declares `^5.0.8`, so
#     without this the tree resolves to the vulnerable 5.0.8. 5.0.9 satisfies
#     minimatch's own range, so this is a patch bump inside the same major.
#   * `@microsoft/eslint-formatter-sarif>eslint` — the formatter declares
#     `eslint: ^8.9.0` as a regular dependency (it should be a peer): at runtime
#     it only does `require.main.require('eslint')`, i.e. it resolves eslint
#     from the CLI that invoked it, never from its own node_modules. Pinning it
#     to the workspace eslint dedupes away the entire second eslint 8 tree
#     (minimatch 3, glob 7, rimraf 3 → brace-expansion 1.1.16).
#
# ── An override cannot fix @scalar/api-reference. Do not add one. ─────────────
#
# Every pin above works because the pinned package is *rebuilt into* the output:
# Vite resolves it from node_modules at build time, so changing the graph changes
# the bytes we ship.
#
# @scalar/api-reference is different. What ships is `dist/browser/standalone.js`,
# a bundle Scalar compiled and published in the npm tarball, which
# `build/copy-scalar.mjs` copies verbatim — there is no build step of ours in
# between. An override there would rewrite node_modules, turn `pnpm audit` green,
# and leave the served file byte-for-byte identical. That is worse than leaving
# the advisory red: it silences the alarm without touching the code the console's
# origin actually executes.
#
# Two further things follow from the same fact, and they are why the signal here
# needs a human rather than a pin:
#
#   * ~194 packages entered this lockfile with it, but only a subset is inlined
#     in the bundle — the rest is Scalar's own build tooling. An advisory in
#     those is a false positive for what we ship.
#   * Conversely an advisory in an inlined one is real, and the console origin
#     holds the bearer *and* refresh tokens, so it is worth knowing about.
#
# Remediation is therefore one of: bump @scalar/api-reference (Scalar rebuilds
# the bundle), drop it, or ignore that one advisory deliberately — see the rule
# written next to `pnpm audit` in `.tasks/security.yaml`.
#
# ── The standing instance: @ai-sdk/provider-utils. Checked 2026-09-18. ────────
#
# `pnpm audit` reports `@ai-sdk/provider-utils@4.0.5` (uncontrolled resource
# consumption, `low`, fixed in 4.0.33). It arrives as
# @scalar/api-reference → @scalar/agent-chat → ai → @ai-sdk/gateway, and both
# questions the note above raises were answered rather than assumed:
#
#   * **Is it inlined in what we serve?** Yes. `standalone.js.map` in the
#     published 1.68.0 tarball lists
#     `@ai-sdk+provider-utils@4.0.5/…/dist/index.mjs` among its 2 299 sources,
#     so this is one of the real ones, not one of the ~194 build-tooling
#     packages. The console origin holds the bearer and refresh tokens, so it
#     is worth knowing about.
#   * **Does bumping Scalar fix it?** No, and this is why there is still no
#     override here. The newest @scalar/api-reference (1.69.1) depends on
#     agent-chat 0.12.32, which pins `ai` at exactly 6.0.33, which pins
#     `@ai-sdk/provider-utils` at exactly 4.0.5. Every link is an equality, so
#     no range resolution can move it and no newer Scalar carries a fix. It
#     moves when Scalar rebuilds against a newer `ai`, and not before.
#
# So it stands, on purpose: `low` is below the `--audit-level high` the gate
# uses, so nothing is being suppressed to keep CI green. Re-check the chain
# before adding an override — if agent-chat ever loosens that pin, bumping
# Scalar becomes the fix and an override still would not be.
overrides:
  undici: ^7.28.0
  js-yaml: ^4.3.1
  nanoid: ^3.3.17
  minimatch: ^10.2.6
  brace-expansion: ^5.0.9
  '@microsoft/eslint-formatter-sarif>eslint': ^10.8.0

# Install-time lifecycle scripts are denied by default (supply-chain hardening:
# a compromised transitive dependency cannot run code at install time). Packages
# are opted in here one by one, with a reason.
#
# vue-demi: false — its postinstall only rewrites a Vue 2/3 compatibility shim.
# This project is Vue 3 only, and the build, type-check and full test suite all
# pass with the script disabled.
allowBuilds:
  vue-demi: false
