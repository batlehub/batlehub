# cargo-mutants on tier 1 (RFC 0041 §4.3, §6.4). Read from the base on a pull
# request, like the coverage floors: a PR cannot shrink what is mutated.
#
# `task mutants` runs it locally (one file: `task mutants FILE=…`);
# .github/workflows/mutants.yaml runs it nightly, 8 of 32 shards in rotation, and on the changed
# lines of a pull request.
#
# The tier-1 paths, in full. The scanner adapters are tier 1 for mutation only,
# and only their severity/kind mapping (`examine_re` below): the rest of those
# files is subprocess and sandbox plumbing that needs the real binaries.
examine_globs = [
  "crates/core/src/rules/**/*.rs",
  "crates/web/src/middleware/**/*.rs",
  "crates/adapters/src/auth/**/*.rs",
  "crates/web/src/extractors.rs",
  "crates/web/src/handlers/auth/**/*.rs",
  "crates/core/src/services/integrity.rs",
  "crates/core/src/services/local_registry/mod.rs",
  "crates/adapters/src/storage/mod.rs",
  "crates/core/src/services/verdict.rs",
  "crates/adapters/src/vulnerability/osv.rs",
  "crates/adapters/src/scanners/*.rs",
]

# Tier 1 is "outside COVERAGE_EXCLUDE" (.tasks/coverage.yaml): the SSO
# handlers need a live identity provider and are proved by the heavy suites.
exclude_globs = [
  "crates/web/src/handlers/auth/oidc.rs",
  "crates/web/src/handlers/auth/oidc/**",
]

# Within crates/adapters/src/scanners/, only the mapping functions; every other
# tier-1 path matches the first alternative whole.
examine_re = [
  '^crates/(core|web|adapters/src/(auth|storage|vulnerability))/',
  '^crates/adapters/src/scanners/[a-z]+\.rs:\d+:\d+: .*\b(classify|map|map_scan|map_timeline|map_artifact|apply|worst_failure)\b',
]

# Equivalent or unobservable mutants. Each entry says why, and is reviewed like
# code (RFC 0041 §10.2).
exclude_re = [
  # Rendering: a Display/Debug impl decides nothing.
  'impl (std::fmt::|fmt::)?(Display|Debug) for ',
  # Not `Rule::name`: authz/chain.rs decides on it (EXEMPTIBLE_GATES,
  # METADATA_DERIVED_RULES, the `deny_latest` filter), so its mutants count.
  # The streaming chunk size is a memory tuning, not a decision: any size
  # serves the same bytes (M11, the one survivor in storage/mod.rs).
  '^crates/adapters/src/storage/mod\.rs:\d+:\d+: replace \* with \+$',
  # A cache or throttle window on `Instant`: `<` and `<=` differ only when the
  # elapsed time equals the window to the nanosecond, which no test (and no
  # caller) can arrange. Survivors of the first nightlies (RFC 0041 §6.4).
  '^crates/adapters/src/auth/(actions_oidc/mod|oidc|kubernetes|user_token)\.rs:\d+:\d+: replace < with <= in (ActionsOidcAuthProvider::get_decoding_key|OidcAuthProvider::get_decoding_key|KubernetesAuthProvider::cached_review|UserTokenAuthProvider::should_record_use)$',
  # `segments.len() > 1` → `>= 1`: a single segment is empty only when the
  # value is, and `validate_path_safe` refuses an empty value before this runs,
  # while `has_traversal_after_decoding` (kind `path`) exempts a trailing empty
  # segment anyway.
  '^crates/core/src/services/local_registry/mod\.rs:\d+:\d+: replace > with >= in reject_traversal$',
  # Survivors of the 24–27 Nov rotation (the second triage).
  # `*role > matched_role` → `>=`: `Role` is a fieldless enum, so on equality
  # the mutant writes back the value already there.
  '^crates/adapters/src/auth/actions_oidc/evaluate\.rs:\d+:\d+: replace > with >= in evaluate_auth_rules$',
  # `own && status == 400` picks `warn!` over `debug!` before the same
  # `Ok(None)`, and `i == 0` only feeds that `own` flag: a log level. The
  # adapters crate captures no logs in its tests.
  '^crates/adapters/src/vulnerability/osv\.rs:\d+:\d+: replace (&& with \|\||== with !=) in OsvScanner::query_page$',
  '^crates/adapters/src/vulnerability/osv\.rs:\d+:\d+: replace == with != in <impl VulnerabilityScanner for OsvScanner>::query_batch$',
  # `f.names_malicious() && f.code != KnownMalicious` → `||` also strips the
  # citation from findings `judge` does not re-derive (non-`MAL-`, or already
  # `KNOWN_MALICIOUS`). Anchored on the column: the function's other `&&`
  # (the final comparison) is killed and must stay examined.
  '^crates/core/src/services/verdict\.rs:\d+:36: replace && with \|\| in substitution_only$',
  # The derived `Default` is `from_policy(None)`: the type documents `Default`
  # as the legacy-permissive policy.
  '^crates/web/src/middleware/proxy_trust\.rs:\d+:\d+: replace ProxyTrust::legacy_permissive -> Self with Default::default\(\)$',
]

# A refusal in tier 1 is often proved by the web suites, not by the mutated
# file's own crate; the core paths are run with `--test-workspace=true` by
# `task mutants` and the workflow (two invocations, §6.4).
test_workspace = false
